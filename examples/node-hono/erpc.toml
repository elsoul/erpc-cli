schema_version = 1
name = "node-hono-example"

[app]
runtime = "node"
entrypoint = "src/index.ts"

[build]
command = ["pnpm", "build"]
artifact = "dist/index.js"

[run]
command = ["node", "dist/index.js"]
host = "0.0.0.0"
port = 8080

[deploy]
target = "auto"

[health]
path = "/health"
timeout_seconds = 30
