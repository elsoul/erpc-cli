---
- name: Refuse stale or revoked preparation before long deployment mutations
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the exact freshly confirmed operation receipt
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - /usr/local/lib/erpc/rpc-firewall.py
          - "{{ op_family }}"
          - require-confirmed
          - "{{ erpc_fw_confirmed_run }}"
          - "{{ erpc_fw_confirmed_bundle }}"
      changed_when: false
