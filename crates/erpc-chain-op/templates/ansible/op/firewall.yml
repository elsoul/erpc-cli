---
- name: Prepare a short independently confirmed follower firewall operation
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Check immutable ownership before any firewall or unit write
      ansible.builtin.command:
        argv: [python3, "{{ op_scripts }}/control.py", within-run]
        stdin: "{{ op_request | combine({'action': 'check-deploy'}) | to_json }}"
      changed_when: false
    - name: Install the operation-bound common firewall controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../rpc-firewall.py"
        dest: /usr/local/lib/erpc/rpc-firewall.py
        owner: root
        group: root
        mode: '0700'
    - name: Install the confirmed boot policy loader
      ansible.builtin.template:
        src: "{{ op_jinja }}/firewall.service.j2"
        dest: "/etc/systemd/system/erpc-{{ op_family }}-firewall.service"
        owner: root
        group: root
        mode: '0644'
    - name: Render the candidate only inside this submitted run
      ansible.builtin.template:
        src: "{{ op_jinja }}/firewall.nft.j2"
        dest: "{{ playbook_dir }}/../../firewall-candidate.nft"
        owner: root
        group: root
        mode: '0600'
    - name: Validate candidate syntax before application
      ansible.builtin.command:
        argv: [nft, -c, -f, "{{ playbook_dir }}/../../firewall-candidate.nft"]
      changed_when: false
    - name: Read the immutable submitted archive identity
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../bundle.tar.gz"
        checksum_algorithm: sha256
      register: submitted_bundle
    - name: Apply with an operation-specific rollback timer
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/lib/erpc/rpc-firewall.py
          - "{{ op_family }}"
          - apply
          - "{{ (playbook_dir ~ '/../../..') | realpath | basename }}"
          - "{{ submitted_bundle.stat.checksum }}"
      changed_when: true
    - name: Enable boot restoration of verified policy
      ansible.builtin.systemd_service:
        name: "erpc-{{ op_family }}-firewall"
        enabled: true
        daemon_reload: true
