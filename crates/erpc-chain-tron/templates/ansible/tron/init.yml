---
- name: Reserve and prepare a dedicated TRON host without formatting storage
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - ansible.builtin.import_tasks: tasks/guard.yml
      vars: {tron_guard: guard-init}
    - name: Install distribution-maintained runtime and verification tools
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, python3, nftables, "{{ tron_java_package }}"]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Discover existing clock synchronization
      ansible.builtin.service_facts:
    - name: Preserve an existing clock daemon
      ansible.builtin.command:
        argv: [python3, "{{ tron_templates }}/time_service.py"]
        stdin: "{{ ansible_facts.services | to_json }}"
      register: tron_clock
      changed_when: false
    - name: Install time synchronization only when a fallback is needed
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
      when: (tron_clock.stdout | from_json).install_fallback | bool
    - name: Enable the selected clock daemon
      ansible.builtin.systemd_service:
        name: "{{ (tron_clock.stdout | from_json).service }}"
        enabled: true
        state: started
    - name: Create the unprivileged node account
      ansible.builtin.user:
        name: tron
        system: true
        home: /var/lib/tron
        create_home: false
        shell: /usr/sbin/nologin
    - name: Prepare fixed directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/tron, owner: root, group: tron, mode: '0750'}
        - {path: /opt/tron/releases, owner: root, group: root, mode: '0755'}
        - {path: /var/lib/tron, owner: tron, group: tron, mode: '0700'}
        - {path: /var/log/tron, owner: tron, group: tron, mode: '0700'}
        - {path: /etc/erpc/tron, owner: root, group: root, mode: '0700'}
        - {path: /etc/credstore.encrypted, owner: root, group: root, mode: '0700'}
        - {path: /usr/local/lib/erpc/tron, owner: root, group: root, mode: '0755'}
    - name: Establish immutable public ownership once
      ansible.builtin.copy:
        content: "{{ tron_contract | to_json }}\n"
        dest: /etc/tron/contract.json
        owner: root
        group: tron
        mode: '0640'
        force: false
    - ansible.builtin.import_tasks: tasks/guard.yml
      vars: {tron_guard: guard}

