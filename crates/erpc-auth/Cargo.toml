[package]
name = "erpc-auth"
description = "ERPC account authentication (RFC 8628 device flow) and credential stores for the erpc CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
erpc-core = { workspace = true }
erpc-secret = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
# The keystore's PBKDF2, HKDF and ChaCha20-Poly1305: already in the lock
# through rustls, and what `erpc storage` encrypts with.
aws-lc-rs = { workspace = true }
fs2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }
# The kernel keyring, where no Secret Service answers. Directly, not through
# keyring's `linux-native`, which needs a session keyring a process started
# outside a PAM login does not have.
linux-keyutils = { version = "0.2", features = ["std"] }
# crypto-rust and vendored are enabled on dbus-secret-service directly, not
# through keyring's features of the same name. Those forward to
# `secret-service?/crypto-rust` and `openssl?/vendored`, and a weak feature
# reference is enough to put both crates in Cargo.lock even though no target
# compiles them -- which cargo-audit then reports advisories for.
dbus-secret-service = { version = "4.1", default-features = false, features = [
  "crypto-rust",
  "vendored",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
