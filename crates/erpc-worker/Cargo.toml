[package]
name = "erpc-worker"
description = "The erpc.toml manifest, app templates, releases and server layout behind `erpc worker`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true

[features]
default = ["templates"]
# The app templates `erpc worker init` writes, compiled in. The agent on a
# server has no use for them and builds without.
templates = ["dep:include_dir"]

[dependencies]
erpc-core.workspace = true
erpc-secret.workspace = true
include_dir = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
# `serde` so a secret the agent is handed goes straight into a buffer that
# is wiped.
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
