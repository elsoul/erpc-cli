#
# The Ansible configuration of a run on the node. Modules run with the
# system Python, which has python3-apt for the apt module; Ansible itself
# runs from erpc's pinned venv.

[defaults]
interpreter_python = /usr/bin/python3
retry_files_enabled = False
host_key_checking = False
forks = 1
nocows = True
callback_result_format = yaml
deprecation_warnings = False

[privilege_escalation]
become_method = sudo
