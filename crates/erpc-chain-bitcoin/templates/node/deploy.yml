---
- name: Prepare or deploy an owned Bitcoin RPC node
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    btc_root: /var/lib/erpc-bitcoin
    btc_opt: /opt/erpc-bitcoin
    btc_release: "{{ btc_opt }}/releases/{{ btc_version }}-{{ btc_platform }}"
  tasks:
    # This carried helper runs BEFORE package/config/service mutations. A failed
    # cross-network init cannot replace the old owner's installed controller.
    - name: Check or reserve the immutable remote host contract
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py"]
        stdin: "{{ btc_request | combine({'action': 'prepare'}) | to_json }}"
      changed_when: false

    - name: Install host prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, gnupg, python3, tar]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create isolated data and release directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ btc_opt }}/releases", owner: root, mode: '0755' }
        - { path: /etc/erpc, owner: root, mode: '0755' }
        - { path: /usr/local/lib/erpc, owner: root, mode: '0755' }

    - name: Install and start the selected release
      when: btc_phase != 'init'
      block:
        - name: Stop the owned node and persist the desired installation
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py"]
            stdin: "{{ btc_request | combine({'action': 'begin-install'}) | to_json }}"
          changed_when: true

        - name: Authenticate both manifest signatures and exact selected archive
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -I
              - "{{ playbook_dir }}/verify.py"
              - "{{ playbook_dir }}/SHA256SUMS"
              - "{{ playbook_dir }}/SHA256SUMS.asc"
              - "{{ playbook_dir }}/../gpg"
              - "{{ btc_archive }}"
              - "{{ btc_sha256 }}"
          changed_when: false

        - name: Download the archive with its authenticated pinned digest
          ansible.builtin.get_url:
            url: "{{ btc_archive_url }}"
            dest: "{{ btc_opt }}/{{ btc_archive }}"
            checksum: "sha256:{{ btc_sha256 }}"
            owner: root
            group: root
            mode: '0600'

        - name: Rehash the complete archive before any extraction or execution
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/verify.py", archive, "{{ btc_opt }}/{{ btc_archive }}", "{{ btc_sha256 }}"]
          changed_when: false

        - name: Publish the authenticated release under its still-current caller intent
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py"]
            stdin: "{{ btc_request | combine({'action': 'install-artifacts'}) | to_json }}"
          changed_when: true

        - name: Start through the same owner and network guard used by ongoing operations
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py"]
            stdin: "{{ btc_request | combine({'action': 'activate'}) | to_json }}"
          changed_when: true

        - name: Remove the verified download archive
          ansible.builtin.file:
            path: "{{ btc_opt }}/{{ btc_archive }}"
            state: absent
