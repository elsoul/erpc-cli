not_written_busy = "環境 {env} のサーバーにはあなたの鍵が置かれ、パスワードでのログインは無効になりました。ただし、ERPC のアカウントが混み合ったままで、アドレスとホスト鍵を受け取りませんでした"
not_written_error = "環境 {env} のサーバーにはあなたの鍵が置かれ、パスワードでのログインは無効になりました。ただし、この実行ではアドレスとホスト鍵を ERPC のアカウントの記録に書き込んでいません: {why}"
