unreadable = "環境 {env} のサーバーの最初のログインについての ERPC のアカウントの答えを読めませんでした。ログインしていません"
odd_name = "ERPC のアカウントが示す環境 {env} のサーバーのログイン名は、erpc が使わない形です。ログインしていません"
