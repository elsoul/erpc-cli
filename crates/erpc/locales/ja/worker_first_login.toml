no_password_deleted = "ERPC のアカウントがパスワードを削除しました（渡してから 1 日で削除します）。そのため erpc は最初のログインができません。ERPC サポートに相談できます"
no_password_none = "ERPC のアカウントにパスワードがないので、erpc は最初のログインができません。ERPC サポートに相談できます"
not_secured = "環境 {env} のサーバーへの最初のログインが終わりませんでした: {why}"
