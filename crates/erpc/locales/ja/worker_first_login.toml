needs_terminal = "ERPC のアカウントには、環境 {env} のサーバーのホスト鍵がまだ記録されていません。どのホスト鍵を信頼するかが決まるため、erpc は端末で尋ねてからでないと記録しません（--yes では進みません）"
needs_terminal_hint = "端末で、--json を付けずに `erpc worker deploy{scope}` を実行してください"
waiting = "環境 {env} のサーバーは、まだログインできる状態ではありません。{secs} 秒後に ERPC のアカウントにもう一度尋ねます"
not_ready = "環境 {env} のサーバーは、約 10 分待ってもログインできる状態になりませんでした。サーバーには何も変更していません"
again_hint = "`erpc worker deploy{scope}` をもう一度実行してください。止まったところから続けます"
settled_hint = "それが片付いてから、`erpc worker deploy{scope}` をもう一度実行してください"
question = "erpc は環境 {env} のサーバー（{ip}）に一度ログインし、あなたの鍵を置いて、パスワードでのログインを無効にします。サーバーが示すホスト鍵: {fingerprint}。あなたの鍵: {key}。何も開始せず、料金もかかりません。そのあと、アドレスとこのホスト鍵は ERPC のアカウントの記録に入り、デプロイが、そのときアカウントにある内容を信頼するかを尋ねます。続けますか？"
question_done = "erpc は以前に環境 {env} のサーバー（{ip}）を、鍵でだけログインできるようにしています。サーバーが示すホスト鍵: {fingerprint}。何も開始せず、料金もかかりません。これから、アドレスとこのホスト鍵を ERPC のアカウントの記録に入れ、デプロイが、そのときアカウントにある内容を信頼するかを尋ねます。続けますか？"
declined = "ログインしていません。何も変更していません"
changed = "待つ間か尋ねる間に、環境 {env} のサーバーについての ERPC のアカウントの記録が変わりました。サーバーには何も送っていません"
cannot_log_in = "erpc は環境 {env} のサーバーにログインできません: {why}"
busy = "ERPC のアカウントが、サーバーの最初のログインをもう一度読むまで {secs} 秒待つよう求めています。サーバーには何も送っていません"
