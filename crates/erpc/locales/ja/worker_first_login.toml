not_written_unknown = "環境 {env} のサーバーにはあなたの鍵が置かれ、パスワードでのログインは無効になりました。ただし、アドレスとホスト鍵が ERPC のアカウントの記録に書き込まれたかは分かりません: {why}"
done = "環境 {env} のサーバー（{ip}）に一度ログインしました。あなたの鍵を置き、パスワードでのログインを無効にし、アドレスとホスト鍵を ERPC のアカウントの記録に入れました。"
