still_charged_lines = "{items}：アカウントの記録では、終了するまで時間単位の課金です。使用中の ERPC Worker がないので、`erpc worker delete --release-server{scope}` は端末で確認してから終了します。回線は ERPC のダッシュボードのその商品のページでも終了できます"
server_suspended_hint = "`erpc worker status{scope}` で確認できます。停止中のサーバーは、多くは ERPC クレジットの不足か支払いの未了で止まっていて、払うべきものが済むと再開することがあります。時間課金なら、すべての時間課金の 1 時間分を賄えるようになったとき。期間ごとのクレジット払いなら、次の期間分を賄えるようになったとき。カード払いなら、未払いの請求を払ったときです。停止中のまま置くと終了されることがあるので、早めに ERPC のダッシュボードでクレジットを足すか支払いを済ませてください。そのままなら、サーバーの id を添えて ERPC のサポートに連絡してください"
server_not_active_hint = "`erpc worker status{scope}` で確認できます。active になってからもう一度実行し、そのままならサーバーの id を添えて ERPC のサポートに連絡してください"

