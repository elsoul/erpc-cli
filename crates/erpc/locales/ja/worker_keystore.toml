intro = "erpc のキーストアは、これをこのマシン上の暗号化ファイル（{path} の下）に保管します。開くためのパスフレーズを、これから決めます。\nそのディレクトリをバックアップし、パスフレーズを覚えておいてください。erpc はどちらも復元できません。両方がそろわなければ、キーストアの中身は失われます（取引用の鍵の場合は、ウォレットそのものです）。\n別の方法は 1Password で、ほかのマシンからも使えます：`erpc login --store 1password-desktop`。1Password のサービスアカウントはシークレットには使えますが、取引用の鍵には使えません。"
intro_by_default = "このマシンでは `erpc login` がセッションを 1Password に保管しておらず、再起動後まで保持できるキーチェーンもありません（Secret Service がありません：ヘッドレスサーバー、WSL、SSH ログインなど）。そのため、これは erpc のキーストアに保管します。このマシン上の暗号化ファイル（{path} の下）で、開くためのパスフレーズを、これから決めます。\nそのディレクトリをバックアップし、パスフレーズを覚えておいてください。erpc はどちらも復元できません。両方がそろわなければ、キーストアの中身は失われます（取引用の鍵の場合は、ウォレットそのものです）。\n別の方法は 1Password で、ほかのマシンからも使えます：`erpc login --store 1password-desktop`。1Password のサービスアカウントはシークレットには使えますが、取引用の鍵には使えません。"
