question = "環境 {env} を ERPC のアカウントへ移しますか（{taken}）？"
declined = "移しませんでした。何も変更していません"
loses_oneway = "移すと元に戻せません。erpc.toml には account = true だけが残り、アカウントは商品 ID を返しません。"
loses_access = "移した後は、この環境のすべてのコマンドで ERPC へのサインインとアカウントへの接続が要ります。このマシンは、移したとおりにサーバーを信頼します。同じ ERPC アカウントにサインインしたほかのマシンでは、一度、端末で yes と答えてサーバーを信頼する必要があります（--yes や --json では答えられません）。ほかの ERPC アカウントからは見えません。アカウントが示すサーバーの内容が変わると、端末でもう一度尋ねます（ほかのマシンからの deploy がそのマシンのアドレスを SSH の一覧に足したときなど）。アカウントが active と示さない ERPC のサーバーには接続せず、アプリを止めることもできません。"
loses_commands = "rollback・backup・api・trades・bench はまだ使えません。firewall は、アカウントの一覧に対して使えます（一覧はそれぞれ 16 件までで、SSH の一覧には erpc 自身のアドレスも数えます）。status は、時間あたりの料金やクレジットがいつまでもつかを示さなくなります。"
loses_deploy = "deploy は --host・--user・--port・--fingerprint・--server・--plan・--grpc・--shreds・--unlimited・--udp・--udp-port・--udp-region・--udp-any-source・--forget-line・--vault・--inline を受けなくなり、--new-server と --region はアカウントの記録にサーバー・アドレス・回線・デプロイが何もない間だけ受けて、最初のデプロイと同じようにサーバーを開始します。サーバーを選ぶことも、回線を足すことや記録から外すこともできず、deploy で erpc.toml や 1Password に戻すこともできません。アカウントの記録に、終了しておらず active でもない回線がある間は、deploy は断られます。"
loses_delete = "delete --release-server はサーバーに接続せず、ワーカーも消しません。環境が使っているものすべての終了をアカウントに頼み、アカウントは、Bundle の一部として買った回線（状態にかかわらず、終了せずに環境から外します）のほかに、時間課金でないものが 1 つでもあるか、今の状態では終了できないものがあるか、結果の分からない開始がある間は、何も終了しません。そのとき、時間課金のサーバーや回線は課金されたままで、それが片付いてから delete をもう一度実行して、はじめて終了します。自分のサーバーでは端末でだけ尋ね、--yes では進まず、そこのワーカーは動き続けます。delete だけ、delete --forget、delete --forget-line は断られます。"
loses_bundle = "Bundle の一部として買った回線は取り込まれません。アカウントが断り、移動はそこで止まり、アカウントにすでに書いたものはそこに残ります。その Bundle がアカウントに記録されるまでは取り込まれることがあり、そのときは、erpc がその回線を記録から外せるのは環境を削除するときだけで、そのときも回線は終了せず、Bundle と別に終了することもできません。"
loses_others = "このマシンの環境がアカウントに保管されている間は、このマシンのほかの環境の delete --release-server --yes は、サーバーを終了するものなら断られます。ほかの環境もアカウントに保管されれば、この環境のものも同じです。--yes を付けなければ、端末で尋ねます。"
loses_more = "ほかの違いは、docs/worker.md の「What changes once moved」に挙げています。"
env_differs_hint = "erpc.toml はそのままです。続け方は、この環境を添えて ERPC のサポートに尋ねてください"
not_ready = "環境 {env} のサーバーには、erpc.toml にまだアドレスかホスト鍵がありません。今移すと、そこからは届かなくなります"
not_ready_hint = "先に `erpc worker deploy{scope}` でサーバーを用意し、そのあと移してください"

