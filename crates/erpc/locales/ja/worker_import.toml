unreadable = "Cargo.toml を読めませんでした：{error}"
workspace = "この Cargo.toml はパッケージではなくワークスペースです。アプリのあるパッケージに対して `erpc worker import <DIR>` を実行してください"
no_package = "Cargo.toml にパッケージ名がありません"
no_bin = "パッケージ {package} はバイナリをビルドしません（src/main.rs も [[bin]] もありません）"
several_bins = "このパッケージは複数のバイナリをビルドします（{bins}）。--bin でアプリのものを指定してください"
no_such_bin = "このパッケージに `{asked}` というバイナリはありません。あるのは {bins} です"

