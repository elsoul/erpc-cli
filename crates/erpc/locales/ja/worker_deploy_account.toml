line_coming_up = "ERPC のアカウントの環境 {env} の {kind} 回線 {id} は、まだ開通の途中です（{state}）"
line_coming_up_hint = "自動で active になります。そのあとでもう一度デプロイしてください。`erpc worker status{scope}` で確認でき、そのままなら回線の id を添えて ERPC のサポートに連絡してください"
line_maintenance_hint = "`erpc worker status{scope}` で確認できます。保守中（maintenance）は、ERPC の保守か終了の途中の回線で、状態からは見分けられません。active になってからもう一度デプロイし、そのままなら回線の id を添えて ERPC のサポートに連絡してください"
line_suspended_hint = "`erpc worker status{scope}` で確認できます。停止中の回線は、多くは ERPC クレジットの不足か支払いの未了で止まっていて、払うべきものが済むと再開することがあります。時間課金なら、すべての時間課金の 1 時間分を賄えるようになったとき。期間ごとのクレジット払いなら、次の期間分を賄えるようになったとき。カード払いなら、未払いの請求を払ったときです。停止中のまま置くと終了されることがあるので、早めに ERPC のダッシュボードでクレジットを足すか支払いを済ませてください。active になってからもう一度デプロイするか、回線の id を添えて ERPC のサポートに連絡してください"
line_available_hint = "`erpc worker status{scope}` で確認できます。回線にまだアドレスが登録されていません。ERPC のダッシュボードの製品ページでこのサーバーのアドレスを登録するか、回線の id を添えて ERPC のサポートに連絡してから、もう一度デプロイしてください"
line_other_hint = "`erpc worker status{scope}` で確認できます。active になってからもう一度デプロイし、そのままなら回線の id を添えて ERPC のサポートに連絡してください"
not_yet_hint = "アカウントにある内容は `erpc worker status{scope}` で確認でき、それらのオプションを付けない `deploy` は、アカウントが示すサーバーにデプロイします。erpc はまだそこのサーバーや回線を変えられないので、ERPC のサポートに連絡してください"
line_suspended_now_hint = "`erpc worker status{scope}` で確認できます。停止中の gRPC や Shreds の回線は、多くは ERPC クレジットの不足か支払いの未了で止まっています。時間課金のもの、または時間課金の Bundle プランで買ったものは、ふつうアカウントの側ですぐ終了され、終了したものは戻りません。ただし、まだ停止中のものは、すべての時間課金の 1 時間分を賄えるようになると戻ることがあります。期間ごとのクレジット払いなら、クレジットが次の期間分を賄えるようになると戻ることがあります。カード払いなら、未払いの請求を払うと戻ることがあります（支払いの失敗が続くと終了されることがあります）。今すぐ ERPC のダッシュボードでクレジットを足すか支払いを済ませ、active になってからもう一度デプロイしてください。戻らなければ、回線の id を添えて ERPC のサポートに連絡してください"
unread_not_written = "ERPC のアカウントの SSH 接続元の一覧に、erpc が読めない {entries} があるので、上書きしていません"
nothing_deployed_yet = "何もデプロイしていません"
seen_not_updated = "このマシンが最後にサーバーに当てた ERPC のアカウントのアプリ接続元の一覧を、記録できませんでした（{error}）。次の firewall コマンドやデプロイは、その前に記録した一覧との違いを示します（記録がなければ一覧全体を示します）"
