not_yet = "環境 {env} は ERPC のアカウントに保管されています。そこへのデプロイが --new-server、--region、--plan を受け付けるのは、アカウントにその環境のサーバー、アドレス、回線、デプロイが何もない間だけです。データ回線のフラグ（--grpc、--shreds、--unlimited とそのプラン）を受け付けるのは、そこへの最初のデプロイの前、記録に何もないか、サーバーがあってデプロイがなく、サーバーについてほかに何も求めていない間だけです。サーバーの選択、UDP Forwarding 回線、デプロイしたあとの回線の追加・変更、回線を記録から外すこと、別の保管場所への移動にはまだ対応していません。それらのオプションを付けずにデプロイしてください"
