missing_line_hint = "{first} は ERPC のアカウントがこの環境に示す回線から来ますが、使用中の回線がありません。そこへの最初のデプロイの前なら、`erpc worker deploy --{flag}{scope}` が値段を聞いてから ERPC のアカウントで回線を開始します。デプロイしたあとは、erpc はそこでまだ回線を開始しません"
