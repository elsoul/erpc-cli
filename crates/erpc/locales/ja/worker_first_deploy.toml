needs_terminal = "環境 {env} の新しい ERPC Worker は ERPC のアカウントで開始され、erpc は端末で yes を受けてからでないとそれに一度ログインしません（--yes では足りず、--json では誰にも尋ねません）。何も開始せず、何も書き込んでいません"
needs_terminal_hint = "端末で、--json を付けずに `erpc worker deploy --new-server{scope}` を実行してください。端末が無い場合は、--server <id> か --host <address> で手持ちのサーバーを指定するか、--new-server --inline でこれまでどおり環境を erpc.toml に保管します。そこでは --yes が最初のログインにも答えます"
resume_needs_terminal = "環境 {env} は ERPC のアカウントに保管されていますが、そこにはまだ ERPC Worker がありません。このデプロイはそこに ERPC Worker を開始し、erpc は端末で yes を受けてからでないとそれに一度ログインしません（--yes では足りず、--json では誰にも尋ねません）。何も開始していません"
resume_needs_terminal_hint = "端末で、--json を付けずに `erpc worker deploy{scope}` を実行してください"
not_written = "erpc.toml に、環境 {env} を ERPC のアカウントに保管させられませんでした（`account = true`）: {error}。何も開始していません"
file_changed = "そこの [env.{env}] に、いまは別の設定があります"
kept_now_hint = "erpc.toml は、いま環境 {env} を ERPC のアカウントに保管しています。`erpc worker deploy{scope}` は止まったところから続け、先に ERPC のアカウントを読み、開始が未完了の間や記録にサーバーがある間は新しい開始をしません"
started_hint = "環境 {env} はいま ERPC のアカウントに保管され、その ERPC Worker は時間単位で課金されています。`erpc worker deploy{scope}` で続けます"
holds_hint = "erpc.toml の [env.{env}] に `account = true` があれば、`erpc worker deploy{scope}` はアカウントの記録にある ERPC Worker にデプロイします"
differs_hint = "`erpc worker deploy{scope}` を --region なしで、または --region {region} を付けて実行すると、ERPC のアカウントが保管した開始だけを未完了として示し、環境の記録にサーバーが無い間、それをもう一度送ります"
no_record = "サインイン中の ERPC のアカウントには、erpc.toml が ERPC のアカウントに保管しているアプリ {app} の環境 {env} の記録がありません。何も開始していません"
no_record_hint = "別の ERPC のアカウントで作った場合は、そのアカウントで `erpc login` してください。`erpc worker deploy --new-server{scope}` は、サインイン中のアカウントにこの環境の新しいサーバーを開始します（先に料金を確認します）"
