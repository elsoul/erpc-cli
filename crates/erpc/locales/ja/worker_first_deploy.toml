question = "{app} を、ERPC のアカウントの新しい {worker} で環境 {env} として動かしますか: リージョン {region}、ERPC クレジットから 1 時間 €{price}。終了するまで時間単位で課金され、少なくとも 1 時間分は課金されます。yes のあと、erpc.toml は環境 {env} を以後 ERPC のアカウントに保管し（`account = true`）、このデプロイが、準備ができるのを待ち、ここで yes を受けてから一度ログインして、デプロイします。erpc から終了するには、端末で `erpc worker delete --release-server{scope}` を実行します。環境の記録も一緒に消え、それがアプリの最後の環境ならアプリの記録も消えます。"
note = "{app} を、ERPC のアカウントの新しい {worker} で環境 {env} として動かします: リージョン {region}、ERPC クレジットから 1 時間 €{price}。終了するまで時間単位で課金され、少なくとも 1 時間分は課金されます。erpc.toml は環境 {env} を以後 ERPC のアカウントに保管し（`account = true`）、このデプロイが、準備ができるのを待ち、この端末で yes を受けてから一度ログインして、デプロイします。erpc から終了するには、端末で `erpc worker delete --release-server{scope}` を実行します。環境の記録も一緒に消え、それがアプリの最後の環境ならアプリの記録も消えます。"
new_option = "ERPC のアカウントで時間課金の ERPC Worker を新しく開始する（最安のサイズ、{region} の近く）。先に価格を表示します"
