hot_wallet = "入金はボットに必要な額だけにしてください。これはホットウォレットです。"
by_hand = "鍵は {source} に保管されています。erpc.toml の [wallet] に source = \"{source}\" と pubkey = \"{pubkey}\" を手動で設定してください"

[key_file]
not_one = "{path} は鍵ファイルではありません"
unreadable = "{path}：{error}。鍵ファイルは `solana-keygen` が書き出す、64 個の数値からなる JSON 配列です"

[show]
no_wallet = "{app} にはまだウォレットがありません"
new_hint = "`erpc worker key new{dir_scope}` で作成できます"
no_pubkey = "（erpc.toml に公開鍵が設定されていません）"
kept_at = "保管場所：{source}"

[balance]
no_pubkey = "{app} の erpc.toml にウォレットの公開鍵がありません"
not_json_rpc = "RPC の応答は {status} で、JSON-RPC ではありません：{error}"
no_balance = "RPC は {status} を返しましたが、残高が含まれていません"
failed = "残高を取得できませんでした：{error}"

[rpc]
none = "アプリに RPC の設定（SOLANA_RPC_ENDPOINT または ERPC_API_KEY）がありません"
none_hint = "--rpc <url> を指定してください"
unusable = "この RPC URL は使えません：{error}"

[secret]
prompt = "{name}（入力は表示されません）"
ask_failed = "入力プロンプトを表示できませんでした：{error}"
stdin_failed = "標準入力を読み込めませんでした：{error}"
too_long = "標準入力のシークレットが 64 KiB を超えています"
empty = "{name} が空です。何も保管していません"

[put]
