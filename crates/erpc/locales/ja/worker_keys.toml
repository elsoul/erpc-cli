[list]
none = "シークレットはまだありません。`erpc worker secret put <NAME>{dir_scope}` で保管できます。"
missing_plain = "未設定：{name}（run.requires）"
title = "{app} のシークレット"
missing = "{name} が設定されていません（run.requires）"

[rm]
not_there = "{name} は [secrets] にありません"
done = "{name} を erpc.toml から外しました。"
still_kept = "値はまだ {source} に保管されています。ほかで使っていなければ、そちらで削除してください。"
plain = "{name} を erpc.toml から外しました。値はまだ {source} に保管されています。ほかで使っていなければ、そちらで削除してください。"
