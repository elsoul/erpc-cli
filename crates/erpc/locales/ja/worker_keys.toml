# `erpc worker key` と `erpc worker secret` のメッセージ。

read_failed = "{path} を読み込めませんでした：{error}"
portability = "このアプリのサーバーは 1Password に保管されていますが、キーチェーンはこのマシンにしかありません。別のマシンからはアプリを起動できなくなります。サーバーと同じ場所に保管するには --store 1password を指定してください。"

[field]
pubkey = "公開鍵"
kept_at = "保管場所"

[import]
wipe_question = "鍵を保管先に保管しました。{file} を消去しますか（上書きしてから削除します）？"
wiped = "{file} を消去しました。"
wipe_failed = "{file} を消去できませんでした：{error}"
left_on_disk = "{file} はまだディスク上に残っています。保管先の鍵を確認したら削除してください（`--wipe` を付けると自動で消去します）。"

[already]
no_pubkey = "公開鍵が設定されていません"
show_hint = "`erpc worker key show{dir_scope}` で確認できます"
replace_hint = "置き換えるには、先に erpc.toml から [wallet] を削除してください"
title = "{app} にはすでにウォレットがあります。何も作成していません"
refused = "{app} にはすでにウォレットがあります（{source} の {pubkey}）。何も作成していません"
refused_hint = "`erpc worker key show{dir_scope}` で確認できます。置き換えるには、先に erpc.toml から [wallet] を削除してください"

[kept]
made = "{app} の取引用の鍵を作成しました：{pubkey}"
imported = "{app} の取引用の鍵をインポートしました：{pubkey}"
