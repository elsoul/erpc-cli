tip = "ヒント：{tip}"

[tips]
t01 = "Solanaのスロット時間は現在200msです。スロット数×400msで時間を出すコードは誤りになるため、getBlockTimeを使うか現在のスロット時間を取得しましょう。"
t02 = "blockhashの有効期限は今も150ブロックですが、200msスロットでは実時間で約60秒から約30秒に短くなっています。"
t03 = "Geyser gRPCではping/pongに応答し、再接続後はfrom_slotで再開しましょう。これがないと約30秒での切断やデータ欠落が起こり得ます。"
t04 = "距離ごとのpingの目安：同一ネットワーク約0.1ms、同一都市約1ms、隣国5〜10ms、大陸間100〜300ms。"
t05 = "gRPCなどTCPのストリームの遅延はpingの約5倍、単発のPOSTは約2〜3倍。ボットは送信先よりもストリームの配信元の近くに置きましょう。"
t06 = "リーダーは世界中を巡回します。リーダーの近くで受信し近くから送信できるよう、複数リージョンに小さな拠点を持ちましょう。"
t07 = "ERPCのgetLeaderSlotsは、今後のリーダーと推定所在地、7リージョンからの参考RTTを返します。送信経路の選択に使えます。"
t08 = "getLeaderSlotsのicmpReplied=falseは「遠い」ではなく「ICMPで測定できない」という意味です。TPU/QUICは正常に動いている場合があります。"
t09 = "同じ都市でもネットワーク上で近いとは限らず、外部ネットワークを迂回することがあります。実際のデータ配信元へのRTTを測りましょう。"
t10 = "gRPCのリージョン計測が9999msになる場合は、公式クイックスタートに記載の計測元からのICMP受信を許可しているか確認しましょう。"
t11 = "共有ノードは多数のユーザーの処理を順番待ちさせるため、ジッターが出ます。まず共有で始め、速度を落とせない所に専用ノードを加えましょう。"
t12 = "共有Geyser gRPC（Standard）とDirect Shreds Connectは、HTTP（TLS処理なし）とHTTPS（監視アドレスを秘匿）を選べます。"
t13 = "データはShreds、Geyser gRPC、RPC/WebSocketの順に現れます。UDPのShredsが最速ですが、欠落や順序の入れ替わりへの対処が必要です。"
t14 = "よくある構成：Shredsで機会をいち早く検知し、Geyser gRPCでブロックとログを確認してメインロジックを動かします。"
t15 = "フィルタは受信後ではなく配信側でかけましょう。捨てる更新も帯域とCPUを消費し、必要な更新を遅らせることがあります。"
t16 = "Yellowstoneのトランザクションフィルタでは、account_includeは列挙したアドレスのいずれか、account_requiredはそのすべてを含むものに一致します。"
t17 = "ERPCの共有gRPCはblocks購読と空のフィルタを拒否します。実際に必要なアカウントやアドレスを具体的に指定しましょう。"
t18 = "Shredsで見えるswap命令はトレーダーが指定した限度額で、約定結果ではありません。実際の約定はGeyser gRPCやRPCの実行メタデータで確認しましょう。"
t19 = "件数だけでなく、最も古い未処理更新の待ち時間を監視しましょう。処理が恒常的に追いつかないとき、バッファを増やしても古いデータが溜まるだけです。"
t20 = "ホットパスは短く。分析用ログや判断に不要なDB書き込みは上限付きキューに渡し、次の価格更新を待たせないようにしましょう。"
t21 = "再接続しても取りこぼした更新は戻りません。その状態に依存する判断は、復元と検証が済むまで止めましょう。"
t22 = "gRPCが切断されたら、再接続の前に最初のエラーとx-erpc-retry-atを保存しましょう。拒否されたリクエストをそのまま再送してはいけません。"
t23 = "processedの更新は後で覆ることがあります。暫定の状態とfinalizedの状態を分けて持つか、finalizedだけを使いましょう。"
t24 = "sendTransactionの成功はRPCが受け付けたという意味で、実行されたとは限りません。署名のステータスを別途確認しましょう。"
t25 = "SWQoSは優先手数料の評価より前に効きます。優先レーンに入れないトランザクションは、priority feeを上げるだけでは速くなりません。"
t26 = "同じトランザクションを複数の高速RPCへ同時に送るなら、durable nonceを使って一度しか実行されないようにしましょう。"
t27 = "平均CPU使用率は飽和したコアを隠します。8論理CPUのうち1つが100%でも平均は約12.5%です。コアごとの負荷を確認しましょう。"
t28 = "gRPCが動いていてもUDP受信が正常とは限りません。ホスティング事業者に、受信UDPのPPS制限、バースト、DDoS対策ルールを確認しましょう。"
t29 = "Shreds UDP Forwardingでは、公開IPv4とポートを登録し、ダッシュボード記載のすべての送信元IPからのUDP受信を許可して、パケットの到着を確認しましょう。"
t30 = "バックテストでは、edge.erpc.globalのURLにhistory=trueを付けると古いブロックやトランザクションを取得できます。履歴の参照には数秒かかることがあります。"
