# What the first `erpc worker deploy` that starts a new server says: it
# makes the app an ERPC Worker in the ERPC account.
question = "Make {app} an ERPC Worker in your ERPC account, on a new server for environment {env}: {cores}-core, {memory} GB, in {region}, at €{price} an hour from ERPC Credit? It is charged by the hour until it is ended, one hour at the least. On a yes, erpc.toml keeps environment {env} in the ERPC account from then on (`account = true`), and this deploy waits for the server to be ready, logs in to it once after a yes here, and deploys to it. To end it from erpc: `erpc worker delete --release-server{scope}`, at a terminal, which deletes the environment's record with it, and the app's when it is the app's last environment there."
note = "Making {app} an ERPC Worker in your ERPC account, on a new server for environment {env}: {cores}-core, {memory} GB, in {region}, at €{price} an hour from ERPC Credit. It is charged by the hour until it is ended, one hour at the least. erpc.toml keeps environment {env} in the ERPC account from then on (`account = true`), and this deploy waits for the server to be ready, logs in to it once after a yes at this terminal, and deploys to it. To end it from erpc: `erpc worker delete --release-server{scope}`, at a terminal, which deletes the environment's record with it, and the app's when it is the app's last environment there."
new_option = "Start a new hourly server in your ERPC account, which makes the app an ERPC Worker there (the cheapest size, near {region}), with its price shown first"
as_before = "environment {env} is kept in erpc.toml, as before, and not in the ERPC account: {why}"
why_lines = "an environment kept in the ERPC account takes no data line from a deploy yet"
why_plan = "--plan names a product, and a server in the ERPC account is started by its size"
why_wallet = "erpc.toml names a wallet, and this erpc does not make the ERPC account's record of an app with a wallet yet"
needs_terminal = "a new server for environment {env} makes the app an ERPC Worker in the ERPC account, and erpc logs in to that server once only after a yes at a terminal (--yes is not enough, and --json asks nobody); nothing was started or written"
needs_terminal_hint = "run `erpc worker deploy --new-server{scope}` at a terminal, without --json; without one, --server <id> or --host <address> names a server you have, and --new-server --inline keeps the environment in erpc.toml as before, where --yes answers the first login too"
resume_needs_terminal = "environment {env} is kept in the ERPC account, which names no server for it yet: this deploy starts one there, and erpc logs in to it once only after a yes at a terminal (--yes is not enough, and --json asks nobody); nothing was started"
resume_needs_terminal_hint = "run `erpc worker deploy{scope}` at a terminal, without --json"
not_written = "erpc.toml could not be made to keep environment {env} in the ERPC account (`account = true`): {error}; nothing was started"
file_changed = "[env.{env}] there holds other settings now"
kept_now_hint = "erpc.toml keeps environment {env} in the ERPC account now: `erpc worker deploy{scope}` goes on from where this stopped, and reads the ERPC account first, making no new start while one is open or the record names a server"
started_hint = "environment {env} is kept in the ERPC account now, and its server is charged by the hour: `erpc worker deploy{scope}` goes on with it"
holds_hint = "with `account = true` under [env.{env}] in erpc.toml, `erpc worker deploy{scope}` deploys to the server the account's record names"
differs_hint = "`erpc worker deploy{scope}` without --region, or with --region {region}, sends the kept start again while the ERPC account lists it, and no other, as open, and the environment's record names no server"
no_record = "the ERPC account you are signed in to has no record of environment {env} of app {app}, which erpc.toml keeps in the ERPC account; nothing was started"
no_record_hint = "if it was made in another ERPC account, `erpc login` with that one; `erpc worker deploy --new-server{scope}` starts a new server for it in the account you are signed in to, its price asked first"
