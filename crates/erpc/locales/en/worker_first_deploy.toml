# What the first `erpc worker deploy` that starts a new server says: it
# makes the app an ERPC Worker in the ERPC account.
question = "Run {app} on a new {worker} in your ERPC account, for environment {env}, in {region}, at €{price} an hour from ERPC Credit? It is charged by the hour until it is ended, one hour at the least. On a yes, erpc.toml keeps environment {env} in the ERPC account from then on (`account = true`), and this deploy waits for it to be ready, logs in to it once after a yes here, and deploys to it. To end it from erpc: `erpc worker delete --release-server{scope}`, at a terminal, which deletes the environment's record with it, and the app's when it is the app's last environment there."
note = "Running {app} on a new {worker} in your ERPC account, for environment {env}, in {region}, at €{price} an hour from ERPC Credit. It is charged by the hour until it is ended, one hour at the least. erpc.toml keeps environment {env} in the ERPC account from then on (`account = true`), and this deploy waits for it to be ready, logs in to it once after a yes at this terminal, and deploys to it. To end it from erpc: `erpc worker delete --release-server{scope}`, at a terminal, which deletes the environment's record with it, and the app's when it is the app's last environment there."
new_option = "Start a new hourly ERPC Worker in your ERPC account (the cheapest size, near {region}), with its price shown first"
as_before = "environment {env} is kept in erpc.toml, as before, and not in the ERPC account: {why}"
why_lines = "a deploy of an environment kept in the ERPC account takes no UDP Forwarding line, and no --forget-line, yet"
why_plan = "--plan names a product, and a server in the ERPC account is started by its size"
line_unreadable = "this machine's record of line starts, {path}, cannot be read ({error}): a start in it may have bought a line, so none is made"
line_open = "a start of a {kind} line is open for environment {env} ({start}), not one this machine made: it may yet buy what it was for, so no other start is made"
line_kept_other = "a start of a {kind} line for environment {env} is kept on this machine for another plan or address than this run asks (plan {plan}); nothing was sent"
line_kept_other_hint = "run the deploy with the line's plan it was kept for, from where the server is now, to send it again under its key; ERPC support can say what became of it"
line_started = "Started a {kind} line for environment {env} in the ERPC account."
line_key_let_go = "This machine let the line start's key go."
line_key_kept = "This machine keeps the line start's key: a run again reads the ERPC account first, and sends it again under the same key."
line_not_started = "the {kind} line of environment {env} was not started: {why}"
line_again_hint = "run `erpc worker deploy{scope}` again: it reads the ERPC account first, and buys no second line"
line_note = "Starting a {kind} line ({name}, product {product}) for environment {env} in the ERPC account at €{price} an hour, the hourly catalogue's price; it is charged by the hour until it is ended."
line_question = "Start a {kind} line ({name}, product {product}) for environment {env} in the ERPC account at €{price} an hour, the hourly catalogue's price? It is charged by the hour until it is ended."
line_declined = "the {kind} line of environment {env} was not started"
line_waiting = "Waiting for the {kind} line of environment {env} to be active..."
line_not_ready = "the {kind} line of environment {env} is not active yet"
line_not_ready_hint = "run `erpc worker deploy{scope}` again once it is: the deploy goes on from there and buys nothing more"
line_no_address = "the ERPC account gives no IPv4 address for the server of environment {env} yet, which a line is started for"
needs_terminal = "a new ERPC Worker for environment {env} is started in the ERPC account, and erpc logs in to it once only after a yes at a terminal (--yes is not enough, and --json asks nobody); nothing was started or written"
needs_terminal_hint = "run `erpc worker deploy --new-server{scope}` at a terminal, without --json; without one, --server <id> or --host <address> names a server you have, and --new-server --inline keeps the environment in erpc.toml as before, where --yes answers the first login too"
resume_needs_terminal = "environment {env} is kept in the ERPC account, which names no ERPC Worker for it yet: this deploy starts one there, and erpc logs in to it once only after a yes at a terminal (--yes is not enough, and --json asks nobody); nothing was started"
resume_needs_terminal_hint = "run `erpc worker deploy{scope}` at a terminal, without --json"
not_written = "erpc.toml could not be made to keep environment {env} in the ERPC account (`account = true`): {error}; nothing was started"
file_changed = "[env.{env}] there holds other settings now"
kept_now_hint = "erpc.toml keeps environment {env} in the ERPC account now: `erpc worker deploy{scope}` goes on from where this stopped, and reads the ERPC account first, making no new start while one is open or the record names a server"
started_hint = "environment {env} is kept in the ERPC account now, and its ERPC Worker is charged by the hour: `erpc worker deploy{scope}` goes on with it"
holds_hint = "with `account = true` under [env.{env}] in erpc.toml, `erpc worker deploy{scope}` deploys to the ERPC Worker the account's record names"
differs_hint = "`erpc worker deploy{scope}` without --region, or with --region {region}, sends the kept start again while the ERPC account lists it, and no other, as open, and the environment's record names no server"
no_record = "the ERPC account you are signed in to has no record of environment {env} of app {app}, which erpc.toml keeps in the ERPC account; nothing was started"
no_record_hint = "if it was made in another ERPC account, `erpc login` with that one; `erpc worker deploy --new-server{scope}` starts a new server for it in the account you are signed in to, its price asked first"
