# `erpc validator`, `erpc rpc` and `erpc node` before a chain is chosen,
# and the line after a chain's own help.

[about]
validator = "Validators on the chains below. Each chain has its own commands: choose it with --chain."
rpc = "JSON-RPC requests, and RPC nodes on the chains below. Each chain has its own commands: choose it with --chain."
node = "Nodes on the chains below, under their compatibility names. Each chain has its own commands: choose it with --chain."

[heading]
without_chain = "Without a chain"
chains = "Chains and their networks"
no_validator = "No validator"
commands = "Commands every chain has"
examples = "Examples"

[no_validator]
mining = "mined by proof of work: there is no validator to run"
rollup = "rollups with no proof-of-stake validator of their own"
rpc = "Their RPC nodes: erpc rpc --chain <chain>"

[commands]
more = "A chain's own help says what each does there, and lists the commands it adds:"

[verb]
init = "Record the node in the 1Password inventory and prepare the server"
deploy = "Install the base system and the client, and start in safe mode"
list = "List the hosts in the inventory"
status = "Show the state of a host"
logs = "Show a host's logs"
start = "Start the service"
stop = "Stop the service"
restart = "Restart the service"
update = "Update the client, with a guarded restart"
update_config = "Regenerate the start script and configuration"
plan = "Show what a change would do, without doing it"
destroy = "Stop the service and retire the node (keys are untouched)"

[rpc]
call = "Send one JSON-RPC request to a shared, custom or x402 endpoint"
list_networks = "List the networks with ERPC shared and x402 RPC"

[option]
chain = "The chain, one of those above (else ERPC_CHAIN, else the default_chain setting)"
network = "The network, one of the chain's; mainnet changes need --chain on the command line too"
name = "The host, by its inventory name"

[example]
help = "What {chain} has: each command, and what it does there"
list = "The {chain} hosts in the inventory"
default = "After this, erpc {role} <COMMAND> needs no --chain, but a mainnet change still does"
call = "One request to ERPC's shared RPC; the network is told from the method"

[verb_help]
depends = "What {verb} takes depends on the chain: erpc {role} --chain <chain> {verb} --help"
only = "{verb} is on {chains} only: erpc {role} --chain {chain} {verb} --help"
none = "`{word}` is no command of erpc {role} on any chain"

[chain_word]
refused = "`{word}` is a chain, not a command: erpc {role} takes its chain with --chain"
hint = "run it as: {command}"
takes_none = "`{word}` is a chain, and erpc rpc {verb} takes none"

[chain]
next = "A command's options, and what it does on {chain}: erpc {role} --chain {chain} <COMMAND> --help"
