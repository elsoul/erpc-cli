"ai" = "Talk to the ERPC assistant. Without -m, a conversation"
"ai --message" = "Ask one question and print the answer"
"ai --continue" = "Continue the most recent conversation: in the console, or with `-m` or a question piped in, which is then saved to it"
"ai --model" = "Put every turn on one model size: small, medium, large or xlarge, the most capable, which uses tokens at 2x. Without it, each turn's words decide"
"ai --list" = "List eligible server rentals from the signed-in ERPC account"
"ai --kind" = "Limit the security check to this kind of ERPC rental"
"ai --id" = "Use the numeric part of the ERPC rental ID shown by --list"
"ai --host-key" = "Verify SSH against this independently trusted Ed25519 host public key"
"ai --ssh-user" = "Use this SSH login with the independently trusted host public key"
"ai --security-check" = "Run the metered Security Check for an owned ERPC server"
