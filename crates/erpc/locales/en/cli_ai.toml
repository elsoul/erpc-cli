"ai" = "Talk to the ERPC assistant. Without -m, a conversation"
"ai --message" = "Ask one question and print the answer"
"ai --continue" = "Continue the most recent conversation: in the console, or with `-m` or a question piped in, which is then saved to it"
"ai --model" = "Put every turn on one model size: small, medium, large or xlarge, the most capable, which uses tokens at 2x. Without it, each turn's words decide"
