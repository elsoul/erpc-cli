ending = "Ending hourly {kind} line {id}"
end_failed = "user-api did not end {kind} line {id}: {answer}"
udp_no_port = "a UDP Forwarding line sends to a UDP port of the server, and none was given"
udp_no_region = "a UDP Forwarding line sends from an ERPC region, and this server has none on record"
