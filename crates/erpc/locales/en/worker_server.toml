# What `erpc worker server start` says.
unreadable = "this machine's record of the starts it sent, {path}, could not be read ({error})"
no_key = "no key could be made for the start ({error}); nothing was started"
size = "{worker}, €{price} an hour"
currency = "the ERPC account prices the start in {currency}, which erpc does not show; nothing was started"
no_sizes = "the ERPC account offers no server start for environment {env} now; nothing was started"
not_offered = "{worker} is not offered for this environment; offered: {offered}"
needs_yes = "this starts a server paid for by the hour, and nobody can say yes here (under --json, or with no terminal)"
needs_yes_hint = "pass --yes to start it at the price it then says on stderr, or run it at a terminal without --json"
declined = "nothing was started"
question = "Start a new {worker} for environment {env}, in {region}, at €{price} an hour from ERPC Credit? It is charged by the hour until it is ended, one hour at the least. `erpc worker deploy{scope}` then waits for it to be ready, logs in to it once after a yes at a terminal, and deploys to it. To end it from erpc: `erpc worker delete --release-server{scope}`, at a terminal, which deletes the environment's record with it, and the app's when it is the app's last environment there."
note = "Starting a new {worker} for environment {env}, in {region}, at €{price} an hour from ERPC Credit. It is charged by the hour until it is ended, one hour at the least. `erpc worker deploy{scope}` then waits for it to be ready, logs in to it once after a yes at a terminal, and deploys to it. To end it from erpc: `erpc worker delete --release-server{scope}`, at a terminal, which deletes the environment's record with it, and the app's when it is the app's last environment there."
same_start = "The start this machine kept is sent again, under its own key, as the ERPC account asked."
not_kept = "the start's key could not be kept on this machine first ({error}); nothing was sent"
started = "Started a new ERPC Worker for environment {env}. Its record now:"
done_before = "Environment {env}'s record names a server now, and nothing was sent. Its record:"
holds = "environment {env}'s record names a server already; this command starts one only for an environment whose record names none"
open = "a start of environment {env} is still open ({start}: {what}): it may yet buy what it was for, so no other start is made"
open_server = "{worker} in {region}"
open_server_unsaid = "an ERPC Worker"
open_other = "something other than a server"
open_kept = "The start this machine kept is not sent again: this machine has no record that the ERPC account said to."
support_hint = "ERPC support, given start {start}, can say how to go on"
ended = "the purchase was ended while it was being started ({why}): environment {env} holds no server from it. It may have been charged by the hour from its start until it was ended, one hour at the least; a new start is a new purchase"
other_open = "another start of environment {env} is open ({start}; {why}); this one bought nothing"
not_started = "the ERPC account did not start a server for environment {env}: {why}"
again = "the start for environment {env} may have bought a server and is not finished ({why})"
again_hint = "run the same command again: while the ERPC account lists this start, and no other, as open, and the environment's record names no server, it is sent again under the same key"
held = "whether the start for environment {env} bought a server is not known ({why})"
held_hint = "run the same command again later: it reads the ERPC account first, and makes no new start while one is open"
busy = "the ERPC account took no start for environment {env} just now ({why})"
busy_hint = "wait a minute, then run the same command again"
unkept = "this machine's record of the start could not be updated ({error}); while that record cannot be read the next run stops at it, and otherwise reads the ERPC account first"
in_erpc_toml = "environment {env} is kept in erpc.toml: this command starts a server for an environment kept in the ERPC account"
in_erpc_toml_hint = "`erpc worker deploy --new-server{scope}` starts one for it"
differs = "the start this machine kept, {kept} in {kept_region}, is open, and this asks for {asked} in {region}; nothing was sent"
differs_hint = "`erpc worker server start --cores {cores} --region {region}{scope}` sends the kept start again while the ERPC account lists it, and no other, as open, and the environment's record names no server"
wallet = "erpc.toml names a wallet for app {app}, and the ERPC account has no record of the app: this erpc does not make the record of an app with a wallet yet; nothing was made or started"
other_chain = "the ERPC account's app {app} is for chain {chain}, not the one erpc.toml names; nothing was made or started"
made_app = "Made app {app}'s record in the ERPC account (it costs nothing)."
made_env = "Made environment {env}'s record in the ERPC account, with no server yet (it costs nothing)."
holds_address = "environment {env}'s record names an address and no server: a server of your own, or one that was ended; this command starts one only for an environment whose record names neither"
mismatch = "the ERPC account says the start for environment {env} bought a server it has not put on the environment's record ({start}; {why})"
unsettled = "the ERPC account has not settled the start for environment {env} ({why}, {reason}, {start})"
open_kept_beside = "The start this machine kept is not sent again while another start of the environment is open."
changed = "what the ERPC account has for environment {env} changed while this was asked (a start opened or closed, or a server came); nothing was sent"
changed_hint = "run the same command again: it reads the ERPC account first"
read_refused = "the ERPC account refused {what} ({why}); nothing was started"
what_app = "to read or make app {app}'s record"
what_starts = "to list environment {env}'s open starts"
what_env = "to read or make environment {env}'s record"
what_prices = "to give the price of a server start for environment {env}"
holds_open = "environment {env}'s record names a server, and a start of environment {env} is still open ({start}), which may yet buy what it was for: nothing is sent, and the start this machine kept stays until the ERPC account settles the open start"
kept_meanwhile = "another run of this command on this machine changed the start kept here for the environment meanwhile"
not_read = "{error}; nothing was started"
again_unkept_hint = "this machine could not keep the mark to send the start again, so the next run does not send it again; ERPC support, given start {start}, can say how to go on"
key_let_go = "This machine let the start's key go."
key_again = "This machine keeps the start's key, to send it again under the same key."
key_held = "This machine keeps the start's key, and does not send it again."
changed_before = "what the ERPC account has for environment {env} changed after it was read for the price said ({why}); nothing was bought"
