# What erpc says about its keystore: the encrypted file `erpc worker` keeps
# an app's secrets and trading key in on a machine with neither 1Password
# nor a keychain that outlasts a reboot.

none = "there is no keystore on this machine yet ({path})"
none_hint = "it is made the first time a key or a secret is kept in it; `--store keystore` asks for it by name"
exists = "another erpc made a keystore here meanwhile; run this again"
too_short = "a keystore passphrase is {min} characters or more; no keystore was made"
mismatch = "the two passphrases differ; no keystore was made"
wrong = "that passphrase does not open the keystore (or its master.json was changed since it was written)"
wrong_again = "That passphrase does not open the keystore; it is asked for again."
unreadable = "{path} is not a keystore file erpc can read: {why}"
unsupported = "{path} asks for {what}, which this erpc does not know; a newer erpc may have written it"
other_master = "{name} was sealed under another keystore's master key: its file came from a keystore that is not this machine's"
changed = "{name} does not open: its file was changed, or it is another entry's file under this name"
kept_as_key = "{name} is kept as a trading key: erpc reads it only as the key [wallet] names, for a person at a terminal, and never as a secret"
kept_as_secret = "{name} is kept as a secret, and a trading key is not read from it: [wallet] names an entry that was kept as a key"
other_spelling = "{name} cannot be told apart from {found}, which the keystore holds: where a file system ignores case the two are one file. Nothing was read, written or removed"
bad_name = "a keystore service and account are letters, digits, `.`, `_` and `-`, and do not start with `.`"
too_long = "the value is longer than the {max} bytes a keystore entry holds"
intro = "erpc's keystore keeps this in an encrypted file on this machine, under {path}, opened with a passphrase you choose now.\nBack that directory up and remember the passphrase: erpc can recover neither, and without both, what the keystore holds is gone (for a trading key, that is the wallet).\n1Password is the alternative, and it works from another machine too: `erpc login --store 1password-desktop`. A 1Password service account works for secrets, not for a trading key."
intro_by_default = "`erpc login` does not keep the session in 1Password here, and this machine has no keychain that outlasts a reboot (no Secret Service: a headless server, WSL or an SSH login). So this goes into erpc's keystore: an encrypted file on this machine, under {path}, opened with a passphrase you choose now.\nBack that directory up and remember the passphrase: erpc can recover neither, and without both, what the keystore holds is gone (for a trading key, that is the wallet).\n1Password is the alternative, and it works from another machine too: `erpc login --store 1password-desktop`. A 1Password service account works for secrets, not for a trading key."
new_prompt = "New keystore passphrase ({min} characters or more, not shown)"
again_prompt = "The same passphrase again (not shown)"
prompt = "Keystore passphrase (not shown)"
first_needs_terminal = "there is no keystore on this machine yet ({path}), and its passphrase is chosen at a terminal: run this at one"
locked_no_terminal = "the keystore is locked, and nobody is at a terminal to type its passphrase: run `erpc worker secret unlock` at a terminal, then this again"
no_terminal_each_time = "the keystore's passphrase is typed at a terminal, and nobody is at one; this system has no kernel keyring to keep an unlock in, so run this at a terminal"
unlocked = "The keystore stays unlocked {until}; `erpc worker secret lock` locks it now."
not_kept = "The unlock could not be kept, so the next command asks for the passphrase again: {why}"
until_reboot = "until this machine restarts"
until_reboot_or_idle = "until this machine restarts, or until your kernel keyring has gone {idle} unused"

[why]
not_held = "this process holds none of your kernel keyrings, which happens when it was started without a login of its own (`su` without `-`, `sudo -E`)"
kernel = "the kernel keyring refused: {reason}"

[days]
one = "{n} day"
other = "{n} days"

[hours]
one = "{n} hour"
other = "{n} hours"

[minutes]
one = "{n} minute"
other = "{n} minutes"

[unlock]
unsupported = "there is no unlock to keep on this system: it has no kernel keyring, so erpc asks for the keystore's passphrase each time it needs it"
needs_terminal = "the keystore's passphrase is typed at a terminal, and nobody is at one"
needs_terminal_hint = "run it in a terminal: the passphrase is not read from a pipe, an argument or the environment"
not_kept = "the passphrase opens the keystore, but the unlock could not be kept: {why}"
done = "Keystore unlocked {until}."
already = "The keystore is unlocked already, {until}."
lock_hint = "`erpc worker secret lock` locks it again"

[lock]
done = "Keystore locked: the next command that needs it asks for the passphrase."
was_not = "The keystore was not unlocked."
none = "There is no keystore on this machine ({path}); nothing to lock."
unsupported = "Nothing is kept unlocked on this system: erpc asks for the keystore's passphrase each time."
others = "Unlocks kept for other erpc keystores were dropped as well: {count} (a keystore under another ERPC_HOME, or one whose files are gone)."
failed = "could not drop the unlock: {why}"
