not_yet = "environment {env} is kept in the ERPC account, and this command does not work on such an environment yet"
not_yet_hint = "`erpc worker status{scope}` shows it, and `logs`, `start`, `stop`, `restart`, `releases`, `deploy`, `firewall` and `delete --release-server` work on it"
pins_unreadable = "{path} is unreadable ({error}); fix it or move it away, then run the command again"
no_app = "the ERPC account has no worker app {app}"
no_env = "the ERPC account has no environment {env} for this app"
older_format = "the ERPC account keeps environment {env} in an older form, which this erpc does not read its server and lines from; nothing was done"
unreachable = "the ERPC account names no address or host key for the server of environment {env} yet, so it is not reached"
running_elsewhere = "the ERPC account says the app runs on another server of environment {env}"
no_server_in_use = "the ERPC account has no server in use for environment {env}"
not_recorded_start = "the ERPC account could not record that the app runs on the server of environment {env} ({error}); it was not started"
not_recorded_stop = "the ERPC account could not record that the app was stopped ({error}), and may still say it runs: running `erpc worker stop{scope}` again records it"
charged_server = "its server"
charged_line = "its {kind} line"
still_charged = "{items}: hourly on the account's record until ended; `erpc worker delete --release-server{scope}` ends them with the environment"
not_recorded_restart = "the ERPC account could not record that the app runs on the server of environment {env} ({error}); nothing was restarted"
says_running = "the ERPC account now says the app runs on this server; if it does not, `erpc worker stop{scope}` records that once the server can be reached"
stop_not_recorded = "the app was stopped, and the ERPC account did not record it: {error}"
unreachable_hint = "`erpc worker status{scope}` shows what the account has of it; its server needs an address and a host key there first; for a server `erpc worker server start{scope}` started, `erpc worker deploy{scope}` writes them once it has logged in to it"
list_sep = ", "
hint_sep = "; "
server_gone = "the ERPC account says the server in use of environment {env} is gone; it is not reached"
server_gone_hint = "`erpc worker status{scope}` shows what the account has of it"
may_say_running = "the account may have taken it, and may now say the app runs; `erpc worker status{scope}` shows what it says"
stop_not_recorded_sign_in = "the app was stopped, and the ERPC account did not record it: {error}; sign in again (`erpc login`), then run `erpc worker stop{scope}` again to record it"
server_not_active = "the ERPC account says the server in use {id} of environment {env} is {state}, not active; it is not reached"
stop_may_be_recorded = "the app was stopped, and the ERPC account's answer did not say whether it recorded that ({error}); running `erpc worker stop{scope}` again records it"
still_charged_lines = "{items}: hourly on the account's record until ended; with no ERPC Worker in use, `erpc worker delete --release-server{scope}` asks at a terminal before it ends them, or a line is ended on the ERPC dashboard on its product's page"
server_suspended_hint = "`erpc worker status{scope}` shows it; a suspended server is stopped, most often for ERPC Credit or a payment, and may resume once what is due is met: paid by the hour, once the credit covers an hour of all the account's hourly charges; paid from credit by the period, once it covers its next period's charge; paid by card, once the unpaid invoice is paid. A server left suspended can be ended, so add credit, or settle the payment, on the ERPC dashboard soon; if it stays so, contact ERPC support with the server's id"
server_not_active_hint = "`erpc worker status{scope}` shows it; run this again once it is active, and if it stays so, contact ERPC support with the server's id"

