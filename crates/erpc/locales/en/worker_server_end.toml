# What `erpc worker server end` says.
unreadable = "this machine's record of the servers it ends, {path}, could not be read ({error})"
in_erpc_toml = "environment {env} is kept in erpc.toml: this command ends the server of an environment kept in the ERPC account"
other_servers = "environment {env}'s record names a server besides the one in use (one coming in or going out, or one gone); this command ends a server only when it is the environment's only one, and nothing was sent"
no_server = "environment {env}'s record names no server and no address: there is nothing to end, and nothing was sent"
address_only = "environment {env}'s record names no server, but the address {host}: a server of your own, or one that was ended, which this machine has no record of ending; nothing was changed"
lines_live = "environment {env} has lines that are not ended ({lines}; a line bought as part of a Bundle counts): ending its server would leave them pointing at an address that reaches nothing, billed as before; nothing was sent"
lines_live_hint = "`erpc worker delete --release-server{scope}` ends the environment's servers and lines together (a line bought as part of a Bundle is taken off, not ended) and deletes its record"
not_hourly = "the server of environment {env} is not paid for by the hour: this command ends only a server paid for by the hour, and nothing was sent"
said_sized_in = "{size}, in {region}"
said_in = "in {region}"
said_plain = "its size and region are not on record"
question = "End the server of environment {env} of {app} ({what})? Its billing by the hour stops, and what is on it is lost. This cannot be undone."
question_gone = "The ERPC account says the server of environment {env} of {app} is gone (ended, or not this account's). Take it off the environment's record?"
shared = "by this machine's list of apps, the server of environment {env} may also run {others}, which ending it ends too. Such a server is ended only after a yes at a terminal, to a question that names them; nothing was sent"
shared_hint = "run `erpc worker server end{scope}` at a terminal, without --yes or --json: the question names them, and you decide"
shared_unread_hint = "run `erpc worker server end{scope}` at a terminal, without --yes or --json: the question names them, and you decide; or fix the erpc.toml or 1Password item that could not be read"
shared_note = "By this machine's list of apps, the server may also run {others}, which ending it ends too."
needs_yes = "ending the server of environment {env} cannot be undone, and nobody is here to say yes; nothing was sent"
needs_yes_hint = "run `erpc worker server end{scope}` at a terminal, or add --yes"
declined = "not ended, and nothing was sent"
not_recorded = "this machine could not record which server it ends ({error}); nothing was sent"
ending = "ending the server of environment {env}…"
still_there = "the server of environment {env} is still on the ERPC account's record ({state}): {why}"
not_hourly_hint = "the ERPC account says it is not paid for by the hour, and this command ends only a server that is"
busy_hint = "another change to the environment is under way; run `erpc worker server end{scope}` again in {seconds} seconds"
end_unknown = "whether the server of environment {env} was ended is not known: {why}"
status_hint = "`erpc worker status{scope}` shows what the ERPC account's record holds now"
pending = "the ERPC account says the end of the server of environment {env} is under way; the server is still on the record ({state})"
again_hint = "run `erpc worker server end{scope}` again later"
changed = "the server of environment {env} is no longer on the ERPC account's record, which now names another server; nothing more was changed"
clear_unknown = "the server of environment {env} is off the ERPC account's record, but whether its address was cleared from it is not known: {why}"
clear_changed = "the server of environment {env} is off the ERPC account's record, but the record changed meanwhile: it names a server, or an address other than {host}; erpc left it as it is"
clear_failed = "the server of environment {env} is off the ERPC account's record, but its address {host} is still on the record: {why}"
clear_hint = "run `erpc worker server end{scope}` again: it clears the address of a server this machine was ending"
ended = "ended the server of environment {env}: its billing by the hour stopped"
taken_off = "took the gone server of environment {env} off its record"
ended_before = "the server of environment {env} this machine set out to end is no longer on the ERPC account's record"
cleared = "cleared its address, host key, login name and SSH port from the ERPC account's record"
not_forgotten = "this machine's records of the server could not be put away ({error})"
no_address_given = "no address"
not_its_address = "environment {env}'s record names the address {host}, but the ERPC account gives {given} for its server in use: this command ends a server only when the record names its own address or none, so that no other address is ever cleared; nothing was sent"
changed_asked = "environment {env}'s record changed while you were asked: it no longer names the same server at the same address; nothing was sent"
off_record = "the server of environment {env} is no longer on the ERPC account's record"
tidied = "nothing is left to end for environment {env}: its record names no server and no address"
address_gone = "its address is no longer on the ERPC account's record"
open_starts = "environment {env} has starts that are not settled yet ({open}): what they bought may not be on its record, so this command does not end its server now, and nothing was sent"
refused_why = "the ERPC account answered {status} ({code})"
refused_why_reason = "the ERPC account answered {status} ({code}, {reason})"
