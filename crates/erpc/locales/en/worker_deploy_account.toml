not_yet = "environment {env} is kept in the ERPC account, and a deploy there does not yet choose or buy a server, add, change or forget a line, or keep it elsewhere; deploy without those options"
moving = "the ERPC account has a server coming in or going out for environment {env}"
udp = "environment {env} has a UDP Forwarding line in the ERPC account, and a deploy there does not handle one yet"
line_pending = "the {kind} line of environment {env} in the ERPC account has no endpoint yet"
line_unknown = "environment {env} has a line of kind {kind} in the ERPC account, which this erpc does not know"
too_many = "the ERPC account keeps the names of at most {max} settings and {max} secrets of an app, and erpc.toml has more; nothing was deployed"
changed_meanwhile = "another sign-in changed the ERPC account's record of environment {env} during this deploy; it was not written over"
answer_differs = "the ERPC account's answer for environment {env} reaches the server another way than this deploy wrote; nothing was trusted"
allow_too_long = "the ERPC account keeps at most {max} addresses that may reach SSH, and the firewall now lets in more"
not_recorded = "the ERPC account could not record that the app runs on the server of environment {env} ({error}); the key and the secrets were not handed over"
not_kept = "the ERPC account's record: {error}"
line_not_active = "the {kind} line {id} of environment {env} is in state {state} in the ERPC account, not active"
line_twice = "environment {env} has two {kind} lines in the ERPC account, and an app is handed one of each kind"
line_endpoint = "the endpoint of the {kind} line of environment {env} in the ERPC account is not one erpc hands to an app"
changed_before_hand_over = "the ERPC account's record of environment {env} changed during this deploy and is not the one trusted; the key and the secrets were not handed over"
pin_not_updated = "the ERPC account took the write, and this machine's record of what it trusts could not follow ({error}); the next command asks about it again"
line_hint = "`erpc worker status{scope}` shows what the account has; erpc cannot change it there yet: contact ERPC support"
moving_hint = "`erpc worker status{scope}` shows it; erpc cannot finish or undo a change of server yet: contact ERPC support"
not_reread = "the ERPC account's record of environment {env} could not be read again before the hand-over ({error}); the key and the secrets were not handed over"
missing_line_hint = "{first} comes from a line the ERPC account names for this environment, and it names none in use; erpc does not start one there yet"
not_handed_over = "{why}; the release is on the server, and the key and the secrets were not handed over"
changed_before_hand_over_hint = "`erpc worker status{scope}` shows the record; when the change is this deploy's own (who may reach SSH), deploy again and trust it"
line_pending_hint = "deploy once it has one; `erpc worker status{scope}` shows it, and if it stays so, contact ERPC support"
nothing_deployed = "{why}; nothing was deployed"
line_coming_up = "the {kind} line {id} of environment {env} is still being set up in the ERPC account ({state})"
line_coming_up_hint = "it becomes active by itself: deploy again then; `erpc worker status{scope}` shows it, and if it stays so, contact ERPC support with the line's id"
line_maintenance_hint = "`erpc worker status{scope}` shows it; under maintenance is ERPC's own maintenance or a line being ended, which the state does not tell apart: deploy again once it is active, and if it stays so, contact ERPC support with the line's id"
line_suspended_hint = "`erpc worker status{scope}` shows it; a suspended line is stopped, most often for ERPC Credit or a payment, and may resume once what is due is met: paid by the hour, once the credit covers an hour of all the account's hourly charges; paid from credit by the period, once it covers its next period's charge; paid by card, once the unpaid invoice is paid. A line left suspended can be ended, so add credit, or settle the payment, on the ERPC dashboard soon; deploy again once it is active, or contact ERPC support with the line's id"
line_available_hint = "`erpc worker status{scope}` shows it; the line has no address registered yet: register this server's address on its product's page on the ERPC dashboard, or contact ERPC support with the line's id, then deploy again"
line_other_hint = "`erpc worker status{scope}` shows it; deploy again once it is active, and if it stays so, contact ERPC support with the line's id"
not_yet_hint = "`erpc worker status{scope}` shows what the account has, and `deploy` without those options deploys to the server the account names; erpc does not change a server or a line there yet: contact ERPC support"
line_suspended_now_hint = "`erpc worker status{scope}` shows it; a suspended gRPC or Shreds line is stopped, most often for ERPC Credit or a payment. Paid by the hour, or bought in a Bundle paid by the hour, it is normally ended by the account at once, and one ended does not come back, but one still suspended may come back once the credit covers an hour of all the account's hourly charges; paid from credit by the period, it may come back once the credit covers its next period's charge; paid by card, once the unpaid invoice is paid, and after repeated failed payments it can be ended. So add credit, or settle the payment, on the ERPC dashboard now, deploy again once it is active, and if it does not come back, contact ERPC support with the line's id"
unread_not_written = "the ERPC account's list of who may reach SSH has {entries}, which erpc does not read; it was not written over"
nothing_deployed_yet = "nothing was deployed"
seen_not_updated = "this machine's record of the ERPC account's list of who may reach the app, as last put on the server, could not be written ({error}); the next firewall command or deploy says what changed against the list recorded before, or the whole list if none was"
