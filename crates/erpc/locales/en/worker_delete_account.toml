not_endable = "the ERPC account cannot end everything environment {env} runs on yet: something there is still being set up, or still ending"
not_endable_hint = "run `erpc worker delete --release-server{scope}` again once it is done; if it goes on, contact ERPC support"
not_hourly = "environment {env} runs on something not paid by the hour, which the ERPC account does not end"
not_hourly_hint = "cancel it on the ERPC dashboard first, then run `erpc worker delete --release-server{scope}` again once it has ended"
start_pending = "environment {env} has a start with no outcome yet in the ERPC account"
start_pending_hint = "delete it once the start is settled; if it goes on, contact ERPC support"
still_ending = "the ERPC account is still ending what environment {env} runs on"
part_ended = "some of what it ran on may be ended already, and the rest is on record: {why}"
grew = "the ERPC account's record of environment {env} holds a server or a line that was not in the question; it is not ended unasked"
again = "run `erpc worker delete --release-server{scope}` again to finish; it is asked about again"
needs_yes = "deleting environment {env} from the ERPC account ends what it runs on (a line bought as part of a Bundle is only taken off) and cannot be undone, and nobody is here to say yes"
needs_yes_hint = "run `erpc worker delete --release-server{scope}` at a terminal, or add --yes"
question = "Delete environment {env} of {app} from the ERPC account, ending {ends}? This cannot be undone."
question_nothing = "Delete environment {env} of {app} from the ERPC account? Nothing charged is on its record. This cannot be undone."
declined = "not deleted, and nothing was ended"
no_forget = "environment {env} is kept in the ERPC account: --forget and --forget-line are not for such an environment"
needs_release = "environment {env} is kept in the ERPC account, and deleting it there ends its servers and lines (a line bought as part of a Bundle is only taken off)"
needs_release_hint = "add --release-server: `erpc worker delete --release-server{scope}`"
deleted = "Deleted environment {env} from the ERPC account, with what it ran on there ended."
already_gone = "The ERPC account no longer has environment {env}."
not_forgotten = "erpc.toml or this machine's records of the environment could not be updated ({error}): run `erpc worker delete --release-server{scope}` again to finish here"
nothing_ended = "{why}; nothing was ended"
unknown_server = "the ERPC account names no server in use for environment {env}, only the address {host}, and the record does not say whether that was an ERPC server ended already or is a server of your own; that is asked at a terminal"
unknown_server_hint = "run `erpc worker delete --release-server{scope}` at a terminal, without --json, and answer there; --yes is not enough for it"
question_unknown = "The ERPC account names no server in use for environment {env} of {app}, only the address {host}, and this machine cannot tell which server that is. If it was an ERPC server the account no longer lists for this environment, it is ended already; if it is a server of your own, the worker on it keeps running and erpc no longer reaches it. Delete environment {env} from the ERPC account, ending {ends}? This cannot be undone."
question_unknown_nothing = "The ERPC account names no server in use for environment {env} of {app}, only the address {host}, and this machine cannot tell which server that is. If it was an ERPC server the account no longer lists for this environment, it is ended already; if it is a server of your own, the worker on it keeps running and erpc no longer reaches it. Delete environment {env} from the ERPC account? This cannot be undone."
question_gone = "The ERPC account you are signed in to has no environment {env} of {app}. Remove it from erpc.toml?"
gone_needs_yes = "the ERPC account you are signed in to has no environment {env}, and this machine has no record of it under this sign-in; removing it from erpc.toml is asked first, and nobody is here to say yes"
waiting = "the ERPC account is ending what environment {env} runs on; asking again in {secs} s"
busy = "the ERPC account is busy; asking again in {secs} s"
deleted_nothing = "Deleted environment {env} from the ERPC account; its record held nothing to end."
parts_note = "What was bought as part of a Bundle is taken off the environment and not ended: {lines}. Each is billed with its Bundle."
question_parts_only = "Delete environment {env} of {app} from the ERPC account, ending nothing? This cannot be undone."
deleted_but_parts = "Deleted environment {env} from the ERPC account, with what it ran on there ended but for what was bought as part of a Bundle, taken off it and not ended: {lines}. Each is billed with its Bundle."
deleted_parts_only = "Deleted environment {env} from the ERPC account, ending nothing: what was bought as part of a Bundle was taken off it and not ended ({lines}). Each is billed with its Bundle."
forgotten_here = "erpc.toml no longer names it, and this machine's records of it are gone."
busy_throughout = "the ERPC account stayed busy for environment {env}"
ending = "ending {ends} and deleting environment {env} from the ERPC account"
not_agreed = "what was agreed to for environment {env} could not be recorded ({error}); nothing was sent"
agreed_unreadable = "this machine's record of what was agreed to for deletes, {path}, could not be read ({error})"
server_shared = "by this machine's list of apps, or for want of anything to compare it by, what environment {env} runs on may not be its alone: {others}. Such a server is ended only after a yes at a terminal, to a question that names them; nothing was sent"
server_shared_hint = "run `erpc worker delete --release-server{scope}` at a terminal, without --yes or --json: the question names them, and you decide"
shared_note = "By this machine's list of apps, the server in use may also run {others}, which ending it ends too."
no_address_server = "the environment's server in use (the account's record holds no address for it)"
moving_server = "a server coming in or going out (the account's record ties it to no address)"
cannot_tell_note = "This machine cannot tell whether another app or environment is on {which}; whatever is there ends with the delete."
moving_servers = "the servers coming in and going out (the account's record ties them to no address)"
server_shared_unread_hint = "run `erpc worker delete --release-server{scope}` at a terminal, without --yes or --json: the question names them, and you decide; or fix the erpc.toml or 1Password item that could not be read"
sentence_sep = " "
last_note = "Environment {env} is app {app}'s last environment in the ERPC account: the app's record is deleted with it, and with that record the settings and secrets the account keeps for the app."
ending_app = "deleting app {app}'s record from the ERPC account too, with the settings and secrets it keeps for the app: environment {env} is its last environment there"
app_deleted = "App {app}'s record is gone from the ERPC account too, with the settings and secrets it kept for the app."
app_stays = "App {app}'s record stays in the ERPC account: the account now names another environment of it, or another app by that name."
app_not_deleted = "environment {env} is deleted from the ERPC account, and app {app}'s record is not yet: {why}"
app_again = "run `erpc worker delete --release-server{scope}` again to delete it; until then erpc.toml and this machine's records keep the environment"
app_moving = "its record kept changing while it was being deleted"

[servers]
one = "{n} server"
other = "{n} servers"
