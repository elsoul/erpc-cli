keys_scope = "It also reads the contents of files under /root, /home, /etc, /opt, /srv, /var/lib, /tmp and /var/tmp, shell histories and the environments of running processes, looking for private keys and seed phrases kept in plain text. To tell a validator's identity keypair, it reads the command lines and working directories of running processes and the identity file each running validator was given, wherever that file is. The paths it finds are shown only on this screen; nothing about the keys is sent to ERPC."
