not_a_number = "the {what} on record is {id}, which is not a product id the account takes in"
starting = "environment {env} has a start with no outcome yet ({what}); moved now, its purchase would be lost track of"
starting_hint = "deploy it again to settle the start, or remove it from [env.{env}.starting] once it is settled, then move it"
udp = "environment {env} has a UDP Forwarding line, and the account does not yet give the addresses it sends from, which the server's firewall lets in; it is not moved"
not_adoptable = "the ERPC account does not take line {id} into an environment ({reason})"
not_adoptable_hint = "the environment keeps working from erpc.toml as before; ERPC support, given the line's product ID {id}, can say how to go on"
in_item = "environment {env} keeps its server facts in a 1Password item, which every checkout of the app reads; such an environment is not moved yet"
backup = "environment {env} is backed up, and a move would carry the backup's keys into the ERPC account, where deleting the environment does not revoke them yet; it is not moved"
backup_hint = "`erpc worker backup off{scope}` stops the backup and removes its keys (the snapshots stay); move it then, and turn the backup on again once erpc carries it"
not_open = "the ERPC account does not yet let this sign-in end the servers and lines of an environment kept there, so a moved environment could not be ended; nothing was moved"
not_open_hint = "move it once the account lets erpc do that"
app_differs = "the ERPC account already has an app named {app} on another chain or with another wallet; nothing was moved"
env_differs = "the ERPC account already keeps environment {env} of this app with another server or other lines than erpc.toml names; it was not moved"
not_moved = "{why}; environment {env} was not moved"
env_differs_why = "the ERPC account's record of environment {env} holds another server or other lines than erpc.toml names"
attached_elsewhere_why = "the account has this server or line on another environment already"
not_adoptable_unsaid = "the ERPC account does not take line {id} into an environment"
line_not_found_hint = "if the ERPC dashboard shows line {id} as ended, `erpc worker deploy --forget-line {id}{scope}` takes it off erpc.toml's record (as a deploy does), then run the move again; otherwise contact ERPC support with the line's product ID {id}"
line_not_found = "the ERPC account does not have line {id}: it may have been ended, or it is not this account's"
part_way_hint = "erpc.toml is as it was; the same move goes on from where it stopped once what stopped it is settled; if it stays so, contact ERPC support"
part_way = "the move of environment {env} stopped part way: {why}; the move did not change erpc.toml, and what it already wrote to the account stays there"
not_pinned = "environment {env} is moved, but this machine's record of what it trusts of it could not be written ({error}): the next command on it asks whether to trust the server the account names, or, while that record cannot be read, stops until it is fixed or moved away"
no_server = "environment {env} runs on no server yet; it is not moved"
too_many = "erpc.toml names more than {max} settings or {max} secret settings, and the ERPC account keeps the names of at most {max} of each: once moved, no deploy of environment {env} could go through; it is not moved"
bundle_part = "the ERPC account does not take line {id} into an environment: it was bought as part of a Bundle, and stays with its Bundle"
attached_elsewhere_hint = "erpc.toml is as it was; contact ERPC support about which environment of the account holds it"
changed_meanwhile = "the ERPC account's record of environment {env} changed while it was moved, and no longer reaches the server the way erpc.toml says; nothing was trusted, and erpc.toml is as it was"
file_changed = "erpc.toml changed while environment {env} was moved: another command wrote it; run the move again"
state_unread = "could not read whether the app runs on its server: {error}"
already = "environment {env} is kept in the ERPC account already"
moved = "Moved environment {env} into the ERPC account, {taken}; erpc.toml keeps only account = true."
needs_yes = "moving environment {env} into the ERPC account cannot be undone, and nobody is here to say yes"
needs_yes_hint = "run `erpc worker move --to account{scope}` at a terminal, or add --yes"
question = "Move environment {env} into the ERPC account, {taken}?"
declined = "not moved, and nothing was changed"
loses_oneway = "The move cannot be undone: erpc.toml then keeps only account = true, and the account does not give the product ids back."
loses_access = "Every command on it then needs your ERPC sign-in and the account reachable; this machine trusts its server as moved, and another machine signed in to the same ERPC account trusts it once with a yes at a terminal (--yes and --json do not give it), while another ERPC account does not see it; when what the account says of the server changes, it is asked again at a terminal, as when a deploy from another machine adds that machine's address to the SSH list; an ERPC server the account does not show as active is not reached, not even to stop the app."
loses_commands = "rollback, backup, api, trades and bench do not work on it yet; firewall does, on the account's lists (at most 16 addresses each, erpc's own counted in the SSH list); status no longer says what it costs by the hour or how long the credit lasts."
loses_deploy = "deploy no longer takes --host, --user, --port, --fingerprint, --server, --new-server, --region, --plan, --grpc, --shreds, --unlimited, --udp, --udp-port, --udp-region, --udp-any-source, --forget-line, --vault or --inline: its server cannot be chosen or bought, no line can be added or taken off the record, and a deploy cannot bring it back into erpc.toml or 1Password; a deploy is refused while a line on the account's record that has not ended is not active."
loses_delete = "delete --release-server does not reach the server or remove the worker: it asks the account to end everything the environment runs on, and the account ends nothing while anything on it but a line bought as part of a Bundle (which it takes off the environment without ending it, whatever its state) is not paid by the hour, cannot be ended in the state it is in, or is a start with no outcome; its hourly server and lines then stay charged, and are ended only when that is settled and the delete is run again. On a server of your own it is asked at a terminal only, --yes not being enough, and the worker keeps running there. A plain delete, delete --forget and delete --forget-line are refused."
loses_bundle = "A line bought as part of a Bundle is not taken in: the account refuses it, and the move stops there, what was already written to the account staying there; until its Bundle is on the account's record it may be taken in, and then erpc takes it off the record only by deleting the environment, which does not end it, and cannot end it apart from its Bundle."
loses_others = "While an environment of this machine is kept in the account, a delete --release-server --yes of this machine's other environments that would end a server is refused, and of this one too once another is kept there; without --yes, it is asked at a terminal."
loses_more = "More differences are listed in docs/worker.md, under \"What changes once moved\"."
env_differs_hint = "erpc.toml is as it was; ERPC support, given this environment, can say how to go on"
not_ready = "environment {env} has a server with no address or no host key in erpc.toml yet; moved now, nothing could reach it from there"
not_ready_hint = "`erpc worker deploy{scope}` sets the server up first; move it after"

