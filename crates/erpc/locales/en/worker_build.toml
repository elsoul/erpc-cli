built = "Built {app} release {id}"
binary_for = "{binary} for {target}, {size}"
glibc = " (glibc {glibc} or newer)"
from = "from {commit}"
from_dirty = "from {commit} with changes not committed"
dirty = "{commit} with changes not committed"
not_from_git = "not from a git repository"
building = "building for {target}: cargo {subcommand} {args} --target {target} (this can take a few minutes)"
could_not_read = "could not read {path}: {error}"
could_not_write = "could not write {path}: {error}"
could_not_run = "could not run cargo {subcommand}: {error}"
failed = "the build for {triple} failed ({status})"
warnings = "built; warnings: {count}; the full output is in {path}"
warnings_no_log = "built; warnings: {count}; the output could not be kept in {path}: {error}"
log_hint = "the full output is in {path}"
no_binary = "the build finished, and {bin} is not there"
no_binary_hint = "set build.bin in erpc.toml to the binary's name"
command_has_target = "build.command names a --target; the servers' target is build.target"
not_cargo = "build.command is `{command}`; erpc worker builds for servers only an app whose command is `cargo build …`"
no_zig = "zig is not installed; the cross-build links with it"
no_zig_hint = "install zig (on macOS: `brew install zig`), then run this again"
no_zigbuild = "cargo-zigbuild is not installed"
no_zigbuild_hint = "`cargo install cargo-zigbuild --locked`, then run this again"
no_std = "the Rust standard library for {triple} is not installed"
no_std_hint = "`rustup target add {triple}`, then run this again"
not_a_file = "run.files names {path}, and {full} is not a file"
no_cargo = "cargo is not installed; the app is built with it"
no_cargo_hint = "install Rust with rustup, then run this again; or build the app's Linux binary another way and name it in build.prebuilt"
no_way = "this machine has no way to build the app for its servers"
native = "built with this machine's own toolchain: the binary needs glibc {glibc} or newer on the server (with zig and cargo-zigbuild installed it is built for glibc {floor} and up)"
native_no_glibc = "built with this machine's own toolchain"
prebuilt = "shipping the prebuilt binary {path}"
prebuilt_glibc = "shipping the prebuilt binary {path}: it needs glibc {glibc} or newer on the server"
no_prebuilt = "build.prebuilt names {path}, and {full} is not a file"
no_prebuilt_hint = "build the app's Linux binary there, then run this again"
prebuilt_outside = "build.prebuilt names {path}, and {full} leads out of the app's directory: erpc ships a file of the app, not one a link points to elsewhere"
prebuilt_outside_hint = "copy the binary into the app's directory and name the copy"
prebuilt_too_large = "{path} is larger than 1 GiB: erpc does not ship a binary of that size"
not_for_servers = "{path} cannot run on a server: {why}"
other_machine = "{path} is built for {arch}, and build.target is {triple}"
other_machine_hint = "build it for the servers' machine, or set build.target in erpc.toml to the one it is for"
other_libc = "{path} is linked against {loader}, which a {triple} server does not have"
other_libc_hint = "link it statically, or against glibc with its loader at the usual path"
prebuilt_not_here = "{path} is built for {triple}, and this machine is {os} on {arch}: it cannot run here"
prebuilt_not_here_hint = "deploy it to run it on a server"

[elf]
macos = "it is a macOS binary, and the servers run Linux"
windows = "it is a Windows binary, and the servers run Linux"
script = "it is a script, not a compiled binary"
not_elf = "it is not a Linux (ELF) binary"
bits32 = "it is a 32-bit binary, and the servers are 64-bit"
big_endian = "it is a big-endian binary"
cut_short = "it is cut short: it ends before what its ELF header names"
not_executable = "it is not a program (an object file or a core)"
nothing_to_load = "it names nothing to load: not a program a server can start"
shared_library = "it is a shared library, not a program"
shared_library_hint = "a static program built to load at any address is told from a library by a flag its linker writes (DF_1_PIE); if this is such a program, link it with `-static-pie` through a current toolchain, or with `-no-pie`"

[field]
binary = "binary"
target = "target"
size = "size"
source = "source"
record = "record"
