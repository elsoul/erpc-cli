needs_terminal = "the ERPC account has no host key on record for the server of environment {env} yet; erpc records one only after asking at a terminal (--yes is not enough), since that decides which host key is trusted"
needs_terminal_hint = "run `erpc worker deploy{scope}` at a terminal, without --json"
waiting = "the server of environment {env} is not ready to log in to yet; asking the ERPC account again in {secs} s"
not_ready = "the server of environment {env} was not ready to log in to after about ten minutes of waiting; nothing was changed on it"
again_hint = "run `erpc worker deploy{scope}` again; it takes up from where this stopped"
settled_hint = "run `erpc worker deploy{scope}` again once that is settled"
question = "erpc logs in once to the server of environment {env}, at {ip}, to put your key on it and turn password logins off. The host key it offers: {fingerprint}. Your key: {key}. This starts nothing and has no price; the address and that host key then go into the ERPC account's record, and the deploy asks whether to trust what the account then has. Go on?"
question_done = "erpc made the server of environment {env}, at {ip}, key-only before; the host key it offers: {fingerprint}. This starts nothing and has no price; the address and that host key now go into the ERPC account's record, and the deploy asks whether to trust what the account then has. Go on?"
declined = "not logged in to; nothing was changed"
changed = "the ERPC account's record of the server of environment {env} changed while erpc waited or asked; nothing was sent to the server"
cannot_log_in = "erpc cannot log in to the server of environment {env}: {why}"
busy = "the ERPC account asks to wait {secs} s before the server's first login is read again; nothing was sent to the server"
gone = "the ERPC account says the server of environment {env} is gone; it is not logged in to"
no_machine = "the ERPC account has no machine attached to the server of environment {env}; it is not logged in to"
unreadable = "the ERPC account's answer with the first login of the server of environment {env} could not be read; it is not logged in to"
odd_name = "the ERPC account gives a login name for the server of environment {env} that erpc does not use; it is not logged in to"
no_password_empty = "the ERPC account gave an empty password for it, so erpc cannot make the first login; ERPC support can help"
no_password_pending = "the ERPC account has not handed its password over yet; run the deploy again in a minute"
no_password_deleted = "the ERPC account has removed its password, as it does a day after handing it over, so erpc cannot make the first login; ERPC support can help"
no_password_none = "the ERPC account has no password for it, so erpc cannot make the first login; ERPC support can help"
not_secured = "the first login to the server of environment {env} did not finish: {why}"
not_written = "your key is on the server of environment {env} and password logins are off, but the ERPC account's record changed meanwhile, so this run did not write its address and host key to it"
not_written_busy = "your key is on the server of environment {env} and password logins are off, but the ERPC account stayed too busy to take its address and host key"
not_written_error = "your key is on the server of environment {env} and password logins are off, but this run did not write its address and host key to the ERPC account's record: {why}"
recorded = "Recorded the address and host key of the server of environment {env} at {ip} in the ERPC account's record; erpc made it key-only before, and did not log in to it again."
not_written_unknown = "your key is on the server of environment {env} and password logins are off, but whether its address and host key were written to the ERPC account's record is not known: {why}"
done = "Logged in to the server of environment {env} at {ip} once: your key is on it, password logins are off, and its address and host key are in the ERPC account's record."
