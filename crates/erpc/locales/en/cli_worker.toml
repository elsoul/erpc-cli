"worker" = "Apps you run on your own server: make one from a template, run it here, deploy it"
"worker init" = "Make a new app from a template, with its erpc.toml"
"worker init --chain" = "The chain the app is for"
"worker init --template" = "What to make, without asking: hft or pumpfun-bot, or a template id such as pumpfun (default: pick with the arrow keys)"
"worker init --name" = "The app's name, and its directory's (default: the choice's own, such as hft-bot, with -2, -3… when that directory is taken)"
"worker init --into" = "Where to make the app's directory (default: the current directory)"
"worker init --no-git" = "Do not make it a git repository"
"worker init --yes" = "Make it without asking anything"
"worker check" = "Check erpc.toml and say what it describes, without changing anything"
"worker check <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker check --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker check --env" = "Also require this environment to be there"
"worker key" = "The trading key: kept in 1Password or the keychain, never in a file"
"worker key new" = "Make a new key in memory and keep it only in 1Password or the keychain"
"worker key new <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker key new --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker key new --store" = "1Password or the keychain (default: 1Password when `erpc login` keeps the session there, else the keychain)"
"worker key new --vault" = "The 1Password vault, by id (default: the session's)"
"worker key import" = "Move a key file into 1Password or the keychain, then offer to wipe the file"
"worker key import --dir" = "The app's directory, or a directory inside it, or the app's name (default: the current directory)"
"worker key import <file>" = "The key file, as the Solana CLI writes one"
"worker key import --store" = "1Password or the keychain (default: 1Password when `erpc login` keeps the session there, else the keychain)"
"worker key import --vault" = "The 1Password vault, by id (default: the session's)"
"worker key import --wipe" = "Wipe the key file once the key is in the store, without asking"
"worker key show" = "Show the key's public key and where it is kept"
"worker key show <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker key show --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker key balance" = "Show the key's balance, through the app's own RPC setting"
"worker key balance <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker key balance --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker key balance --rpc" = "Ask this RPC instead of the app's"
"worker secret" = "Secret settings: kept in 1Password or the keychain, named in erpc.toml"
"worker secret put" = "Keep a secret setting, piped in or typed unseen, and name it in [secrets]"
"worker secret put --dir" = "The app's directory, or a directory inside it, or the app's name (default: the current directory)"
"worker secret put <name>" = "The setting's name, such as `X_TOKEN`"
"worker secret put --store" = "1Password or the keychain (default: 1Password when `erpc login` keeps the session there, else the keychain)"
"worker secret put --vault" = "The 1Password vault, by id (default: the session's)"
"worker secret put --replace" = "Keep a new value for a name that is set already"
"worker secret list" = "List the secret settings by name and where each is kept"
"worker secret list <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker secret list --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker secret rm" = "Remove a secret setting from erpc.toml; its value stays where it is kept"
"worker secret rm --dir" = "The app's directory, or a directory inside it, or the app's name (default: the current directory)"
"worker secret rm <name>" = "The setting's name"
"worker run" = "Build the app for this machine and run it here, with its key on a pipe"
"worker run <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker run --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker run --check" = "Start it, wait until it is healthy, stop it, and say how it went"
"worker build" = "Build the app for the servers it deploys to, without deploying"
"worker build <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker build --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker deploy" = "Deploy the app to an environment's server: build, upload, firewall, start"
"worker deploy <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker deploy --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker deploy --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker deploy --host" = "A server of your own, by address (when erpc.toml has no server for the environment)"
"worker deploy --user" = "The account to log in to on --host"
"worker deploy --port" = "The SSH port on --host"
"worker deploy --fingerprint" = "The SSH host key fingerprint --host should offer, instead of being asked"
"worker deploy --vps" = "An ERPC VPS of the account, by its id"
"worker deploy --new-vps" = "Start a new hourly ERPC VPS for it (its price is shown first)"
"worker deploy --region" = "The region of a new VPS (default: nearest by this machine's time zone)"
"worker deploy --plan" = "The hourly plan of a new VPS, by product id (default: the cheapest)"
"worker deploy --grpc" = "Start an hourly gRPC line that lets in the server, and set `GRPC_ENDPOINT` to it (its price is shown first)"
"worker deploy --grpc-plan" = "The hourly plan of the gRPC line, by product id (default: the cheapest)"
"worker deploy --shreds" = "Start an hourly Shreds line that lets in the server, and set `SHREDS_ENDPOINT` to it (its price is shown first)"
"worker deploy --shreds-plan" = "The hourly plan of the Shreds line, by product id (default: the cheapest)"
"worker deploy --unlimited" = "Start an hourly Unlimited RPC in the server's region, let the server in, and send transactions through it (`SOLANA_SEND_RPC_ENDPOINT`; its price is shown first)"
"worker deploy --unlimited-plan" = "The hourly plan of the Unlimited RPC, by product id (default: the cheapest)"
"worker deploy --vault" = "For a new environment: keep its server facts in this 1Password vault (default: the one `erpc login` keeps the session in, when that is 1Password)"
"worker deploy --inline" = "For a new environment: keep its server facts in erpc.toml"
"worker deploy --forget-line" = "Take a data line off the record first, by its id: one ended outside erpc (in the dashboard) that deploy waits for. Repeatable"
"worker deploy --yes" = "Go ahead without asking (a new VPS's or line's price is asked all the same)"
"worker bench" = "Time RPC calls from an environment's server: ERPC's shared RPC, its Unlimited RPC, and any other, side by side"
"worker bench <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker bench --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker bench --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker bench --method" = "The JSON-RPC method: getSlot, getBlockHeight, getLatestBlockhash or getHealth"
"worker bench --rounds" = "Calls per endpoint, counted after two warm-up calls"
"worker bench --interval" = "A pause between rounds, in milliseconds, for an RPC whose plan limits calls per second (a shared RPC plan, a free tier)"
"worker bench --url" = "Another endpoint to compare, such as an RPC from another provider: NAME=URL, NAME=op://… or NAME=keychain:… (where the URL is kept, so a key in it stays out of shell history), or NAME=- to type it unseen. Only its scheme, host and port are shown"
"worker bench --no-shared" = "Leave out ERPC's shared RPC"
"worker status" = "Show whether the app runs on an environment's server, and which release"
"worker status <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker status --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker status --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker logs" = "Show the app's log on an environment's server"
"worker logs <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker logs --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker logs --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker logs --follow" = "Keep showing new lines as they come"
"worker logs --lines" = "How many recent lines to show"
"worker start" = "Start the app on an environment's server, sending its key if needed"
"worker start <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker start --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker start --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker start --yes" = "Go ahead without asking"
"worker stop" = "Stop the app on an environment's server"
"worker stop <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker stop --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker stop --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker stop --lock" = "Also drop the key from the server's memory; `start` sends it again"
"worker stop --yes" = "Go ahead without asking"
"worker restart" = "Restart the app on an environment's server"
"worker restart <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker restart --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker restart --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker restart --yes" = "Go ahead without asking"
"worker rollback" = "Go back to the previous release, or to the one named"
"worker rollback <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker rollback --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker rollback --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker rollback --to" = "The release to go back to, as `releases` names it"
