"worker releases" = "List the releases an environment's server keeps"
"worker releases <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker releases --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker releases --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker firewall" = "Who may reach an environment's server"
"worker firewall list" = "Show who may reach the server, as erpc.toml says and as the server has it"
"worker firewall list <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
