"worker firewall sync <app_name>" = "The app, by the name erpc knows it by (`erpc worker list`) (default: the app the current directory is in)"
"worker firewall sync --dir" = "The app's directory, or a directory inside it; an app's name works too (default: the current directory)"
"worker firewall sync --env" = "The environment: an `[env.<name>]` table in erpc.toml"
"worker firewall sync --yes" = "Go ahead without asking"
