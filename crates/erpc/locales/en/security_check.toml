[finding]
solana_rpc_public = "Solana JSON-RPC is reachable from the internet."
solana_full_rpc_api_public = "The full Solana RPC API is open to the internet: anyone can send heavy queries that slow or stop the node."
solana_ws_public = "The Solana PubSub WebSocket is reachable from the internet."
evm_rpc_public = "An EVM JSON-RPC endpoint is reachable from the internet."
evm_admin_api_public = "Administrative RPC methods (admin, personal or debug) answer from the internet."
docker_api_public = "The Docker Engine API answers from the internet: whoever reaches it can run containers as root on this server."
database_public = "A database port answers from the internet."
redis_no_auth_public = "Redis answers from the internet without a password: its data can be read and changed, and it can be made to write files."
metrics_public = "A metrics or dashboard service is reachable from the internet and tells strangers about the server."
unknown_service_public = "A port answers from the internet with a service the check could not identify."
tls_legacy_protocol = "A TLS service still accepts versions older than TLS 1.2."
ssh_password_auth = "SSH accepts passwords, which leaves it open to password guessing."
ssh_root_login = "SSH lets root sign in with a password."
no_host_firewall = "No host firewall drops incoming traffic by default."
docker_bypasses_firewall = "A port Docker publishes is reachable from the internet although ufw is on: Docker's rules come before ufw's."
wildcard_listener_exposed = "A service listening on every address is reachable from the internet."
package_vulnerable = "An installed package's version has published security advisories."
os_end_of_life = "This operating system release no longer receives security updates."
plaintext_wallet_key = "A wallet private key is stored in plain text on this server."
key_world_readable = "A private key or secret on this server can be read by every account."
withdraw_authority_on_server = "The vote account's withdraw authority is on this server: whoever takes the server can take the account and its rewards."
validator_identity_permissions = "The validator identity keypair can be read by accounts other than its owner."
mnemonic_on_disk = "A seed phrase is stored in plain text: it restores every key made from it."
unencrypted_keystore = "A keystore file is stored without encryption."
secret_in_env_file = "An environment file holds a private key or secret in plain text."
secret_in_process_env = "A running process got a private key or secret through its environment, where other tools and crash reports can read it."
secret_in_shell_history = "A private key or secret was typed on the command line and is kept in a shell history file."
scan_incomplete = "The scan from outside did not finish: open ports may be missing from this report."
local_view_partial = "Part of this server could not be read, so this report may miss processes or files."

[fix]
solana_rpc_public = "Bind RPC to 127.0.0.1 (--rpc-bind-address 127.0.0.1, or --private-rpc), or allow only the addresses that need it in the firewall."
solana_full_rpc_api_public = "Drop --full-rpc-api from a public port, or keep RPC private and put an authenticating proxy in front of it."
solana_ws_public = "Keep the WebSocket private with RPC, or allow only the addresses that need it in the firewall."
evm_rpc_public = "Bind HTTP and WebSocket RPC to 127.0.0.1, or allow only trusted addresses in the firewall."
evm_admin_api_public = "Remove admin, personal and debug from the HTTP and WebSocket APIs and keep RPC off public addresses."
docker_api_public = "Stop serving the Docker API over TCP: use the local socket, or TLS client certificates behind a firewall rule."
database_public = "Bind the database to 127.0.0.1 or a private network, require a password, and close the port in the firewall."
redis_no_auth_public = "Bind Redis to 127.0.0.1, set requirepass or ACL users, and close the port in the firewall."
metrics_public = "Allow metrics and dashboards only from trusted addresses, or put them behind a sign-in."
unknown_service_public = "Find out what listens on this port; close it in the firewall if it need not be public."
tls_legacy_protocol = "Turn off TLS 1.0 and 1.1 in the service's settings."
ssh_password_auth = "Use keys only: set PasswordAuthentication no and KbdInteractiveAuthentication no, then reload sshd."
ssh_root_login = "Set PermitRootLogin prohibit-password or no, and sign in as a normal user with sudo."
no_host_firewall = "Turn on a firewall that drops incoming traffic by default and allow only the ports the node needs."
docker_bypasses_firewall = "Publish the port on 127.0.0.1 only (-p 127.0.0.1:PORT:PORT), or filter it in the DOCKER-USER chain."
wildcard_listener_exposed = "Bind the service to 127.0.0.1 or a private address if it is not meant to be public, or restrict it in the firewall."
package_vulnerable = "Install the security updates for this package and restart the services that use it."
os_end_of_life = "Upgrade to a release that still receives security updates."
plaintext_wallet_key = "Move the key off the server into a password manager or keychain, and give it to the app in memory when it starts."
key_world_readable = "Make the file readable by its owner only (chmod 600), and move it off the server if it controls funds."
withdraw_authority_on_server = "Remove the withdraw authority from the server and keep it offline or on a hardware wallet."
validator_identity_permissions = "Make the identity keypair readable by the validator's own user only (chmod 600)."
mnemonic_on_disk = "Move the funds to a new wallet whose seed phrase never touches a server, then delete the file."
unencrypted_keystore = "Encrypt the keystore with a passphrase, or move the key into a password manager."
secret_in_env_file = "Keep secrets out of environment files: load them from a password manager or keychain when the app starts."
secret_in_process_env = "Give the secret to the process through a pipe or a file descriptor instead of its environment."
secret_in_shell_history = "Remove those lines from the history file, and replace the secret: it has been exposed."
scan_incomplete = "Run the check again later."
local_view_partial = "Run the check as root to read every process and file."
