no_number = "user-api не сообщил номер нового ключа доступа; отзовите его через `erpc storage keys revoke <n>`"
not_in_list = "его нет в списке ключей"
label_lost = "новый ключ доступа не сохранил метку, а она нужна `off`"
unchecked = "не удалось проверить новый ключ доступа: {why}"
not_recorded = "не удалось записать новые ключи ({why}); сервер не изменён"
bad_credentials = "в новых учётных данных есть символ, который сервер не принимает"
kept_in_item = "его элементе 1Password"
kept_in_toml = "erpc.toml; закоммитьте изменение"
done = "Резервная копия воркера {id} создаётся ежедневно в {at} (по времени сервера), в течение 30 минут после этого времени.\n  снимки          с именем {host}\n  сейчас          erpc worker backup now{scope}\n  восстановление  erpc backup restore latest --from-host {host} --path {source} --target <dir>\n                  (после `erpc backup init` на этой машине)\nНомера ключей записаны в [env.{env}], в {kept_in}.\nПароль репозитория хранится в {place}; сохраните копию вне этой машины (`erpc backup password --show`).\n\nФайлы копируются как есть, пока воркер работает: для согласованного восстановления базы данных, в которую он пишет, может понадобиться её отдельный дамп."
replaced = "его прежние ключи резервного копирования отозваны, поэтому резервное копирование воркера не выполняется, пока `on` не пройдёт успешно"

[off]
ask = "Остановить резервное копирование воркера {id} и отозвать его ключи. Снимки остаются; `erpc backup prune --host {host}` их проредит."
