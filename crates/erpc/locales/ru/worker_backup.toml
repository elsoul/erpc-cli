[custody]
made = "Пароль репозитория резервных копий аккаунта создан сейчас и хранится в {place}. Сохраните копию вне этой машины:\n  erpc backup password --show\nНа этой машине также хранится административный ключ резервного копирования аккаунта, поэтому тот, кто получит над ней контроль, сможет удалить резервные копии."
kept = "Пароль репозитория резервных копий аккаунта сохранён сейчас в {place}. Сохраните копию вне этой машины:\n  erpc backup password --show\nНа этой машине также хранится административный ключ резервного копирования аккаунта, поэтому тот, кто получит над ней контроль, сможет удалить резервные копии."

[undo]
left = "созданные для этого ключи удалены не все ({reasons}); {by_hand}"

[on]
ask = "Ежедневно в {at} (по времени сервера) создавать резервную копию воркера {id} в ERPC Global Storage с шифрованием restic, под именем {host}.\nЕго сервер получит ключ доступа с правом только на добавление и собственный ключ к единственному репозиторию резервных копий аккаунта. Удалять снимки он не сможет, но тот, кто получит контроль над сервером, сможет читать снимки всех машин аккаунта, сохранит ключ репозитория даже после `off`, сможет добавлять снимки от имени другой машины и заполнить хранилище аккаунта, что остановит резервное копирование всех машин. Лишить его доступа можно только отзывом ключа доступа (`off`)."
install_failed = "не удалось установить restic на сервер: {error}"
