question = "Сделать {app} воркером ERPC Worker в вашем аккаунте ERPC на новом сервере для окружения {env}: ядер {cores}, {memory} ГБ, регион {region}, €{price} в час из кредитов ERPC? Он оплачивается почасово, пока не будет завершён, не меньше чем за один час. После подтверждения erpc.toml с этого момента хранит окружение {env} в аккаунте ERPC (`account = true`), а это развёртывание дождётся готовности сервера, после подтверждения здесь один раз войдёт на него и развернёт на нём приложение. Завершить его из erpc можно командой `erpc worker delete --release-server{scope}` в терминале; вместе с ним удаляется и запись окружения, а если это последнее окружение приложения там, то и запись приложения."
note = "{app} становится воркером ERPC Worker в вашем аккаунте ERPC на новом сервере для окружения {env}: ядер {cores}, {memory} ГБ, регион {region}, €{price} в час из кредитов ERPC. Он оплачивается почасово, пока не будет завершён, не меньше чем за один час. erpc.toml с этого момента хранит окружение {env} в аккаунте ERPC (`account = true`), а это развёртывание дождётся готовности сервера, после подтверждения в этом терминале один раз войдёт на него и развернёт на нём приложение. Завершить его из erpc можно командой `erpc worker delete --release-server{scope}` в терминале; вместе с ним удаляется и запись окружения, а если это последнее окружение приложения там, то и запись приложения."
new_option = "Запустить новый сервер с почасовой оплатой в вашем аккаунте ERPC, и приложение станет там ERPC Worker (самый дешёвый размер, рядом с {region}); сначала будет показана цена"
as_before = "окружение {env} хранится в erpc.toml, как и раньше, а не в аккаунте ERPC: {why}"
why_lines = "окружение, хранящееся в аккаунте ERPC, пока не принимает линии данных от развёртывания"
why_plan = "--plan называет продукт, а сервер в аккаунте ERPC запускается по размеру"
why_wallet = "erpc.toml называет кошелёк, а этот erpc пока не создаёт в аккаунте ERPC запись приложения с кошельком"
needs_terminal = "новый сервер для окружения {env} делает приложение воркером ERPC Worker в аккаунте ERPC, а erpc один раз входит на этот сервер только после подтверждения в терминале (--yes недостаточно, а с --json никого не спрашивают); ничего не запущено и не записано"
needs_terminal_hint = "запустите `erpc worker deploy --new-server{scope}` в терминале, без --json; без терминала --server <id> или --host <address> называет ваш сервер, а --new-server --inline хранит окружение в erpc.toml, как раньше, где --yes отвечает и на первый вход"
resume_needs_terminal = "окружение {env} хранится в аккаунте ERPC, где для него пока нет сервера: это развёртывание запустит его там, а erpc один раз входит на него только после подтверждения в терминале (--yes недостаточно, а с --json никого не спрашивают); ничего не запущено"
resume_needs_terminal_hint = "запустите `erpc worker deploy{scope}` в терминале, без --json"
not_written = "не удалось записать в erpc.toml, что окружение {env} хранится в аккаунте ERPC (`account = true`): {error}; ничего не запущено"
file_changed = "в [env.{env}] там теперь другие настройки"
kept_now_hint = "erpc.toml теперь хранит окружение {env} в аккаунте ERPC: `erpc worker deploy{scope}` продолжит с места остановки; он сначала читает аккаунт ERPC и не делает нового запуска, пока какой-то запуск открыт или в записи есть сервер"
started_hint = "окружение {env} теперь хранится в аккаунте ERPC, и его сервер оплачивается почасово: `erpc worker deploy{scope}` продолжит с ним"
holds_hint = "если в erpc.toml под [env.{env}] стоит `account = true`, `erpc worker deploy{scope}` развернёт приложение на сервере из записи аккаунта"
differs_hint = "`erpc worker deploy{scope}` без --region или с --region {region} снова отправит сохранённый запуск, пока аккаунт ERPC показывает открытым только его, а в записи окружения нет сервера"
no_record = "в аккаунте ERPC, в который выполнен вход, нет записи окружения {env} приложения {app}, которое erpc.toml хранит в аккаунте ERPC; ничего не запущено"
no_record_hint = "если его создали в другом аккаунте ERPC, выполните `erpc login` в нём; `erpc worker deploy --new-server{scope}` запустит для него новый сервер в аккаунте, в который выполнен вход, сначала спросив цену"
