differs_hint = "`erpc worker deploy{scope}` без --region или с --region {region} снова отправит сохранённый запуск, пока аккаунт ERPC показывает открытым только его, а в записи окружения нет сервера"
no_record = "в аккаунте ERPC, в который выполнен вход, нет записи окружения {env} приложения {app}, которое erpc.toml хранит в аккаунте ERPC; ничего не запущено"
no_record_hint = "если его создали в другом аккаунте ERPC, выполните `erpc login` в нём; `erpc worker deploy --new-server{scope}` запустит для него новый сервер в аккаунте, в который выполнен вход, сначала спросив цену"
