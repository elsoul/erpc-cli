question = "Запустить {app} на новом {worker} в вашем аккаунте ERPC для окружения {env}, регион {region}, €{price} в час из кредитов ERPC? Он оплачивается почасово, пока не будет завершён, не меньше чем за один час. После подтверждения erpc.toml с этого момента хранит окружение {env} в аккаунте ERPC (`account = true`), а это развёртывание дождётся его готовности, после подтверждения здесь один раз войдёт на него и развернёт на нём приложение. Завершить его из erpc можно командой `erpc worker delete --release-server{scope}` в терминале; вместе с ним удаляется и запись окружения, а если это последнее окружение приложения там, то и запись приложения."
note = "{app} запускается на новом {worker} в вашем аккаунте ERPC для окружения {env}, регион {region}, €{price} в час из кредитов ERPC. Он оплачивается почасово, пока не будет завершён, не меньше чем за один час. erpc.toml с этого момента хранит окружение {env} в аккаунте ERPC (`account = true`), а это развёртывание дождётся его готовности, после подтверждения в этом терминале один раз войдёт на него и развернёт на нём приложение. Завершить его из erpc можно командой `erpc worker delete --release-server{scope}` в терминале; вместе с ним удаляется и запись окружения, а если это последнее окружение приложения там, то и запись приложения."
new_option = "Запустить новый ERPC Worker с почасовой оплатой в вашем аккаунте ERPC (самый дешёвый размер, рядом с {region}); сначала будет показана цена"
as_before = "окружение {env} хранится в erpc.toml, как и раньше, а не в аккаунте ERPC: {why}"
why_lines = "развёртывание окружения, которое хранится в аккаунте ERPC, пока не принимает линию UDP Forwarding и --forget-line"
why_plan = "--plan называет продукт, а сервер в аккаунте ERPC запускается по размеру"
line_unreadable = "не удаётся прочитать записи этой машины о запусках линий, {path} ({error}): запуск в них мог купить линию, поэтому ничего не запускается"
line_open = "для окружения {env} открыт запуск линии {kind} ({start}), сделанный не этой машиной: он ещё может купить то, ради чего был сделан, поэтому другой запуск не делается"
line_kept_other = "запуск линии {kind} для окружения {env} сохранён на этой машине для другого плана или адреса, чем просит этот запуск (план {plan}); ничего не отправлено"
line_kept_other_hint = "запустите развёртывание с планом линии, для которого он сохранён, с того места, где сейчас сервер, чтобы отправить его снова с тем же ключом; что с ним стало, может сказать поддержка ERPC"
line_started = "Запущена линия {kind} для окружения {env} в аккаунте ERPC."
line_key_let_go = "Эта машина отпустила ключ запуска линии."
line_key_kept = "Эта машина хранит ключ запуска линии: при повторном запуске сначала читается аккаунт ERPC, и запуск отправляется снова с тем же ключом."
line_not_started = "линия {kind} окружения {env} не запущена: {why}"
line_again_hint = "запустите `erpc worker deploy{scope}` ещё раз: сначала читается аккаунт ERPC, и вторая линия не покупается"
line_note = "Запускается линия {kind} ({name}, продукт {product}) для окружения {env} в аккаунте ERPC за €{price} в час, по цене почасового прайс-листа; она оплачивается почасово, пока не будет завершена."
line_question = "Запустить линию {kind} ({name}, продукт {product}) для окружения {env} в аккаунте ERPC за €{price} в час, по цене почасового прайс-листа? Она оплачивается почасово, пока не будет завершена."
