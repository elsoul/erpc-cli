intro = "Хранилище ключей erpc сохранит это в зашифрованном файле на этой машине, в {path}; открывается оно парольной фразой, которую вы сейчас выберете.\nСделайте резервную копию этого каталога и запомните парольную фразу: erpc не восстановит ни то, ни другое, а без обоих содержимое хранилища потеряно (для торгового ключа это сам кошелёк).\nАльтернатива — 1Password, он работает и с другой машины: `erpc login --store 1password-desktop`. Сервисный аккаунт 1Password подходит для секретных настроек, но не для торгового ключа."
intro_by_default = "Здесь `erpc login` не хранит сессию в 1Password, а на этой машине нет связки ключей, переживающей перезагрузку (нет Secret Service: сервер без графической среды, WSL или вход по SSH). Поэтому это попадёт в хранилище ключей erpc: зашифрованный файл на этой машине, в {path}; открывается оно парольной фразой, которую вы сейчас выберете.\nСделайте резервную копию этого каталога и запомните парольную фразу: erpc не восстановит ни то, ни другое, а без обоих содержимое хранилища потеряно (для торгового ключа это сам кошелёк).\nАльтернатива — 1Password, он работает и с другой машины: `erpc login --store 1password-desktop`. Сервисный аккаунт 1Password подходит для секретных настроек, но не для торгового ключа."
