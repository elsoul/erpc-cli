line_maintenance_hint = "`erpc worker status{scope}` покажет её; обслуживание (maintenance) — это либо обслуживание со стороны ERPC, либо завершение линии, и по состоянию их не различить: разверните снова, когда она станет active, а если так и останется, обратитесь в поддержку ERPC, указав id линии"
line_suspended_hint = "`erpc worker status{scope}` покажет её; приостановленная линия остановлена, чаще всего из-за кредитов ERPC или оплаты, и может возобновиться, когда положенное будет оплачено: при почасовой оплате — когда кредитов хватит на час всех почасовых списаний аккаунта; при оплате кредитами за период — когда их хватит на её следующий период; при оплате картой — когда неоплаченный счёт будет оплачен. Линию, оставленную приостановленной, могут завершить, так что не откладывайте с пополнением или оплатой в панели управления ERPC; разверните снова, когда она станет active, или обратитесь в поддержку ERPC, указав id линии"
line_available_hint = "`erpc worker status{scope}` покажет её; у линии ещё не зарегистрирован адрес: зарегистрируйте адрес этого сервера на странице продукта в панели управления ERPC или обратитесь в поддержку ERPC, указав id линии, затем разверните снова"
line_other_hint = "`erpc worker status{scope}` покажет её; разверните снова, когда она станет active, а если так и останется, обратитесь в поддержку ERPC, указав id линии"
not_yet_hint = "`erpc worker status{scope}` покажет, что есть в аккаунте, а `deploy` без этих параметров развёртывает на сервере, указанном в аккаунте; erpc пока не меняет там серверы и линии: обратитесь в поддержку ERPC"
line_suspended_now_hint = "`erpc worker status{scope}` покажет её; приостановленная линия gRPC или Shreds остановлена, чаще всего из-за кредитов ERPC или оплаты. С почасовой оплатой или купленная в почасовом Bundle-тарифе она обычно сразу завершается аккаунтом, и завершённая не вернётся, но ещё приостановленная может вернуться, когда кредитов хватит на час всех почасовых списаний аккаунта; при оплате кредитами за период — когда кредитов хватит на её следующий период; при оплате картой — когда неоплаченный счёт будет оплачен, а после повторных неудачных платежей её могут завершить. Поэтому пополните баланс или оплатите в панели управления ERPC сейчас, разверните снова, когда она станет active, а если не вернётся, обратитесь в поддержку ERPC, указав id линии"
