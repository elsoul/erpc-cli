server_suspended_hint = "`erpc worker status{scope}` покажет его; приостановленный сервер остановлен, чаще всего из-за кредитов ERPC или оплаты, и может возобновиться, когда положенное будет оплачено: при почасовой оплате — когда кредитов хватит на час всех почасовых списаний аккаунта; при оплате кредитами за период — когда их хватит на его следующий период; при оплате картой — когда неоплаченный счёт будет оплачен. Сервер, оставленный приостановленным, могут завершить, так что не откладывайте с пополнением или оплатой в панели управления ERPC; если так и останется, обратитесь в поддержку ERPC, указав id сервера"
