invalid = "(в erpc.toml есть проблемы; `erpc worker check{dir_scope}`)"
invalid_drawn = "{name}: в erpc.toml есть проблемы"
in_vault = "{name}  ·  окружение {env} в 1Password, приложения на этой машине нет (клонируйте приложение, чтобы продолжить с ним работу)"
