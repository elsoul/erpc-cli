# `erpc validator`, `erpc rpc` and `erpc node` before a chain is chosen,
# and the line after a chain's own help.

[about]
validator = "Валидаторы на блокчейнах ниже. У каждого блокчейна свои команды: выберите его через --chain."
rpc = "Запросы JSON-RPC и RPC-узлы на блокчейнах ниже. У каждого блокчейна свои команды: выберите его через --chain."
node = "Узлы на блокчейнах ниже, под их именами для совместимости. У каждого блокчейна свои команды: выберите его через --chain."

[heading]
without_chain = "Без выбора блокчейна"
chains = "Блокчейны и их сети"
no_validator = "Без валидатора"
commands = "Команды, которые есть у каждого блокчейна"
examples = "Примеры"

[no_validator]
mining = "добыча доказательством работы: валидатора для запуска нет"
rollup = "роллапы без собственного валидатора с доказательством доли"
rpc = "Их RPC-узлы: erpc rpc --chain <chain>"

[commands]
more = "Справка блокчейна говорит, что каждая команда делает в нём, и перечисляет добавленные им команды:"

[verb]
init = "Записать узел в инвентарь 1Password и подготовить сервер"
deploy = "Установить базовую систему и клиент и запустить в безопасном режиме"
list = "Показать хосты из инвентаря"
status = "Показать состояние хоста"
logs = "Показать журналы хоста"
start = "Запустить службу"
stop = "Остановить службу"
restart = "Перезапустить службу"
update = "Обновить клиент с защищённым перезапуском"
update_config = "Заново создать скрипт запуска и конфигурацию"
plan = "Показать, что сделает изменение, не выполняя его"
destroy = "Остановить службу и вывести узел из работы (ключи не затрагиваются)"

[rpc]
call = "Отправить один запрос JSON-RPC на общий, собственный или x402-эндпоинт"
list_networks = "Показать сети с общим RPC ERPC и x402 RPC"

[option]
chain = "Блокчейн, один из перечисленных выше (иначе ERPC_CHAIN, иначе настройка default_chain)"
network = "Сеть, одна из сетей блокчейна; для изменений в mainnet нужен и --chain в командной строке"
name = "Хост, по его имени в инвентаре"

[example]
help = "Что есть у {chain}: каждая команда и что она там делает"
list = "Хосты {chain} в инвентаре"
default = "После этого для erpc {role} <COMMAND> не нужен --chain, но для изменений в mainnet он по-прежнему нужен"
call = "Один запрос к общему RPC ERPC; сеть определяется по методу"

[verb_help]
depends = "Что принимает {verb}, зависит от блокчейна: erpc {role} --chain <chain> {verb} --help"
only = "{verb} есть только у {chains}: erpc {role} --chain {chain} {verb} --help"
none = "у erpc {role} нет команды `{word}` ни для одного блокчейна"

[chain_word]
refused = "`{word}` — это блокчейн, а не команда: erpc {role} принимает блокчейн через --chain"
hint = "запустите так: {command}"
takes_none = "`{word}` — это блокчейн, а erpc rpc {verb} блокчейн не принимает"

[chain]
next = "Параметры команды и что она делает в {chain}: erpc {role} --chain {chain} <COMMAND> --help"
