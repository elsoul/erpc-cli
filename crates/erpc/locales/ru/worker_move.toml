needs_yes_hint = "запустите `erpc worker move --to account{scope}` в терминале или добавьте --yes"
question = "Перенести окружение {env} в аккаунт ERPC ({taken})?"
declined = "не перенесено, ничего не изменено"
loses_oneway = "Перенос нельзя отменить: в erpc.toml останется только account = true, а аккаунт не возвращает ID продуктов."
loses_access = "После переноса каждая команда для него требует входа в ERPC и доступного аккаунта; эта машина доверяет его серверу таким, каким его перенесли, а другая машина, вошедшая в тот же аккаунт ERPC, доверяет ему один раз, ответив yes в терминале (--yes и --json этого не дают), другой же аккаунт ERPC его не видит; когда то, что аккаунт говорит о сервере, меняется, это снова спрашивается в терминале (например, когда deploy с другой машины добавляет её адрес в список SSH); к ERPC Worker, который аккаунт не показывает активным, не подключаются — даже чтобы остановить приложение."
loses_commands = "rollback, backup, api, trades и bench с ним пока не работают; firewall работает — со списками аккаунта (в каждом не больше 16 адресов, в списке SSH считается и адрес самого erpc); status больше не показывает почасовую стоимость и на сколько хватит кредитов."
loses_deploy = "deploy больше не принимает --host, --user, --port, --fingerprint, --server, --udp, --udp-port, --udp-region, --udp-any-source, --forget-line, --vault и --inline; --grpc, --shreds или --unlimited принимает только до первого развёртывания там, запуская линию в аккаунте (с вопросом о цене), а --new-server, --region и --plan принимает, только пока в записи аккаунта нет для него сервера, адреса, линии или развёртывания, и тогда запускает сервер, как первое развёртывание: сервер нельзя выбрать, линию нельзя убрать из записей, а после развёртывания и добавить, а deploy не может вернуть окружение в erpc.toml или 1Password; deploy отклоняется, пока в записи аккаунта есть незавершённая линия не в состоянии active."
loses_delete = "delete --release-server не подключается к серверу и не удаляет воркер: он просит аккаунт завершить всё, на чём работает окружение, а аккаунт ничего не завершает, пока на нём, кроме линии, купленной как часть Bundle (её аккаунт снимает с окружения, не завершая, в любом состоянии), есть что-то оплачиваемое не почасово, что-то, что нельзя завершить в его нынешнем состоянии, или запуск без известного исхода; почасовые сервер и линии тогда остаются оплачиваемыми и завершаются, только когда это разрешится и delete запустят снова. Для собственного сервера это спрашивается только в терминале, --yes недостаточно, и воркер на нём продолжает работать. Простой delete, delete --forget и delete --forget-line отклоняются."
loses_bundle = "Линия, купленная как часть Bundle, не принимается: аккаунт её отклоняет, и перенос на ней останавливается, а уже записанное в аккаунт остаётся там; пока её Bundle не записан в аккаунте, её могут принять, и тогда erpc сможет убрать её из записей, только удалив окружение, и это её не завершит, а завершить её отдельно от её Bundle не сможет."
loses_others = "Пока окружение этой машины хранится в аккаунте, delete --release-server --yes для других окружений этой машины, который завершил бы сервер, отклоняется, а для этого окружения — когда в аккаунте хранится и другое; без --yes это спрашивается в терминале."
loses_more = "Другие различия перечислены в docs/worker.md, в разделе «What changes once moved»."
env_differs_hint = "erpc.toml не изменён; как действовать дальше, может подсказать поддержка ERPC — сообщите ей это окружение"
not_ready = "у сервера окружения {env} в erpc.toml ещё нет адреса или ключа хоста; если перенести его сейчас, до него оттуда будет не добраться"
not_ready_hint = "сначала подготовьте сервер командой `erpc worker deploy{scope}`, затем переносите"

