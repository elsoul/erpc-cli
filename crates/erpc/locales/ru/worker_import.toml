# What `erpc worker import` says.

done = "Приложение {name} принято: его erpc.toml записан"
exists = "{path} уже есть: erpc worker умеет запускать это приложение"
exists_hint = "`erpc worker check{dir_scope}` покажет, что в нём описано"
in_the_way = "{path} уже существует и не является обычным файлом (ссылка, каталог или что-то иное): erpc создаёт erpc.toml заново и никогда не пишет через то, что находится по этому пути"
in_the_way_hint = "посмотрите, что это, удалите и запустите команду снова"
no_dir = "{dir} — не каталог, который erpc может прочитать: {error}"
no_cargo = "в {dir} нет Cargo.toml: erpc собирает приложение через cargo или разворачивает бинарник, собранный иначе"
no_cargo_hint = "соберите Linux-бинарник приложения своим способом и укажите его: `erpc worker import --binary <PATH>`"
no_binary = "--binary указывает на {path}, но {full} не является файлом внутри приложения"
no_binary_hint = "укажите путь от каталога приложения, например dist/my-app"
no_name = "из `{from}` не получается имя приложения"
no_name_hint = "задайте его через --name: от 1 до 32 строчных букв, цифр и одиночных дефисов, первая — буква"
bad_health = "--health принимает путь, начинающийся с /, например /healthz, и требует порт (--port); получено `{path}`"
invalid = "из прочитанного не получается erpc.toml, который принимает erpc ({error}); ничего не записано"
not_written = "не удалось записать {path}: {error}"
secrets = "это похоже на секреты, судя по имени или по учётным данным в значении из файла-примера, поэтому значения не скопированы; в erpc.toml они перечислены в комментариях; сохраните каждое там, откуда его читает erpc worker: {names}"
unclosed = "в {file} кавычка, открывающая значение {name}, не закрыта: значение {name} не прочитано, как и всё, что идёт после него в этом файле"
unclosed_line = "в {file} не закрыта кавычка в строке, которая не задаёт настройку: всё, что идёт после неё в этом файле, не прочитано"
unset = "названы только там, откуда erpc не читает значения (.env или файл-пример, который является тем же файлом под другим именем); в erpc.toml они добавлены комментариями — задайте их или сохраните: {names}"
unset_example = "названы в {files} без значения, которое erpc мог бы скопировать (пусто, несколько строк или длиннее 4096 байт); в erpc.toml они добавлены комментариями — задайте их или сохраните: {names}"
names_only = "{file} — тот же файл под другим именем (жёсткая ссылка, или на него ссылается другой dotenv-файл приложения): прочитан как .env, только имена"
bad_port = "в {file} значение {name} не является портом от 1 до 65535: оно не использовано как порт приложения"
bad_port_flag = "--port принимает порт от 1 до 65535"
key_files = "это похоже на ключ в файле: {files}; `erpc worker key import <FILE> --wipe{dir_scope}` сохранит его там, откуда его читает erpc worker, и затрёт файл"
key_files_odd = "это похоже на файлы с ключом, но в их именах есть символы, которые erpc не выводит (показаны как ?), поэтому в шагах ниже их нет: {files}; переименуйте каждый, затем `erpc worker key import <FILE> --wipe{dir_scope}` примет его"
lines = "задаётся линией данных ERPC, поэтому здесь не установлено: {names}"
served = "задаётся на сервере службой из [services], поэтому здесь не задано: {names}"
docker = "Dockerfile и compose-файл не используются: erpc worker запускает сам бинарник в защищённом systemd-юните"
prebuilt_note = "готовый бинарник разворачивается как есть: пересоберите его перед деплоем, который должен включать изменение"
state = "на сервере собственный каталог приложения доступен только для чтения: пишите файлы в каталог из ERPC_WORKER_STATE_DIR, он сохраняется между деплоями"

[skipped]
one = "в {file} {n} строка не задаёт настройку: то, что стоит перед `=`, не может быть именем настройки (заглавные буквы, цифры и `_`, не с цифры, и не имя, которое задаёт сам erpc или сервер). Она пропущена, и приложение, которое её читает, будет развёрнуто без неё"
few = "в {file} {n} строки не задают настройку: то, что стоит перед `=`, не может быть именем настройки (заглавные буквы, цифры и `_`, не с цифры, и не имя, которое задаёт сам erpc или сервер). Они пропущены, и приложение, которое читает одну из них, будет развёрнуто без неё"
many = "в {file} {n} строк не задают настройку: то, что стоит перед `=`, не может быть именем настройки (заглавные буквы, цифры и `_`, не с цифры, и не имя, которое задаёт сам erpc или сервер). Они пропущены, и приложение, которое читает одну из них, будет развёрнуто без неё"

[unread]
