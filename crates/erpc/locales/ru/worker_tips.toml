tip = "Совет: {tip}"

[tips]
t01 = "Слот теперь длится 200 мс. Код, считающий время как число слотов × 400 мс, неверен: используйте getBlockTime или текущую длительность слота."
t02 = "Blockhash по-прежнему истекает через 150 блоков, но при слотах 200 мс это уже около 30 секунд, а не 60."
t03 = "Обрабатывайте ping/pong в Geyser gRPC и после переподключения продолжайте с from_slot. Иначе возможны обрывы через ~30 с и пропуски данных."
t04 = "Примерный ping по расстоянию: одна сеть ~0,1 мс, один город ~1 мс, соседняя страна 5–10 мс, другой континент 100–300 мс."
t05 = "TCP-потоки вроде gRPC дают задержку около 5× ping, одиночный POST — 2–3×. Ставьте бота ближе к источнику потока, а не к точке отправки."
t06 = "Лидеры меняются по всему миру. Принимайте и отправляйте рядом с лидером, держа небольшие точки присутствия в нескольких регионах."
t07 = "getLeaderSlots от ERPC возвращает ближайших лидеров, их примерное местоположение и опорный RTT из 7 регионов — для выбора маршрута отправки."
t08 = "icmpReplied=false в getLeaderSlots значит «не измеряется по ICMP», а не «далеко». TPU/QUIC валидатора может работать нормально."
t09 = "Один город — ещё не близко по сети: трафик может идти через внешние сети. Измеряйте RTT до реального источника данных."
t10 = "Если замер региона gRPC показывает 9999 мс, проверьте, разрешён ли входящий ICMP с адресов из официального quickstart."
t11 = "Общие узлы ставят в очередь задачи многих пользователей — отсюда джиттер. Начните с общих и добавьте выделенные там, где скорость критична."
t12 = "Общий Geyser gRPC (Standard) и Direct Shreds Connect работают по HTTP (без TLS) или HTTPS (скрывает, какие адреса вы отслеживаете)."
t13 = "Данные появляются сначала в Shreds, затем в Geyser gRPC, потом в RPC/WebSocket. UDP Shreds быстрее всех, но нужно учитывать потери и перестановки."
t14 = "Частый подход: Shreds — чтобы раньше заметить возможность, Geyser gRPC — чтобы проверить блоки и логи и вести основную логику."
t15 = "Фильтруйте на стороне провайдера, а не после приёма. Ненужные обновления всё равно тратят канал и CPU и могут задерживать нужные."
t16 = "В фильтрах транзакций Yellowstone account_include срабатывает на любой из адресов, а account_required требует всех."
t17 = "Общий gRPC ERPC отклоняет подписку blocks и пустые фильтры. Явно указывайте только нужные аккаунты или адреса."
t18 = "Инструкция swap в Shreds показывает лимит, заданный трейдером, а не исполнение. Фактический результат берите из метаданных исполнения Geyser gRPC или RPC."
t19 = "Смотрите не только на счётчики, но и на возраст старейшего необработанного обновления. При стойкой нехватке больший буфер лишь копит больше старых данных."
t20 = "Держите горячий путь коротким: отдавайте аналитические логи и некритичные записи в БД в ограниченную очередь, чтобы следующая цена не ждала."
t21 = "Переподключение не возвращает пропущенные обновления. Приостановите решения на этом состоянии, пока оно не восстановлено и не проверено."
t22 = "После обрыва gRPC сохраните первую ошибку и x-erpc-retry-at до переподключения. Не отправляйте отклонённый запрос повторно без изменений."
t23 = "Обновления уровня processed могут откатиться. Храните предварительное и finalized-состояние раздельно или используйте только finalized."
t24 = "Успешный sendTransaction значит лишь, что RPC принял транзакцию, а не что она исполнена. Проверяйте статус подписи отдельно."
t25 = "SWQoS действует до учёта priority fee. Если транзакция не попала в приоритетную полосу, одно повышение priority fee не поможет."
t26 = "Чтобы отправить одну транзакцию сразу через несколько быстрых RPC, используйте durable nonce — тогда исполнится только одна копия."
t27 = "Средняя загрузка CPU может скрывать перегруженное ядро: одно из 8 логических CPU на 100% даёт в среднем ~12,5%. Смотрите загрузку по ядрам."
t28 = "Рабочий gRPC не доказывает, что приём UDP работает. Уточните у хостинга лимиты PPS, всплески и правила защиты от DDoS для входящего UDP."
t29 = "Для Shreds UDP Forwarding укажите публичный IPv4 и порт, разрешите входящий UDP со всех IP из панели управления и убедитесь, что пакеты приходят."
t30 = "Для бэктестов добавьте history=true к URL edge.erpc.global, чтобы читать старые блоки и транзакции. Такие запросы могут идти несколько секунд."
