external_consent = "Разрешаете проверить настройки безопасности {server} в режиме чтения и обработать результаты для отчёта? ERPC получает структурированные категории проверки. Для расстановки приоритетов ERPC отправляет своему поставщику ИИ-модели предопределённые идентификаторы результатов, идентификатор профиля клиента у этого поставщика, связанный с аккаунтом ERPC, и устойчивый псевдонимизированный идентификатор пользователя, который сохраняется между запусками. К отправленным данным применяются стандартные условия хранения поставщика. Для учёта и аудита ERPC отдельно хранит данные об аккаунте, пользователе, времени и результате запуска не менее 90 дней."
quote_fallback = "Если ERPC не сможет отправить запрос основной модели, вы также разрешаете использовать резервную модель с лимитом {maximum} токенов ERPC AI. Тариф резервной модели — {base} плюс {input} за входной токен и {output} за выходной. Готовый отчёт оплачивается по тарифу одной модели."
