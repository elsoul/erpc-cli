external_consent = "Разрешаете проверить настройки безопасности {server} в режиме чтения и обработать результаты для отчёта? ERPC получает структурированные категории проверки. Для расстановки приоритетов ERPC отправляет в Claude предопределённые идентификаторы результатов, идентификатор профиля клиента Anthropic, связанный с аккаунтом ERPC, и устойчивый псевдонимизированный идентификатор пользователя, который сохраняется между запусками. К отправленным данным применяются стандартные условия хранения Anthropic. Для учёта и аудита ERPC отдельно хранит данные об аккаунте, пользователе, времени и результате запуска не менее 90 дней."
quote_fallback = "Если ERPC не сможет отправить запрос основной модели, вы также разрешаете использовать {model} с лимитом {maximum} токенов ERPC AI. Тариф резервной модели — {base} плюс {input} за входной токен и {output} за выходной. Готовый отчёт оплачивается по тарифу одной модели."
