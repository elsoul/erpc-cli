intro = "erpc 的密钥库会把它保存在本机的一个加密文件中，位于 {path} 下，用你现在设定的口令打开。\n请备份该目录并记住口令：erpc 无法恢复其中任何一个，缺少任意一个，密钥库中的内容就会丢失（对交易密钥而言，就是钱包本身）。\n另一种选择是 1Password，它也能在其他机器上使用：`erpc login --store 1password-desktop`。1Password 服务账户可用于机密设置，但不能用于交易密钥。"
intro_by_default = "在本机上，`erpc login` 没有把会话保存在 1Password 中，本机也没有重启后仍能保留内容的钥匙串（没有 Secret Service：无界面服务器、WSL 或 SSH 登录）。因此它将保存到 erpc 的密钥库：本机上的一个加密文件，位于 {path} 下，用你现在设定的口令打开。\n请备份该目录并记住口令：erpc 无法恢复其中任何一个，缺少任意一个，密钥库中的内容就会丢失（对交易密钥而言，就是钱包本身）。\n另一种选择是 1Password，它也能在其他机器上使用：`erpc login --store 1password-desktop`。1Password 服务账户可用于机密设置，但不能用于交易密钥。"
