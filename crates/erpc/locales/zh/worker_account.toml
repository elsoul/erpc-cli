server_suspended_hint = "`erpc worker status{scope}` 可查看；暂停的服务器已停止，多数是因为 ERPC 积分或付款，在应付款项满足后可能会恢复：按小时计费的，积分足以支付账户所有按小时计费项目一小时的费用时；按周期用积分支付的，足以支付其下一个周期的费用时；用银行卡支付的，支付未付账单时。一直暂停的服务器可能会被终止，请尽快在 ERPC 控制面板上充值或完成付款；如一直如此，请附上服务器的 id 联系 ERPC 支持"
server_not_active_hint = "`erpc worker status{scope}` 可查看；待其变为 active 后再次运行，如一直如此，请附上服务器的 id 联系 ERPC 支持"

