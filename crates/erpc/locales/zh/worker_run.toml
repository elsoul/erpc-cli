no_binary = "构建已完成，但 {bin} 不存在"
no_binary_hint = "请将 erpc.toml 中的 build.bin 设为二进制文件名，并使用 --release 构建"

[check]
ended = "应用自行退出：{status}"
timeout = "{secs} 秒内未进入健康状态"
