failed = "{name} 未通过检查：{why}"
interrupted = "已用 Ctrl-C 停止"

[line]
taking_up = "使用已允许 {ip} 接入的 {kind} 线路 {id}"
active = "{kind} 线路 {id} 已启用：{setting} = {endpoint}"
made_anyway = "user-api 仍然创建了该线路；本次运行结束时会将其结束"
maybe_started = "线路可能已经启动：可在控制面板中查看账户的线路。一旦生效，下次运行会接管允许此地址接入的线路，因此请等一分钟再运行；不需要的线路请在控制面板中终止"
not_hourly = "{kind} 线路 {id} 不按小时计费，保持原样"
kept = "已保留 {kind} 线路 {id}，继续按小时计费：`erpc worker run{dir_scope} --{flag} --ip {ip}` 可再次使用，也可在控制台结束"
ended = "{kind} 线路 {id} 已结束"
not_ended = "{kind} 线路 {id} 未结束（{message}），在结束之前会继续按小时计费：`erpc worker run{dir_scope} --{flag} --ip {ip}` 可再次使用，也可在控制台结束"
