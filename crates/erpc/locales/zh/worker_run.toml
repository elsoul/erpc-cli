missing = "缺少 {settings}，{name} 无法启动"
missing_hint = "用 `erpc worker secret put {first}{how}{dir_scope}` 保存机密设置；普通设置写在 [vars] 中"
missing_line_hint = "{first} 由线路提供：`erpc worker run{dir_scope} --{flag} --ip <IPV4>` 启动一条允许本机接入的按小时计费线路；或在 [vars] 中设置"
watch_only = "没有 [wallet]：应用以仅观察模式启动（`erpc worker key new{dir_scope}` 可生成密钥）"
positions_kept = "应用持有的东西留在钱包中，下次运行会接手（`erpc worker key send{dir_scope} --to <PUBKEY> --all` 可把 SOL 转出）"
could_not_start = "无法启动 {bin}：{error}"
no_stdin = "应用没有可接收密钥的标准输入"
key_not_handed = "无法传递密钥：{error}"
started = "{name} 已启动（pid {pid}）"
running = "运行中；按 Ctrl-C 停止"
healthy = "状态健康；按 Ctrl-C 停止"
stopped = "{name} 已停止"
ended = "{name} 已退出：{status}"

[build]
empty = "build.command 为空"
building = "正在构建：{command}"
could_not_run = "无法运行 {program}：{error}"
