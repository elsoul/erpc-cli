question = "要把环境 {env} 移到 ERPC 账户吗（{taken}）？"
declined = "未移动，未做任何更改"
loses_oneway = "移动后无法撤回：erpc.toml 只保留 account = true，账户不会交还产品 ID。"
loses_access = "移动后，对它的每个命令都需要你的 ERPC 登录以及能连接到账户；本机按移动时的内容信任其服务器，登录同一 ERPC 账户的其他机器则要在终端上回答一次 yes 来信任它（--yes 和 --json 无法代替），其他 ERPC 账户则看不到它；账户所说的服务器信息一旦变化，就会在终端上再次询问（例如另一台机器的 deploy 把该机器的地址加入 SSH 列表时）；账户未显示为 active 的 ERPC 服务器不会被连接，连停止应用也不行。"
loses_commands = "rollback、backup、api、trades 和 bench 暂时还不能用于它；firewall 可以，作用于账户中的列表（每个列表最多 16 个地址，SSH 列表中 erpc 自身的地址也计入）；status 不再显示每小时的费用以及积分还能用多久。"
loses_deploy = "deploy 不再接受 --host、--user、--port、--fingerprint、--server、--plan、--grpc、--shreds、--unlimited、--udp、--udp-port、--udp-region、--udp-any-source、--forget-line、--vault 或 --inline，只有在账户记录中没有它的服务器、地址、线路或部署时才接受 --new-server 和 --region，并像首次部署一样开通服务器：无法选择其服务器，无法添加线路或将线路从记录中移除，deploy 也无法再把它改回由 erpc.toml 或 1Password 保管；账户记录中有尚未终止且不处于 active 的线路时，deploy 会被拒绝。"
loses_delete = "delete --release-server 不会连接服务器，也不会删除 worker：它请账户终止该环境使用的一切，而只要其中除作为 Bundle 一部分购买的线路（无论其状态如何，账户都会将其从环境中移除而不终止）以外，有任何非按小时计费的内容、在当前状态下无法终止的内容，或有结果未知的开通，账户就什么都不终止；此时按小时计费的服务器和线路会继续计费，要等那项内容处理完毕后再次运行 delete，才会被终止。如果是你自己的服务器，只会在终端上询问，仅有 --yes 不会继续，其上的 worker 会继续运行。单独的 delete、delete --forget 和 delete --forget-line 会被拒绝。"
loses_bundle = "作为 Bundle 一部分购买的线路不会被纳入：账户会拒绝它，移动在此停止，已写入账户的内容会留在账户中；在其 Bundle 记入账户之前，它可能会被纳入，此时 erpc 只有在删除该环境时才能将其从记录中移除，且这不会终止它；erpc 也无法脱离其 Bundle 单独终止它。"
loses_others = "只要本机有环境保管在账户中，本机其他环境中会终止服务器的 delete --release-server --yes 就会被拒绝；一旦另有环境保管在账户中，此环境的也一样；不加 --yes 时，会在终端上询问。"
loses_more = "更多差异列在 docs/worker.md 的“What changes once moved”中。"
env_differs_hint = "erpc.toml 保持原样；如何继续，请附上该环境联系 ERPC 支持"
not_ready = "环境 {env} 的服务器在 erpc.toml 中还没有地址或主机密钥；现在移动的话，将无法从那里连接到它"
not_ready_hint = "请先用 `erpc worker deploy{scope}` 准备好服务器，然后再移动"

