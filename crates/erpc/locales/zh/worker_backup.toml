never = "服务器启动以来尚未运行过"
unknown = "结果未知"
succeeded = "成功"
partly = "成功，但跳过了部分无法读取的文件"
failed = "失败（{result}，退出码 {exit}）"
on = "开启，下次运行 {next}\n  上次运行 {outcome}{at}"
