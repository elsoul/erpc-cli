line_maintenance_hint = "`erpc worker status{scope}` 可查看；维护中（maintenance）可能是 ERPC 自身的维护，也可能是线路正在被终止，状态无法区分：待其变为 active 后再次部署，如一直如此，请附上线路的 id 联系 ERPC 支持"
line_suspended_hint = "`erpc worker status{scope}` 可查看；暂停的线路已停止，多数是因为 ERPC 积分或付款，在应付款项满足后可能会恢复：按小时计费的，积分足以支付账户所有按小时计费项目一小时的费用时；按周期用积分支付的，足以支付其下一个周期的费用时；用银行卡支付的，支付未付账单时。一直暂停的线路可能会被终止，请尽快在 ERPC 控制面板上充值或完成付款；待其变为 active 后再次部署，或附上线路的 id 联系 ERPC 支持"
line_available_hint = "`erpc worker status{scope}` 可查看；该线路尚未登记地址：请在 ERPC 控制面板的产品页面登记这台服务器的地址，或附上线路的 id 联系 ERPC 支持，然后再次部署"
line_other_hint = "`erpc worker status{scope}` 可查看；待其变为 active 后再次部署，如一直如此，请附上线路的 id 联系 ERPC 支持"
not_yet_hint = "`erpc worker status{scope}` 可查看账户中的内容，不带这些选项的 `deploy` 会部署到账户指定的服务器；erpc 暂时还不能更改那里的服务器或线路：请联系 ERPC 支持"
line_suspended_now_hint = "`erpc worker status{scope}` 可查看；暂停的 gRPC 或 Shreds 线路已停止，多数是因为 ERPC 积分或付款。按小时计费的，或通过按小时计费的 Bundle 方案购买的，通常会被账户立即终止，已终止的无法恢复，但仍处于暂停状态的，在积分足以支付账户所有按小时计费项目一小时的费用后可能会恢复；按周期用积分支付的，积分足以支付其下一个周期的费用后可能会恢复；用银行卡支付的，支付未付账单后可能会恢复，连续付款失败可能导致其被终止。因此请立即在 ERPC 控制面板上充值或完成付款，待其变为 active 后再次部署，如未恢复，请附上线路的 id 联系 ERPC 支持"
unread_not_written = "ERPC 账户中可连接 SSH 的列表含有 erpc 无法读取的 {entries}；未将其覆盖"
nothing_deployed_yet = "未部署任何内容"
seen_not_updated = "无法写入本机上次应用到服务器的 ERPC 账户中可访问应用的列表的记录（{error}）；下一个 firewall 命令或部署会显示与此前记录的列表的差异（若无记录则显示整个列表）"
