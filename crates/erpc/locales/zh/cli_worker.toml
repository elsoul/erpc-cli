"worker firewall sync --dir" = "应用目录或其中的子目录；也可以用应用名称（默认：当前目录）"
"worker firewall sync --env" = "环境：erpc.toml 中的 `[env.<name>]` 表"
"worker firewall sync --yes" = "不询问，直接继续"
"worker backup" = "将应用状态从其服务器备份到 ERPC Global Storage"
"worker backup on" = "每天加密备份应用状态；服务器上只保存仅可追加的密钥"
"worker backup on <app_name>" = "应用名称，即 `erpc worker list` 中显示的名称（默认：当前目录所在的应用）"
"worker backup on --dir" = "应用目录或其中的子目录；也可以用应用名称（默认：当前目录）"
"worker backup on --env" = "环境：erpc.toml 中的 `[env.<name>]` 表"
"worker backup on --at" = "每天的时间，`HH:MM`，24 小时制，按服务器时间"
"worker backup on --yes" = "不询问，直接继续"
"worker backup off" = "停止备份，并删除服务器上的备份密钥。快照会保留"
"worker backup off <app_name>" = "应用名称，即 `erpc worker list` 中显示的名称（默认：当前目录所在的应用）"
"worker backup off --dir" = "应用目录或其中的子目录；也可以用应用名称（默认：当前目录）"
"worker backup off --env" = "环境：erpc.toml 中的 `[env.<name>]` 表"
"worker backup off --yes" = "不询问，直接继续"
"worker backup status" = "应用是否已开启备份、下次备份时间，以及上次备份的结果"
"worker backup status <app_name>" = "应用名称，即 `erpc worker list` 中显示的名称（默认：当前目录所在的应用）"
"worker backup status --dir" = "应用目录或其中的子目录；也可以用应用名称（默认：当前目录）"
"worker backup status --env" = "环境：erpc.toml 中的 `[env.<name>]` 表"
"worker backup now" = "立即备份应用，并等待完成"
"worker backup now <app_name>" = "应用名称，即 `erpc worker list` 中显示的名称（默认：当前目录所在的应用）"
"worker backup now --dir" = "应用目录或其中的子目录；也可以用应用名称（默认：当前目录）"
"worker backup now --env" = "环境：erpc.toml 中的 `[env.<name>]` 表"
"worker delete" = "从某个环境的服务器上删除应用"
"worker delete <app_name>" = "应用名称，即 `erpc worker list` 中显示的名称（默认：当前目录所在的应用）"
"worker delete --dir" = "应用目录或其中的子目录；也可以用应用名称（默认：当前目录）"
"worker delete --env" = "环境：erpc.toml 中的 `[env.<name>]` 表"
"worker delete --release-server" = "同时终止其所在的按小时计费 ERPC 服务器"
"worker delete --forget" = "不连接服务器：worker 已不在那里运行（例如服务器已不存在），直接删除记录"
"worker delete --forget-line" = "按 ID 将一条数据线路从记录中移除而不终止它：即已在 erpc 之外终止的线路。可重复指定"
"worker delete --yes" = "不询问，直接继续"
"worker list" = "列出本机上的应用及各自的部署位置"
"worker list --prune" = "先把 erpc.toml 已不存在的应用从列表中移除。不会改动其目录和服务器"
