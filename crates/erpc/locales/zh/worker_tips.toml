tip = "提示：{tip}"

[tips]
t01 = "Solana 的 slot 时间现已缩短为 200ms。按 slot 数 × 400ms 换算时间的代码已不再正确，请使用 getBlockTime 或获取当前的 slot 时间。"
t02 = "blockhash 仍在 150 个区块后过期，但在 200ms slot 下，实际时间已从约 60 秒缩短到约 30 秒。"
t03 = "Geyser gRPC 要处理 ping/pong，重连后用 from_slot 续传。否则可能出现约 30 秒断线或数据缺口。"
t04 = "按距离的大致 ping：同一网络约 0.1ms，同城约 1ms，邻国 5–10ms，跨洲 100–300ms。"
t05 = "gRPC 等 TCP 流式通信的延迟约为 ping 的 5 倍，单次 POST 约为 2–3 倍。因此机器人应尽量靠近数据流来源，而不是发送目标。"
t06 = "Leader 在全球轮换。要在靠近 leader 的地方接收和发送，就在多个区域各保留小规模据点。"
t07 = "ERPC 的 getLeaderSlots 会返回即将出块的 leader、其估计位置以及来自 7 个区域的参考 RTT，可用于选择发送路径。"
t08 = "getLeaderSlots 中 icmpReplied=false 表示“无法通过 ICMP 测量”，而不是“距离远”。该验证者的 TPU/QUIC 仍可能正常。"
t09 = "同城不等于网络上近：流量可能绕经外部网络。请测量到实际数据源的 RTT。"
t10 = "如果 gRPC 区域探测显示 9999ms，请检查是否允许来自官方快速入门所列探测源的入站 ICMP。"
t11 = "共享节点要排队处理多个用户的任务，表现为抖动。可先用共享节点，在速度绝不能下降的地方再加专用节点。"
t12 = "共享 Geyser gRPC（Standard）和 Direct Shreds Connect 可选 HTTP（无 TLS 开销）或 HTTPS（隐藏你订阅的地址）。"
t13 = "数据最先出现在 Shreds，其次是 Geyser gRPC，最后是 RPC/WebSocket。UDP Shreds 最快，但必须处理丢包和乱序。"
t14 = "常见做法：用 Shreds 尽早发现机会，用 Geyser gRPC 核对区块和日志并驱动主逻辑。"
t15 = "在服务端过滤，而不是收到后再过滤。被丢弃的更新同样占用带宽和 CPU，还可能拖慢你需要的更新。"
t16 = "在 Yellowstone 交易过滤器中，account_include 匹配任一所列地址，account_required 则要求全部包含。"
t17 = "ERPC 共享 gRPC 会拒绝 blocks 订阅和空过滤器。请明确指定你真正需要的账户或地址。"
t18 = "在 Shreds 中看到的 swap 指令只是交易者设定的限额，不是成交结果。实际成交请用 Geyser gRPC 或 RPC 的执行元数据确认。"
t19 = "不要只看数量，还要监控最旧的未处理更新已等待多久。处理能力持续不足时，加大缓冲区只会囤积更多旧数据。"
t20 = "保持热路径简短：把分析日志和非关键的数据库写入交给有上限的队列，别让下一个价格更新等待。"
t21 = "重连并不会补回错过的更新。依赖该状态的决策应暂停，直到状态恢复并校验完毕。"
t22 = "gRPC 断开后，重连前先保存第一个错误及 x-erpc-retry-at。被拒绝的请求切勿原样重发。"
t23 = "processed 级别的更新可能被回滚。请把暂定状态与 finalized 状态分开保存，或只使用 finalized。"
t24 = "sendTransaction 成功只代表 RPC 已接收，不代表已执行。请另行检查签名状态。"
t25 = "SWQoS 在优先费评估之前生效。交易若进不了优先通道，仅提高 priority fee 并不能让它更快。"
t26 = "若要把同一笔交易同时发往多个高速 RPC，请使用 durable nonce，确保只有一份能被执行。"
t27 = "平均 CPU 使用率可能会掩盖满载的核心：8 个逻辑 CPU 中有一个跑满 100%，平均也只有约 12.5%。请查看每个核心的负载。"
t28 = "gRPC 正常不代表 UDP 接收正常。请向主机商确认入站 UDP 的 PPS 限制、突发处理和 DDoS 防护规则。"
t29 = "使用 Shreds UDP Forwarding 时，登记公网 IPv4 和端口，放行控制面板列出的所有源 IP 的入站 UDP，并确认数据包已到达。"
t30 = "做回测时，在 edge.erpc.global 的 URL 中加上 history=true 即可读取旧区块和交易。历史查询可能需要数秒。"
