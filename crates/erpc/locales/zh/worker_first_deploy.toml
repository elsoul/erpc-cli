question = "在你的 ERPC 账户中用一台新 {worker} 为环境 {env} 运行 {app}：区域 {region}，从 ERPC 积分中每小时 €{price}？在终止之前一直按小时计费，至少一个小时。确认后，erpc.toml 从此将环境 {env} 保存在 ERPC 账户中（`account = true`），本次部署会等待它就绪，在此处得到确认后登录一次，然后部署到它。若要在 erpc 中终止它：在终端运行 `erpc worker delete --release-server{scope}`，环境的记录也会一并删除；若它是应用在那里的最后一个环境，应用的记录也会删除。"
