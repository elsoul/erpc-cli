question = "将 {app} 设为你的 ERPC 账户中的 ERPC Worker，并为环境 {env} 开通一台新服务器：{cores} 核、{memory} GB、区域 {region}，从 ERPC 积分中每小时 €{price}？在终止之前一直按小时计费，至少一个小时。确认后，erpc.toml 从此将环境 {env} 保存在 ERPC 账户中（`account = true`），本次部署会等待服务器就绪，在此处得到确认后登录一次，然后部署到它。若要在 erpc 中终止它：在终端运行 `erpc worker delete --release-server{scope}`，环境的记录也会一并删除；若它是应用在那里的最后一个环境，应用的记录也会删除。"
note = "正在将 {app} 设为你的 ERPC 账户中的 ERPC Worker，并为环境 {env} 开通一台新服务器：{cores} 核、{memory} GB、区域 {region}，从 ERPC 积分中每小时 €{price}。在终止之前一直按小时计费，至少一个小时。erpc.toml 从此将环境 {env} 保存在 ERPC 账户中（`account = true`），本次部署会等待服务器就绪，在此终端得到确认后登录一次，然后部署到它。若要在 erpc 中终止它：在终端运行 `erpc worker delete --release-server{scope}`，环境的记录也会一并删除；若它是应用在那里的最后一个环境，应用的记录也会删除。"
new_option = "在你的 ERPC 账户中开通一台按小时计费的新服务器，应用由此成为那里的 ERPC Worker（最便宜的规格，靠近 {region}），先显示价格"
as_before = "环境 {env} 仍像以前一样保存在 erpc.toml 中，而不保存在 ERPC 账户中：{why}"
why_lines = "保存在 ERPC 账户中的环境还不接受由部署开通的数据线路"
why_plan = "--plan 指定的是产品，而 ERPC 账户中的服务器按规格开通"
why_wallet = "erpc.toml 指定了钱包，而此 erpc 还不会在 ERPC 账户中创建带钱包的应用的记录"
needs_terminal = "为环境 {env} 开通新服务器会使应用成为 ERPC 账户中的 ERPC Worker，而 erpc 只有在终端得到确认后才会登录该服务器一次（--yes 不够，--json 下不询问任何人）；未开通任何服务，也未写入任何内容"
needs_terminal_hint = "在终端运行 `erpc worker deploy --new-server{scope}`，不要加 --json；没有终端时，用 --server <id> 或 --host <address> 指定你已有的服务器，或用 --new-server --inline 像以前一样将环境保存在 erpc.toml 中，在那里 --yes 也会回答首次登录"
resume_needs_terminal = "环境 {env} 保存在 ERPC 账户中，但账户中还没有它的服务器：本次部署会在那里开通一台，而 erpc 只有在终端得到确认后才会登录它一次（--yes 不够，--json 下不询问任何人）；未开通任何服务"
resume_needs_terminal_hint = "在终端运行 `erpc worker deploy{scope}`，不要加 --json"
not_written = "无法让 erpc.toml 将环境 {env} 保存在 ERPC 账户中（`account = true`）：{error}；未开通任何服务"
file_changed = "其中的 [env.{env}] 现在有其他设置"
kept_now_hint = "erpc.toml 现在将环境 {env} 保存在 ERPC 账户中：`erpc worker deploy{scope}` 会从中断处继续，先读取 ERPC 账户，在有未结束的开通或记录中有服务器期间不会再开通"
started_hint = "环境 {env} 现在保存在 ERPC 账户中，其服务器正在按小时计费：用 `erpc worker deploy{scope}` 继续"
holds_hint = "在 erpc.toml 的 [env.{env}] 下写上 `account = true` 后，`erpc worker deploy{scope}` 会部署到账户记录中的服务器"
differs_hint = "在 ERPC 账户只将保存的开通列为未结束、且环境的记录中没有服务器期间，不带 --region 或带 --region {region} 运行 `erpc worker deploy{scope}` 会再次发送它"
no_record = "你登录的 ERPC 账户中没有应用 {app} 的环境 {env} 的记录，而 erpc.toml 将它保存在 ERPC 账户中；未开通任何服务"
no_record_hint = "如果它是在另一个 ERPC 账户中创建的，请用那个账户 `erpc login`；`erpc worker deploy --new-server{scope}` 会在你登录的账户中为它开通一台新服务器，先询问价格"
