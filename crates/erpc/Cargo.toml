[package]
name = "erpc"
description = "ERPC command line: multi-chain node operations, account, AI assistant and credits for erpc.global"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["erpc", "solana", "ethereum", "validator", "cli"]
categories = ["command-line-utilities"]
readme = "../../README.md"
publish = true

[[bin]]
name = "erpc"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
erpc-auth = { workspace = true }
erpc-api = { workspace = true }
tokio = { workspace = true }
erpc-secret = { workspace = true }
erpc-wallet.workspace = true
# `string` for help headings in the language of the run (src/i18n.rs).
clap = { workspace = true, features = ["string"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# `password` for `erpc worker secret put`, which asks without echoing.
dialoguer = { workspace = true, features = ["password"] }
cliclack.workspace = true
reqwest.workspace = true
console = { version = "0.16", default-features = false }
secrecy.workspace = true
zeroize.workspace = true
tempfile.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures-util.workspace = true
unicode-width.workspace = true
erpc-ai.workspace = true
erpc-skills.workspace = true
erpc-chain.workspace = true
erpc-chain-solana.workspace = true
erpc-chain-arc.workspace = true
erpc-chain-eth.workspace = true
erpc-chain-nitro.workspace = true
erpc-chain-rollup.workspace = true
include_dir.workspace = true
sha2.workspace = true
aws-lc-rs.workspace = true
erpc-chain-avax.workspace = true
erpc-chain-sui.workspace = true
erpc-chain-tron.workspace = true
erpc-chain-bitcoin.workspace = true
erpc-chain-op.workspace = true
erpc-ops.workspace = true
erpc-ssh.workspace = true
erpc-core.workspace = true
erpc-worker = { workspace = true, features = ["templates"] }

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]

[lints]
workspace = true

# cargo-binstall: fetch prebuilt archives from GitHub Releases (cargo-dist layout).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
