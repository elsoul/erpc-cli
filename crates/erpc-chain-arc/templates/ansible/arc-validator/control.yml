---
- name: Stop only the original Arc scope through a newly sealed helper when installed bytes are absent
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Authenticate original authority and revoke queued work before owned shutdown
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_validator_loader }}", "{{ playbook_dir }}/../../validator/control.py"]
        stdin: "{{ arc_validator_request | to_json }}"
      changed_when: true
