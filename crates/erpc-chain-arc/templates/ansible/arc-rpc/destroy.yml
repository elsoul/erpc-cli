---
- name: Retire original Arc services while retaining data and custody
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse destructive history or ownership removal
      ansible.builtin.assert:
        that: not (arc_purge_data | default(false) | bool)
        quiet: true
    - name: Publish cancellation and attempt original shutdown even on persistence failure
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'destroy','contract':arc_authority_contract,'layer':'both'} | to_json }}"
      changed_when: true
