---
- name: Prepare the original Arc operation for fresh SSH confirmation
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Authenticate original scope and helper destinations before publication
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'firewall-prepare','contract':arc_authority_contract,'intent':arc_authority_intent,'helpers':arc_authority_helpers} | to_json }}"
      changed_when: true
    - name: Render this exact operation's candidate policy
      ansible.builtin.template:
        src: "{{ arc_jinja }}/erpc-arc.nft.j2"
        dest: "{{ playbook_dir }}/../../firewall-candidate.nft"
        owner: root
        group: root
        mode: '0600'
    - name: Validate the candidate syntax
      ansible.builtin.command: nft -c -f {{ playbook_dir }}/../../firewall-candidate.nft
      changed_when: false
    - name: Identify the submitted immutable bundle
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../bundle.tar.gz"
        checksum_algorithm: sha256
      register: submitted_firewall_bundle
    - name: Apply the reserved original operation with bounded rollback
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'firewall-apply','contract':arc_authority_contract,'intent':arc_authority_intent,'operation':(playbook_dir ~ '/../../..') | realpath | basename,'bundle':submitted_firewall_bundle.stat.checksum} | to_json }}"
      changed_when: true
    - name: Keep confirmed filtering available at boot
      ansible.builtin.systemd_service:
        name: erpc-arc-firewall.service
        enabled: true
        daemon_reload: true
