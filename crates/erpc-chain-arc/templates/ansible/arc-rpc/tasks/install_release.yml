#
# Puts the pinned release under /opt/arc/<tag>/, unless it is there: the
# archive is checked against the digest pinned at init before it is
# unpacked, and each binary must report the pinned tag and commit. The
# `current` link is not touched here.
---
- name: Read whether the release is unpacked already
  ansible.builtin.stat:
    path: "{{ arc_opt }}/{{ arc_version }}/arc-node-execution"
  register: arc_unpacked

- name: Download the pinned release, refused unless it has the pinned digest
  when: not arc_unpacked.stat.exists
  ansible.builtin.get_url:
    url: "{{ arc_archive_url }}"
    dest: "{{ arc_opt }}/{{ arc_archive_url | basename }}"
    checksum: "sha256:{{ arc_archive_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Make the release's directory
  ansible.builtin.file:
    path: "{{ arc_opt }}/{{ arc_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the release
  when: not arc_unpacked.stat.exists
  ansible.builtin.unarchive:
    src: "{{ arc_opt }}/{{ arc_archive_url | basename }}"
    dest: "{{ arc_opt }}/{{ arc_version }}"
    remote_src: true
    owner: root
    group: root

- name: Check each binary is the pinned release
  ansible.builtin.command: "{{ arc_opt }}/{{ arc_version }}/{{ item }} --version"
  loop:
    - arc-node-execution
    - arc-node-consensus
    - arc-snapshots
  register: arc_binary_versions
  changed_when: false
  failed_when: >-
    arc_binary_versions.rc != 0 or
    arc_version not in arc_binary_versions.stdout or
    arc_commit[:8] not in arc_binary_versions.stdout

- name: Remove the downloaded archive
  when: not arc_unpacked.stat.exists
  ansible.builtin.file:
    path: "{{ arc_opt }}/{{ arc_archive_url | basename }}"
    state: absent
