---
- name: Prepare original Arc follower authority on pre-mounted storage
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars.yml
  tasks:
    - name: Require the qualified Ubuntu and native platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version('24.04', '==')
          - ansible_facts.architecture in ['x86_64', 'aarch64']
          - ansible_facts.memtotal_mb >= 60000
        quiet: true

    - name: Qualify and durably prepare the original identity and data volume
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -c
          - "{{ arc_authority_loader }}"
          - "{{ playbook_dir }}/../../authority/control.py"
        stdin: "{{ arc_authority_request | to_json }}"
      register: arc_original
      changed_when: true

    - name: Install bounded prerequisites without starting package-owned listeners
      ansible.builtin.apt:
        name: [ca-certificates, curl, jq, nftables, tar, openssl]
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Observe an already active clock daemon
      ansible.builtin.command: systemctl is-active chrony.service systemd-timesyncd.service
      register: arc_clock
      failed_when: false
      changed_when: false

    - name: Install the supported clock daemon only when none is active
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
      when: "'active' not in arc_clock.stdout_lines"

    - name: Start the selected clock daemon
      ansible.builtin.systemd_service:
        name: systemd-timesyncd
        enabled: true
        state: started
      when: "'active' not in arc_clock.stdout_lines"

    - name: Set the bounded Arc kernel floors
      ansible.builtin.template:
        src: "{{ arc_jinja }}/90-erpc-arc.conf.j2"
        dest: /etc/sysctl.d/90-erpc-arc.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply Arc kernel settings

    - name: Ensure persistent bounded journal configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Bound persistent Arc journals
      ansible.builtin.template:
        src: "{{ arc_jinja }}/90-erpc-arc-journald.conf.j2"
        dest: /etc/systemd/journald.conf.d/90-erpc-arc.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald
  handlers:
    - name: Apply Arc kernel settings
      ansible.builtin.command: sysctl --system
      changed_when: true
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
