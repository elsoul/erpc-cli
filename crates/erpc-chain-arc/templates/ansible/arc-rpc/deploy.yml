---
- name: Deploy the reserved original Arc release without automatic database rollback
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Require the original intent and confirmed policy before installation
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'begin-install','contract':arc_authority_contract,'intent':arc_authority_intent,'firewall_operation':erpc_fw_confirmed_run,'firewall_bundle':erpc_fw_confirmed_bundle} | to_json }}"
      register: arc_install
      changed_when: true
    - name: Fetch the qualified immutable archive while original writers are stopped
      ansible.builtin.get_url:
        url: "{{ arc_archive_url }}"
        dest: "{{ (arc_install.stdout | from_json).archive }}"
        checksum: "sha256:{{ arc_archive_sha256 }}"
        owner: root
        group: root
        mode: '0600'
    - name: Qualify images and install original units or begin isolated bootstrap
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'install','contract':arc_authority_contract,'intent':arc_authority_intent} | to_json }}"
      register: arc_installed
      changed_when: true
    - name: Wait for the original bootstrap receipt, including a queued initial service job
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'status','contract':arc_authority_contract} | to_json }}"
      register: arc_bootstrap_status
      until: (arc_bootstrap_status.stdout | from_json).phase in ['bootstrap-complete', 'promoting', 'installed', 'stopped', 'retired']
      retries: 1080
      delay: 10
      changed_when: false
      when: (arc_installed.stdout | from_json).phase == 'bootstrap'
    - name: Activate only this uncancelled operation's completed original pair
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'activate','contract':arc_authority_contract,'intent':arc_authority_intent} | to_json }}"
      changed_when: true
    - name: Wait for native startup rather than accepting a skipped condition
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ arc_authority_loader }}", "{{ playbook_dir }}/../../authority/control.py"]
        stdin: "{{ {'schema':'erpc-arc-original-authority-v1','action':'status','contract':arc_authority_contract} | to_json }}"
      register: arc_native_status
      until: "'original_authority=yes' in ((arc_native_status.stdout | default('{}') | from_json).observation | default(''))"
      retries: 60
      delay: 5
      changed_when: false
