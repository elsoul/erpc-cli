---
- name: Verify the original separate AQA publisher recovery
  hosts: all
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute only the original publisher operation through the sealed controller
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, '{{ aqa_loader }}', '{{ playbook_dir }}/../../aqa/control.py', within-run]
        stdin: '{{ {"action":"recover-preparation","contract":aqa_request.contract} | to_json }}'
      changed_when: true
