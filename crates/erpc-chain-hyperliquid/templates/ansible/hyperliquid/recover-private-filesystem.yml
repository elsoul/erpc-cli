---
- name: Recover the original stopped validator private filesystem identity
  hosts: all
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Bind independent original UUID evidence while retaining all private native history
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, '{{ playbook_dir }}/../../node/control.py', play]
        stdin: '{{ hyperliquid_request | combine({"action":"recover-validator-filesystem"}) | to_json }}'
