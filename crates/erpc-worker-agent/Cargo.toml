[package]
name = "erpc-worker-agent"
description = "What runs an erpc worker app on a server: the process that holds its key in memory, and the HTTP proxy in front of it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true

[[bin]]
name = "erpc-worker-agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
erpc-worker.workspace = true
# `bench-rpc` times JSON-RPC calls from the server; rustls, like erpc.
reqwest = { workspace = true, features = ["blocking"] }
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["std", "fs", "process", "net", "mm"] }
signal-hook.workspace = true
# `waf`: the HTTP proxy in front of the app. hyper reads and writes HTTP on
# both sides of it, and httparse reads a request's head before hyper does.
http-body-util.workspace = true
httparse.workspace = true
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true

# Shipped to servers by erpc, not installed by the operator.
[package.metadata.dist]
dist = false
