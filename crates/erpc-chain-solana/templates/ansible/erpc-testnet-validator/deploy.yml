#
# erpc's testnet validator deploy: SLV's testnet-validator/init.yml at the
# version in ../../PROVENANCE.md, with SLV's Firedancer plays (Frankendancer)
# replaced by erpc's full Firedancer (../erpc-validator-firedancer) and the
# relative imports rewritten for this directory. It sits two levels under
# the template root, like SLV's own entry plays, because the plays find the
# Jinja templates at {{ playbook_dir }}/../../jinja.
---
# SLV's sync-only check knows agave, jito and allnodes-jito; Firedancer's
# own checks are in ../erpc-validator-firedancer/setup.yml.
- import_playbook: ../cmn/assert_validator_bootstrap.yml
  when: validator_type != 'firedancer'

- name: Load validator type from inventory
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Fail unless validator_type is a supported type
      ansible.builtin.assert:
        that:
          - validator_type | default('') in ['agave', 'jito', 'allnodes-jito', 'firedancer']
        fail_msg: "validator_type '{{ validator_type | default('undefined') }}' is not supported on {{ inventory_hostname }}. Set it in the inventory to one of agave, jito, allnodes-jito, firedancer. Nothing was changed."
        success_msg: "Validator type is {{ validator_type | default('undefined') }}"

# cmn/check_alpenglow_floor.yml stops, before anything is changed, a client that is older than the floor of
# testnet (4.4.0-beta.0): the agave_version, jito_version or allnodes_jito_version of the host, else the
# version_* pin of testnet_validators.
- import_playbook: ../cmn/check_alpenglow_floor.yml
  vars:
    versions_section: testnet_validators
  when: validator_type != 'firedancer'

# 共通処理
- import_playbook: ../cmn/fix_permissions.yml
- import_playbook: ../cmn/copy_restart_sh.yml
  vars:
    restarter_snapshot_network: testnet
  when: validator_type != 'firedancer'
- import_playbook: ../cmn/add_solv.yml
- import_playbook: ../cmn/install_package.yml
- import_playbook: ../cmn/setup_node_exporter.yml
- import_playbook: ../cmn/install_rust.yml
- import_playbook: ../cmn/disable_swap.yml
- import_playbook: ../cmn/mount_disks.yml
- import_playbook: ../cmn/optimize_system.yml
- import_playbook: ../cmn/setup_norestart.yml
- import_playbook: ../cmn/setup_logrotate.yml
- import_playbook: ../cmn/build_solana.yml
  vars:
    versions_section: testnet_validators
  when: validator_type != 'firedancer'

- import_playbook: ../cmn/setup_unstaked_identity.yml
  when: validator_type != 'firedancer'
- import_playbook: ../cmn/assert_unstaked_identity.yml
  when: validator_type != 'firedancer'

- import_playbook: ../erpc-validator-firedancer/setup.yml
  vars:
    versions_section: testnet_validators
    erpc_fd_cluster: testnet
  when: validator_type == 'firedancer'

- import_playbook: ../testnet-validator/setup_solv_service.yml
  when: validator_type in ['agave', 'jito', 'allnodes-jito']

- import_playbook: ../testnet-validator/deploy-start-validator-sh.yml
  when: validator_type in ['agave', 'jito', 'allnodes-jito']

# Testnet does NOT use ERPC mainnet snapshots.
# If a snapshot is needed, use snapshot_finder or provide snapshot_url manually.
# - import_playbook: ../cmn/wget_snapshot.yml

- import_playbook: ../testnet-validator/start_solv.yml
  when: validator_type in ['agave', 'jito', 'allnodes-jito']

- import_playbook: ../erpc-validator-firedancer/start.yml
  when: validator_type == 'firedancer'
