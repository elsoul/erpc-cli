---
- name: Require this deployment's confirmed firewall receipt before any mutation
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Reject superseded or revoked preparation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - /usr/local/lib/erpc/rpc-firewall.py
          - solana-rpc
          - require-confirmed
          - "{{ erpc_fw_confirmed_run }}"
          - "{{ erpc_fw_confirmed_bundle }}"
      changed_when: false
