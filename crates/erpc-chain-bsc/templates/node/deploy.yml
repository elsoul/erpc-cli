---
- name: Deploy the exact BSC release and initial snapshot behind confirmed ingress
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require this caller's exact confirmed firewall receipt first
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py", firewall-require, "{{ erpc_fw_confirmed_run }}", "{{ erpc_fw_confirmed_bundle }}"]
      changed_when: false
    - name: Persist the installation fence and stop all owned database writers
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py", play]
        stdin: "{{ bsc_request | combine({'action':'begin-install'}) | to_json }}"
      changed_when: true
    - name: Resolve the node account
      ansible.builtin.getent:
        database: passwd
        key: erpc-bsc
    - name: Authenticate artifacts and publish a complete initial database
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py", play]
        stdin: "{{ bsc_request | combine({'action':'install-artifacts','service_uid':getent_passwd['erpc-bsc'][1] | int,'service_gid':getent_passwd['erpc-bsc'][2] | int}) | to_json }}"
      changed_when: true
    - name: Install the guarded service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/erpc-bsc.service"
        dest: /etc/systemd/system/erpc-bsc.service
        owner: root
        group: root
        mode: '0644'
    - name: Install the non-signing registration observer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [erpc-bsc-activation.service, erpc-bsc-activation.timer]
      when: bsc_request.role == 'validator'
    - name: Commit the installed pin and confirmed receipt
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py", play]
        stdin: "{{ bsc_request | combine({'action':'finish-install','firewall':{'run':erpc_fw_confirmed_run,'bundle':erpc_fw_confirmed_bundle}}) | to_json }}"
      changed_when: true
    - name: Reload services
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Start through the owner, release and firewall guard
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ playbook_dir }}/control.py", play]
        stdin: "{{ bsc_request | combine({'action':'start'}) | to_json }}"
      changed_when: true
