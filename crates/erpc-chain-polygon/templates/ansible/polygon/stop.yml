---
- name: Stop the immutable owner using the current sealed controller
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Cancel startup and drain without adopting accounts or replacing helpers
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ polygon_scripts }}/control.py", within-run]
        stdin: "{{ polygon_request | combine({'action':'stop'}) | to_json }}"
