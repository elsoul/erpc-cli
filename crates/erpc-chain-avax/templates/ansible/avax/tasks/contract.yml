---
- name: Authenticate protected immutable scope before mutation
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
    stdin: "{{ {'action': ('check-initial' if avax_allow_new_contract | default(false) | bool else 'check'), 'contract': avax_contract_value} | to_json }}"
  changed_when: false
