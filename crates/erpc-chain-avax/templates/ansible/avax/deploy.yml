---
- name: Deploy the pinned AvalancheGo service without registering stake
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Check immutable remote ownership
      ansible.builtin.import_tasks: tasks/contract.yml
    - name: Require initial database free space or existing database operating headroom
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../jinja/capacity.py"
          - "{{ avax_type }}"
          - "{{ avax_network }}"
      changed_when: false
    - name: Read current release link
      ansible.builtin.stat:
        path: /opt/avalanchego/current
      register: avax_current
    - name: Prevent deploy from performing an implicit release change
      ansible.builtin.assert:
        that:
          - avax_phase == 'update' or not avax_current.stat.exists or avax_current.stat.lnk_target == avax_release_dir
        fail_msg: Use update for a release change; never roll back a migrated database automatically.
    - name: Verify and install the release
      ansible.builtin.include_tasks: tasks/install.yml
      when: avax_phase != 'config'
    - name: Require a binary for configuration-only changes
      ansible.builtin.stat:
        path: "{{ avax_release_dir }}/avalanchego"
      register: avax_installed
      failed_when: not avax_installed.stat.exists
    - name: Install identity guard and recovery helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../jinja/identity.py"
        dest: /usr/local/lib/erpc/avax-identity.py
        owner: root
        group: root
        mode: '0755'
    - name: Authorize initial identity generation only on an empty uninitialized host
      ansible.builtin.command: python3 /usr/local/lib/erpc/avax-identity.py authorize
      changed_when: false
      when: avax_new_identity | bool
    - name: Verify the already pinned identity before changing a running node
      ansible.builtin.command: python3 /usr/local/lib/erpc/avax-identity.py verify
      changed_when: false
      when: not (avax_new_identity | bool)
    - name: Write client and restricted gateway configuration
      ansible.builtin.template:
        src: "{{ avax_jinja }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - {src: node.json.j2, dest: /etc/avalanchego/node.json}
        - {src: c-chain.json.j2, dest: /etc/avalanchego/chains/C/config.json}
        - {src: proxy.conf.j2, dest: /etc/avalanchego/proxy.conf}
        - {src: avalanchego.service.j2, dest: /etc/systemd/system/avalanchego.service}
        - {src: avalanche-rpc.service.j2, dest: /etc/systemd/system/avalanche-rpc.service}
      register: avax_configuration
    - name: Switch release only after verified installation
      ansible.builtin.file:
        src: "{{ avax_release_dir }}"
        dest: /opt/avalanchego/current
        state: link
        force: true
      register: avax_link
    - name: Apply firewall before enabling any external gateway
      ansible.builtin.include_tasks: tasks/firewall.yml
    - name: Start or restart client only on configuration/release change
      ansible.builtin.systemd_service:
        name: avalanchego
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if avax_configuration.changed or avax_link.changed else 'started' }}"
    - name: Check local API liveness (bootstrap readiness is checked separately)
      ansible.builtin.uri:
        url: http://127.0.0.1:9650/ext/info
        method: POST
        body_format: json
        body: {jsonrpc: '2.0', id: 1, method: info.getNodeID, params: {}}
      register: avax_alive
      until: avax_alive.status == 200 and avax_alive.json.result.nodeID is defined
      retries: 30
      delay: 2
    - name: Start restricted RPC gateway
      ansible.builtin.systemd_service:
        name: avalanche-rpc
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if avax_configuration.changed else 'started' }}"
