---
- name: Deploy the pinned AvalancheGo service without registering stake
  hosts: all
  become: true
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Require this exact confirmed preparation and uncanceled caller intent before the long run
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'deploy-check','contract':avax_contract_value,'intent':avax_intent,'run':erpc_fw_confirmed_run,'bundle':erpc_fw_confirmed_bundle} | to_json }}"
      changed_when: false
    - name: Read original numeric recipients for the new service units
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'account','contract':avax_contract_value} | to_json }}"
      register: avax_original_account
      changed_when: false
    - name: Use only original numeric recipients
      ansible.builtin.set_fact:
        avax_runtime_account: "{{ avax_original_account.stdout | from_json }}"
    - name: Require initial database free space or existing database operating headroom
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - "{{ playbook_dir }}/../../jinja/capacity.py"
          - "{{ avax_type }}"
          - "{{ avax_network }}"
      changed_when: false
    - name: Read current release link
      ansible.builtin.stat:
        path: /opt/avalanchego/current
      register: avax_current
    - name: Prevent deploy from performing an implicit release change
      ansible.builtin.assert:
        that:
          - avax_phase == 'update' or not avax_current.stat.exists or avax_current.stat.lnk_target == avax_release_dir
        fail_msg: Use update for a release change; never roll back a migrated database automatically.
    - name: Verify and install the release
      ansible.builtin.include_tasks: tasks/install.yml
      when: avax_phase != 'config'
    - name: Require a binary for configuration-only changes
      ansible.builtin.stat:
        path: "{{ avax_release_dir }}/avalanchego"
      register: avax_installed
      failed_when: not avax_installed.stat.exists
    - name: Authorize only initial identity creation or verify original custody
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'authorize','contract':avax_contract_value} | to_json }}"
      changed_when: false
    - name: Write client and restricted gateway configuration
      ansible.builtin.template:
        src: "{{ avax_jinja }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - {src: node.json.j2, dest: /etc/avalanchego/node.json}
        - {src: c-chain.json.j2, dest: /etc/avalanchego/chains/C/config.json}
        - {src: proxy.conf.j2, dest: /etc/avalanchego/proxy.conf}
        - {src: avalanchego.service.j2, dest: /etc/systemd/system/avalanchego.service}
        - {src: avalanche-rpc.service.j2, dest: /etc/systemd/system/avalanche-rpc.service}
      register: avax_configuration
    - name: Switch release only after verified installation
      ansible.builtin.file:
        src: "{{ avax_release_dir }}"
        dest: /opt/avalanchego/current
        state: link
        force: true
      register: avax_link
    - name: Reload the qualified original recipient units
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Publish completed artifacts under the original caller intent
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'installed','contract':avax_contract_value,'intent':avax_intent} | to_json }}"
    - name: Start only the completed uncanceled confirmed deployment
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'activate','contract':avax_contract_value,'intent':avax_intent} | to_json }}"
