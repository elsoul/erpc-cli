---
- name: Remove Avalanche services while preserving all staking identity material
  hosts: all
  become: true
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Check immutable remote ownership
      ansible.builtin.import_tasks: tasks/contract.yml
      vars:
        avax_allow_new_contract: true
    - name: Persist cancellation and drain the retained original owner before any teardown
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'destroy','contract':avax_contract_value} | to_json }}"
    - name: Remove service units
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}.service
        state: absent
      loop: [avalanche-rpc, avalanchego]
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Require original data ownership and no nested mounts before explicit purge
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'purge-guard','contract':avax_contract_value} | to_json }}"
      changed_when: false
      when: avax_purge_data | bool
    - name: Purge only chain database and logs when explicitly requested
      ansible.builtin.file:
        path: /var/lib/avalanchego/{{ item }}
        state: absent
      loop: [db, logs]
      when: avax_purge_data | bool
    # Keep firewall and immutable contract: removing an input-drop table can
    # expose unrelated services. Identities and backups always remain.
