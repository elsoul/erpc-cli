---
- name: Remove Avalanche services while preserving all staking identity material
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Check immutable remote ownership
      ansible.builtin.import_tasks: tasks/contract.yml
    - name: Stop services when installed
      ansible.builtin.shell:
        cmd: |
          set -e
          for service in avalanche-rpc avalanchego; do
            if systemctl cat "$service" >/dev/null 2>&1; then systemctl disable --now "$service"; fi
          done
        executable: /bin/bash
      changed_when: true
    - name: Remove service units
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}.service
        state: absent
      loop: [avalanche-rpc, avalanchego]
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Purge only chain database and logs when explicitly requested
      ansible.builtin.file:
        path: /var/lib/avalanchego/{{ item }}
        state: absent
      loop: [db, logs]
      when: avax_purge_data | bool
    # Keep firewall and immutable contract: removing an input-drop table can
    # expose unrelated services. Identities and backups always remain.
