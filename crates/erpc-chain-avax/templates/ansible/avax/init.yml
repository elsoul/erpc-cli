---
- name: Prepare an Avalanche host without formatting any disks
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Check immutable remote ownership
      ansible.builtin.import_tasks: tasks/contract.yml
      vars:
        avax_allow_new_contract: true
    - name: Require the supported host baseline
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '>=')
          - ansible_architecture in ['x86_64', 'aarch64']
          - ansible_memtotal_mb >= 15000
          - ansible_processor_vcpus >= 8
        quiet: true
    - name: Install host dependencies
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, nftables, nginx-core, python3, openssl]
        state: present
        update_cache: true
    - name: Create an unprivileged node user
      ansible.builtin.user:
        name: avalanchego
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Create persistent and configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /var/lib/avalanchego, owner: avalanchego, mode: '0700'}
        - {path: /var/lib/avalanchego/staking, owner: avalanchego, mode: '0700'}
        - {path: /etc/avalanchego, owner: root, mode: '0755'}
        - {path: /etc/avalanchego/chains/C, owner: root, mode: '0755'}
        - {path: /opt/avalanchego, owner: root, mode: '0755'}
        - {path: /etc/erpc/avax, owner: root, mode: '0700'}
        - {path: /usr/local/lib/erpc, owner: root, mode: '0755'}
    - name: Refuse adoption of an unmanaged database or identity
      ansible.builtin.shell:
        cmd: |
          set -eu
          test ! -e /var/lib/avalanchego/db
          test -z "$(find /var/lib/avalanchego/staking -mindepth 1 -print -quit)"
        executable: /bin/bash
      changed_when: false
      when: not avax_contract.stat.exists
    - name: Persist the immutable contract
      ansible.builtin.copy:
        dest: /etc/avalanchego/contract.json
        content: "{{ {'network': avax_network, 'type': avax_type, 'validator': avax_validator} | to_json }}"
        owner: root
        group: root
        mode: '0644'
