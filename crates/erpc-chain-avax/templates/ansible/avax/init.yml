---
- name: Prepare an Avalanche host without formatting any disks
  hosts: all
  become: true
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin
  gather_facts: true
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Check immutable remote ownership
      ansible.builtin.import_tasks: tasks/contract.yml
      vars:
        avax_allow_new_contract: true
    - name: Require the supported host baseline
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '>=')
          - ansible_architecture in ['x86_64', 'aarch64']
          - ansible_memtotal_mb >= 15000
          - ansible_processor_vcpus >= 8
        quiet: true
    - name: Reserve original account or explicitly qualify the legacy account
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action': ('migrate' if avax_migrate_account else 'prepare'), 'contract': avax_contract_value, 'expected_hashes': avax_expected_identity} | to_json }}"
      register: avax_original_account
    - name: Use the verified original numeric account
      ansible.builtin.set_fact:
        avax_runtime_account: "{{ avax_original_account.stdout | from_json }}"
    - name: Refuse taking over an active or overridden distribution nginx service
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, "{{ avax_jinja }}/control.py"]
        stdin: "{{ {'action':'package-guard','contract':avax_contract_value} | to_json }}"
      changed_when: false
    - name: Prevent the distribution default listener now and on reboot
      ansible.builtin.systemd_service:
        name: nginx.service
        masked: true
    - name: Install host dependencies
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, nftables, nginx-core, python3, openssl]
        state: present
        update_cache: true
        policy_rc_d: 101
    - name: Create only protected public configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: [/etc/avalanchego/chains/C, /opt/avalanchego, /etc/erpc/avax]
    - name: Publish the authenticated carried helpers
      ansible.builtin.import_tasks: tasks/publication.yml
