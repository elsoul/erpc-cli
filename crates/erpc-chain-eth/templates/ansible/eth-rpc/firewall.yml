---
- name: Prepare the original Ethereum policy before deployment
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Authenticate original namespace and still-current deployment before writes
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, '{{ eth_authority_loader }}', '{{ playbook_dir }}/../../authority/control.py', request]
        stdin: '{{ eth_authority_request | combine({"action":"check-deploy","intent":eth_authority_intent,"target":eth_authority_source}) | to_json }}'
      changed_when: false
    - name: Prepare the original operation-bound firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
