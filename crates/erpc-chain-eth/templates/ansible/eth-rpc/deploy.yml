---
- import_playbook: firewall-guard.yml
- name: Install the exact original Ethereum request and resume only its native bootstrap
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  vars:
    eth_control: [/usr/bin/python3, -I, -c, '{{ eth_authority_loader }}', '{{ playbook_dir }}/../../authority/control.py', request]
  tasks:
    - name: Verify the original request and numeric account authority
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"check-deploy","intent":eth_authority_intent,"target":eth_authority_source}) | to_json }}'
      register: eth_original
      changed_when: false
    - name: Use only original numeric identities for public binary qualification
      ansible.builtin.set_fact:
        eth_original_accounts: '{{ (eth_original.stdout | from_json).accounts.users }}'
    - name: Verify both release archives and their native source identity
      ansible.builtin.include_tasks: tasks/install_release.yml
    - name: Publish only qualified immutable original release bytes
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"qualify","intent":eth_authority_intent}) | to_json }}'
      changed_when: true
    - name: Fence cutover and drain all retained original writers
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"begin","intent":eth_authority_intent}) | to_json }}'
      changed_when: true
    - name: Preserve or finish the original private engine JWT
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"engine-init","intent":eth_authority_intent}) | to_json }}'
      changed_when: true
      no_log: true
    - name: Publish numeric units and retained native process authority
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"install","intent":eth_authority_intent,"firewall":{"run":erpc_fw_confirmed_run,"bundle":erpc_fw_confirmed_bundle}}) | to_json }}'
      changed_when: true
    - name: Submit or observe the original resumable native bootstrap
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"bootstrap","intent":eth_authority_intent}) | to_json }}'
      register: eth_bootstrap
      until: (eth_bootstrap.stdout | from_json).snapshot == 'complete'
      retries: 4320
      delay: 10
      changed_when: (eth_bootstrap.stdout | from_json).snapshot == 'submitted'
    - name: Start only the still-authorized original target and verify real running services
      ansible.builtin.command:
        argv: '{{ eth_control }}'
        stdin: '{{ eth_authority_request | combine({"action":"activate","intent":eth_authority_intent}) | to_json }}'
      changed_when: true
