#
# erpc's Ethereum RPC node update: moves a running node to the pinned pair.
# The new pair is installed and checked beside the running one; then
# Lighthouse and Reth stop, `current` moves, and both start in order. If the
# node does not come up, `current` goes back to the pair it ran, both layers
# start again on it, and the run fails saying so.
---
- import_playbook: firewall-guard.yml

- name: Update an Ethereum RPC node
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - vars.yml
  tasks:
    - name: Read which pair is current
      ansible.builtin.stat:
        path: "{{ eth_opt }}/current"
      register: eth_current
      failed_when: not eth_current.stat.exists or not eth_current.stat.islnk

    - name: Remember the pair the node runs
      ansible.builtin.set_fact:
        eth_previous: "{{ eth_current.stat.lnk_target }}"

    - name: Read whether the pinned pair is installed
      ansible.builtin.stat:
        path: "{{ eth_release_dir }}/lighthouse"
      register: eth_installed_pair

    - name: Install the pinned pair beside it
      ansible.builtin.include_tasks: tasks/install_release.yml

    - name: Say there is nothing to do
      ansible.builtin.debug:
        msg: The node runs {{ eth_pair }} already.
      when: eth_previous == eth_release_dir

    - name: Move the node to the pinned pair
      when: eth_previous != eth_release_dir
      block:
        - name: Write the units for the new pair
          ansible.builtin.template:
            src: "{{ eth_jinja }}/{{ item }}.j2"
            dest: /etc/systemd/system/{{ item }}
            owner: root
            group: root
            mode: "0644"
          loop:
            - reth.service
            - lighthouse.service
            - reth-snapshot.service

        - name: Stop Lighthouse, then Reth
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - lighthouse
            - reth

        - name: Point current at the new pair
          ansible.builtin.file:
            src: "{{ eth_release_dir }}"
            dest: "{{ eth_opt }}/current"
            state: link
            force: true

        - name: Start on the new pair
          ansible.builtin.include_tasks: tasks/start.yml
          vars:
            eth_restart: false

      rescue:
        - name: Stop whatever started
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - lighthouse
            - reth
          failed_when: false

        - name: Point current back at the pair the node ran
          ansible.builtin.file:
            src: "{{ eth_previous }}"
            dest: "{{ eth_opt }}/current"
            state: link
            force: true

        - name: Start again on it
          ansible.builtin.include_tasks: tasks/start.yml
          vars:
            eth_restart: false

        - name: Fail, saying the update was rolled back
          ansible.builtin.fail:
            msg: >-
              {{ eth_pair }} did not come up; the node runs {{ eth_previous | basename }}
              again. Its logs are in `erpc r --chain eth logs`.
