---
- name: Retire the original Ethereum host while preserving its identity and data
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse deletion or inventory detachment through an original-authority retirement
      ansible.builtin.assert:
        that:
          - not (eth_purge_data | default(false) | bool)
    - name: Persist cancellation and attempt every original owned shutdown
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, '{{ eth_authority_loader }}', '{{ playbook_dir }}/../../authority/control.py', request]
        stdin: '{{ eth_authority_request | combine({"action":"destroy"}) | to_json }}'
      changed_when: true
