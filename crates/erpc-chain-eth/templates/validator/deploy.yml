---
- name: Prepare or deploy the original isolated Ethereum validator
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    eth_opt: /opt/erpc-eth-validator
    eth_release_dir: "{{ eth_opt }}/reth-{{ eth_reth_version }}--lighthouse-{{ eth_lighthouse_version }}"
    eth_gpg: "{{ playbook_dir }}/../gpg"
    eth_archives:
      - { client: reth, url: "{{ eth_reth_url }}", sha256: "{{ eth_reth_sha256 }}", fingerprint: "{{ eth_reth_fingerprint }}" }
      - { client: lighthouse, url: "{{ eth_lighthouse_url }}", sha256: "{{ eth_lighthouse_sha256 }}", fingerprint: "{{ eth_lighthouse_fingerprint }}" }
    ev_command: [/usr/bin/python3, -I, -c, '{{ ev_loader }}', '{{ playbook_dir }}/../authority/eth_validator_control.py', request]
  tasks:
    - name: Authenticate original scope and current intent before any host mutation
      ansible.builtin.command:
        argv: '{{ ev_command }}'
        stdin: '{{ ev_request | combine({"request":ev_request.request | combine({"action":("reserve" if ev_phase == "init" else "check-deploy")})}) | to_json }}'
      changed_when: ev_phase == 'init'

    - name: Install verified-native and encrypted-credential prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, jq, openssl, python3, tar, util-linux]
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Discover existing host time synchronization services
      ansible.builtin.service_facts:

    - name: Preserve an installed clock daemon before choosing a fallback
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, '{{ ev_loader }}', '{{ playbook_dir }}/time_service.py']
        stdin: '{{ ansible_facts.services | to_json }}'
      register: ev_clock
      changed_when: false

    - name: Install the fallback only when no other clock service was selected
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
        policy_rc_d: 101
      when: (ev_clock.stdout | from_json).install_fallback | bool

    - name: Keep the selected clock service synchronized
      ansible.builtin.systemd_service:
        name: '{{ (ev_clock.stdout | from_json).service }}'
        state: started
        enabled: true

    - name: Prepare only the reserved original numeric identities and descriptor-bound data
      ansible.builtin.command:
        argv: '{{ ev_command }}'
        stdin: '{{ ev_request | combine({"request":ev_request.request | combine({"action":"prepare"})}) | to_json }}'
      register: ev_prepared
      changed_when: true

    - name: Retain original numeric accounts for signed executable qualification
      ansible.builtin.set_fact:
        ev_accounts: '{{ (ev_prepared.stdout | from_json).accounts }}'

    - name: Deploy supporting clients while leaving consensus signing disabled
      when: ev_phase != 'init'
      block:
        - name: Recheck the same original deployment after host preparation
          ansible.builtin.command:
            argv: '{{ ev_command }}'
            stdin: '{{ ev_request | combine({"request":ev_request.request | combine({"action":"check-deploy"})}) | to_json }}'
          changed_when: false

        - name: Verify pinned signatures and extract both qualified native binaries
          ansible.builtin.include_tasks: install_release.yml

        - name: Qualify the signed pair, stop owned writers, install and activate only supporting clients
          ansible.builtin.command:
            argv: '{{ ev_command }}'
            stdin: '{{ ev_request | combine({"request":ev_request.request | combine({"action":item})}) | to_json }}'
          loop: [qualify, begin, install, activate-support]
          changed_when: true
