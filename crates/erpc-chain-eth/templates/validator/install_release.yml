#
# Puts the pinned pair under /opt/erpc-eth-validator/<pair>/, unless it is there. Each
# archive is checked against the digest pinned at init and against its
# release's GPG signature, made by the key erpc carries for that client,
# before it is unpacked; each binary must then report the pinned release.
# The `current` link is not touched here.
---
- name: Download each archive, refused unless it has the pinned digest
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ eth_opt }}/{{ item.url | basename }}"
    checksum: "sha256:{{ item.sha256 }}"
    use_netrc: false
    owner: root
    group: root
    mode: "0644"
  loop: "{{ eth_archives }}"
  loop_control:
    label: "{{ item.client }}"

- name: Download each archive's signature
  ansible.builtin.get_url:
    url: "{{ item.url }}.asc"
    dest: "{{ eth_opt }}/{{ item.url | basename }}.asc"
    use_netrc: false
    owner: root
    group: root
    mode: "0644"
  loop: "{{ eth_archives }}"
  loop_control:
    label: "{{ item.client }}"

# A keyring made for this check only, holding the one key that signs
# the client's releases; the signature must be good and made by it.
- name: Check each archive's signature against its client's key
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      erpc_gpg_home=$(/usr/bin/mktemp -d "{{ playbook_dir }}/../.verify-XXXXXX")
      trap '/usr/bin/rm -rf -- "$erpc_gpg_home"' EXIT
      /usr/bin/gpg --no-options --batch --quiet --homedir "$erpc_gpg_home" --import "{{ eth_gpg }}/{{ item.client }}.asc" 2>/dev/null
      /usr/bin/gpg --no-options --batch --homedir "$erpc_gpg_home" --status-fd 1 \
        --verify "{{ eth_opt }}/{{ item.url | basename }}.asc" "{{ eth_opt }}/{{ item.url | basename }}" 2>/dev/null \
        | /usr/bin/grep -E '^\[GNUPG:\] VALIDSIG .*\b{{ item.fingerprint }}$'
    executable: /bin/bash
  loop: "{{ eth_archives }}"
  loop_control:
    label: "{{ item.client }}"
  changed_when: false

- name: Extract only regular signed client files through original protected descriptors
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -c, '{{ ev_loader }}', '{{ playbook_dir }}/../authority/eth_validator_control.py', request]
    stdin: '{{ ev_request | combine({"request":ev_request.request | combine({"action":"extract","archives":{"reth":(eth_reth_url | basename),"lighthouse":(eth_lighthouse_url | basename)}})}) | to_json }}'
  changed_when: true

- name: Remove the downloaded archives and signatures
  ansible.builtin.file:
    path: "{{ eth_opt }}/{{ item.0.url | basename }}{{ item.1 }}"
    state: absent
  loop: "{{ eth_archives | product(['', '.asc']) | list }}"
  loop_control:
    label: "{{ item.0.client }}{{ item.1 }}"

# Reth prints its version and full commit; Lighthouse only its tag.
- name: Check Reth is the pinned release
  ansible.builtin.command:
    argv: [/usr/bin/setpriv, --reuid, '{{ ev_accounts.users["ev-reth"].uid }}', --regid, '{{ ev_accounts.users["ev-reth"].gid }}', --clear-groups, --no-new-privs, '{{ eth_release_dir }}.pending-{{ ev_intent }}/reth', --version]
  register: eth_reth_reported
  changed_when: false
  failed_when: >-
    eth_reth_reported.rc != 0 or
    (eth_reth_reported.stdout | regex_search('Version: ' ~ (eth_reth_version[1:] | regex_escape) ~ '(?:\s|[-+]|$)')) is none or
    (eth_reth_reported.stdout | regex_search('Commit SHA: ' ~ eth_reth_commit ~ '(?:\s|$)')) is none

- name: Check Lighthouse is the pinned release
  ansible.builtin.command:
    argv: [/usr/bin/setpriv, --reuid, '{{ ev_accounts.users["ev-beacon"].uid }}', --regid, '{{ ev_accounts.users["ev-beacon"].gid }}', --clear-groups, --no-new-privs, '{{ eth_release_dir }}.pending-{{ ev_intent }}/lighthouse', --version]
  register: eth_lighthouse_reported
  changed_when: false
  failed_when: >-
    eth_lighthouse_reported.rc != 0 or
    (eth_lighthouse_reported.stdout | regex_search('Lighthouse ' ~ (eth_lighthouse_version | regex_escape) ~ '(?:\s|-|$)')) is none
