---
- name: Inspect dedicated native Solana capacity before reserving inventory
  hosts: all
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Inspect qualified platform and the three existing filesystems
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, '{{ solana_native_loader }}', '{{ playbook_dir }}/../../node/native_runtime_control.py', play]
        stdin: '{{ solana_native_request | to_json }}'
      changed_when: false
