---
- name: Upgrade original native data-opening authority without starting a runtime
  hosts: all
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Retain independent original history and stop before upgrading authority
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, '{{ solana_native_loader }}', '{{ playbook_dir }}/../../node/native_runtime_control.py', play]
        stdin: '{{ solana_native_request | combine({"action":"upgrade-source-authority"}) | to_json }}'
      changed_when: true
