# Что erpc ai показывает, прежде чем инструмент что-то оплатит, завершит или
# изменит: человек читает это и отвечает да или нет, поэтому что оплачивается,
# что нельзя отменить и какой доступ даётся, должно звучать так же ясно, как
# по-английски.

[label]
product = "Продукт"
price = "Цена"
setting = "Настройка"
credit = "Баланс"
lasts = "Хватит на"
price_now = "Цена сейчас"
address = "Адрес"
vault = "Хранилище"
why = "Почему"
key = "Ключ"
credits = "Кредиты"
subtotal = "Без НДС"
vat = "НДС"
total = "Итого"
from = "Откуда"
to = "Куда"
network = "Сеть"
valid_until = "Цена действует до"
server = "Сервер"
host_key = "Ключ хоста"
your_key = "Ваш ключ"
changes = "Изменения"
allowed = "Разрешены"
yours_now = "Ваш адрес сейчас"
safety = "Защита"
note = "Учтите"
script = "Скрипт оболочки"
command = "Команда"
folder = "Каталог"
ends = "До"

[start]
title = "Запустить {product} с почасовой оплатой? Оплата списывается, пока продукт не будет завершён."
price = "{hourly} в час ({daily} в сутки), списывается с баланса кредитов ERPC"
lasts = "около {hours} ч при расходе {rate} в час с учётом всех запущенных сервисов"

[end]
title = "Завершить {product}? Продукт будет остановлен, списания прекратятся; отменить это нельзя."
price = "{hourly} в час"

[wallet]
found_title = "Использовать ваш кошелёк ERPC, который уже есть в 1Password?"
new_title = "Создать новый кошелёк в сети Base для покупки кредитов ERPC?"
vault = "хранилище 1Password {vault}"
ai_may_pay = "может запрашивать оплату с него; каждый платёж всё равно требует вашего подтверждения"
ai_may_not = "не может им пользоваться"
one_wallet = "erpc использует один кошелёк, чтобы ваши EURC хранились в одном месте"
key = "создаётся на этом компьютере и хранится только в 1Password (никогда на диске)"

[top_up]
vat = "{amount} EURC (ставка {rate})"
to = "{to} (казначейство ERPC)"
network = "Base, EURC; газ оплачивает ERPC"

[top_up.title]
one = "Купить {n} кредит ERPC за {total} EURC с вашего кошелька?"
few = "Купить {n} кредита ERPC за {total} EURC с вашего кошелька?"
many = "Купить {n} кредитов ERPC за {total} EURC с вашего кошелька?"

[secure]
title = "Войти на {ip} от вашего имени, добавить ваш ключ и отключить вход по паролю?"
changes = "ваш ключ будет добавлен; вход по паролю будет отключён навсегда; если sudo запрашивает пароль, пользователь, под которым выполнен вход, получит sudo без пароля"

[ssh_open]
title = "Снова разрешить SSH к {ip} с любых адресов?"

[ssh_only]
title = "Разрешить SSH к {ip} только с этих адресов?"
safety = "изменение отменится само, если erpc не сможет снова войти в течение {seconds} с"
note = "если ваш адрес изменится, SSH будет отклоняться, пока его снова не разрешат"

[command]
title = "Выполнить команду на этом компьютере"

[every_command]
title = "Разрешить все команды до выхода из erpc ai? Команды и скрипты оболочки будут выполняться на этом компьютере без вопросов."
ends = "выхода из erpc ai или начала нового разговора (/new или /clear)"
note = "вывод команды передаётся ERPC AI, и перед запуском ничего не спрашивается: команда может вывести файл ключа или пароль"
