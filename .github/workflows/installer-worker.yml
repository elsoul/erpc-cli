#
# Deploys the install.erpc.global Worker. Typecheck on PRs; deploy only from
# main through the protected `release` environment (human approval).
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on this account only),
# CLOUDFLARE_ACCOUNT_ID. Neither is committed.

name: installer-worker

on:
  pull_request:
    paths: ["installer/**", ".github/workflows/installer-worker.yml", "dist-workspace.toml"]
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/installer-worker.yml", "dist-workspace.toml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: installer

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  against-real-installers:
    name: body check vs the generated installers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-dist@0.32.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      # The unit tests use hand-copied fixtures; this builds the real
      # artifacts and checks the predicate and the fixtures against them.
      # Round 4 shipped a predicate written from the upstream template that
      # rejected every real PowerShell installer, and nothing caught it.
      - run: dist build --artifacts=global
      - run: node installer/scripts/verify-against-real-installers.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: [typecheck, against-real-installers]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
