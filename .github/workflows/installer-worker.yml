#
# Deploys the install.erpc.global Worker. Typecheck on PRs; deploy only from
# main through the protected `release` environment (human approval).
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on this account only),
# CLOUDFLARE_ACCOUNT_ID. Neither is committed.

name: installer-worker

on:
  pull_request:
    paths: ["installer/**", ".github/workflows/installer-worker.yml"]
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/installer-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: installer

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck

  deploy:
    if: github.event_name != 'pull_request'
    needs: typecheck
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
