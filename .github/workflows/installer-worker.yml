#
# Deploys the install.erpc.global Worker. Typecheck on PRs; deploy only from
# main through the protected `release` environment (human approval).
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on this account only),
# CLOUDFLARE_ACCOUNT_ID. Neither is committed.
#
# The bundle is built in `bundle`, a job with no environment and no secrets,
# because building runs `npm ci` with package install scripts. `deploy`
# installs with --ignore-scripts and uploads that bundle as it is
# (--no-bundle), so no install script runs in the job that holds the
# Cloudflare token. The packages' own code still runs there: wrangler is
# what uploads the bundle. scripts/tests/installer-deploy.test.sh pins this
# file's SHA-256: any edit here fails that test until its digest is updated
# in the same pull request, after reading the checklist there.

name: installer-worker

on:
  pull_request:
    paths: ["installer/**", ".github/workflows/installer-worker.yml", "dist-workspace.toml", "Cargo.toml"]
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/installer-worker.yml", "dist-workspace.toml", "Cargo.toml"]
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: installer

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  against-real-installers:
    name: body check vs the generated installers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-dist@0.32.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      # The unit tests use hand-copied fixtures; this builds the real
      # artifacts and checks the predicate and the fixtures against them.
      # Round 4 shipped a predicate written from the upstream template that
      # rejected every real PowerShell installer, and nothing caught it.
      - run: dist build --artifacts=global
      - run: node installer/scripts/verify-against-real-installers.mjs

  bundle:
    name: bundle the worker (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
      # Bundles exactly as a deploy would and stops before uploading.
      - run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"
      # The source map too: wrangler uploads it beside the Worker, as a
      # bundling deploy does. Nothing else: in --no-bundle mode wrangler can
      # upload other files in dist as modules (a dry run with 4.151.3
      # attached .wasm, .txt, .html, .sql and .bin files).
      # Kept 7 days so a deploy approved late can still fetch it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-worker-bundle
          path: |
            installer/dist/index.js
            installer/dist/index.js.map
          if-no-files-found: error
          retention-days: 7

  deploy:
    concurrency:
      group: installer-production
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    needs: [typecheck, against-real-installers, bundle]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      # wrangler only, to upload; no install script runs in this job.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installer-worker-bundle
          path: installer/dist
      - id: release
        name: Select the published release with the workflow token
        run: node scripts/select-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx wrangler deploy --no-bundle dist/index.js --var "LATEST_RELEASE:$LATEST_RELEASE" --var "LATEST_RELEASE_SOURCE:$LATEST_RELEASE_SOURCE"
        env:
          LATEST_RELEASE: ${{ steps.release.outputs.tag }}
          LATEST_RELEASE_SOURCE: ${{ steps.release.outputs.source }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
