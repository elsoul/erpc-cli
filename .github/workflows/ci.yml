#
# Continuous integration for pull requests and main.
# Actions are pinned to commit SHAs by scripts/pin-actions.sh.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

# clippy and test (ubuntu-latest) run on the repository's self-hosted Linux
# runners when the repository variable CI_SELF_HOSTED_LINUX names their label,
# and only for code from this repository. A pull request from a fork stays on
# ubuntu-latest, and so does any run of a dependency-update bot: Dependabot or
# Renovate as the actor, the triggering actor, the sender or the pull
# request's author, or a dependabot/ or renovate/ branch. The runners refuse
# the same jobs themselves and end them before their first step.
#
# This routing is not a guard: a fork's pull request can rewrite runs-on. A
# run from an outside contributor's fork waits for a maintainer's approval,
# and the runners refuse a fork's jobs.
# scripts/tests/self-hosted-routing.test.sh is a regression check on these
# workflows: it expects each runs-on to be a GitHub-hosted label, a matrix of
# them, release.yml's `dist plan` matrix, or this expression with exactly
# these conditions, and a cache step in a job routed here to keep
# `if: runner.environment == 'github-hosted'`.
#
# Clearing the variable sends every job back to ubuntu-latest; nothing else
# changes. The template jobs stay on ubuntu-latest: with the Rust cache they
# finish there sooner than a cold build does on the runners.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: >-
      ${{
        vars.CI_SELF_HOSTED_LINUX != ''
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.actor)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.triggering_actor)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.event.sender.login)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
        && !contains(github.head_ref, 'dependabot/') && !contains(github.head_ref, 'renovate/')
        && !contains(github.ref, 'dependabot/') && !contains(github.ref, 'renovate/')
        && vars.CI_SELF_HOSTED_LINUX || 'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
          components: clippy
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: >-
      ${{
        matrix.os == 'ubuntu-latest'
        && vars.CI_SELF_HOSTED_LINUX != ''
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.actor)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.triggering_actor)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.event.sender.login)
        && !contains(fromJSON('["dependabot[bot]","dependabot-preview[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
        && !contains(github.head_ref, 'dependabot/') && !contains(github.head_ref, 'renovate/')
        && !contains(github.ref, 'dependabot/') && !contains(github.ref, 'renovate/')
        && vars.CI_SELF_HOSTED_LINUX || matrix.os
      }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
          components: clippy
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # fallback: none, so that a version install-action does not list fails
      # here instead of being fetched without the listed SHA-256 check.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      # cargo-nextest runs the test binaries side by side, each test in a
      # process of its own, where cargo test runs the binaries one after
      # another. The same tests run either way.
      # Keep going after a failing test, so one run reports every failure.
      - run: cargo nextest run --workspace --locked --no-fail-fast
      # cargo-nextest does not run doctests. They run after a failing test
      # too, for the same reason.
      - if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --doc
      - run: cargo run --locked -- version --json
      - name: Lint the opt-in Node Check
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p erpc -p erpc-api --all-targets --features erpc/node-check-pilot -- -D warnings
      - name: Test the opt-in Node Check
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p erpc -p erpc-api --features erpc/node-check-pilot --no-fail-fast -E 'test(node_check) | binary(node_check_entry)'

  # The worker agents erpc embeds are cross-built with zig before every
  # release build (.github/build-setup.yml) on cargo-dist's four runners; both
  # macOS targets build on macos-15. Those steps never ran in CI before the
  # first tag, so the same script runs here, on the same runner images
  # (`dist plan` names them; rebuild-runners.test.sh checks the full runner set
  # and the Linux rebuild pair). The agents' bytes are not compared across
  # runners here; rebuild-compare does that for the Linux targets at release
  # time.
  worker-agents:
    name: worker agents (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
          use-cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-zigbuild@0.24.0
      - name: build the worker agents as a release build does
        shell: bash
        run: scripts/build-worker-agents.sh
      - name: the binary refuses to build without them
        shell: bash
        run: |
          set -euo pipefail
          # The script exported ERPC_WORKER_AGENTS_DIR and
          # ERPC_REQUIRE_WORKER_AGENTS=1 for the steps after it; a build of
          # erpc here embeds them, as the release build does.
          cargo check -p erpc --locked
      # The Intel macOS release is cross-compiled on this image
      # (dist-workspace.toml), and a pull request runs only `dist plan`, so
      # the cross build is done here too: a pull request finds out before a
      # tag does. No other CI job builds for x86_64-apple-darwin.
      - name: the Intel macOS binary cross-builds on Apple Silicon
        if: matrix.runner == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin
          cargo build -p erpc --locked --target x86_64-apple-darwin
          bin=target/x86_64-apple-darwin/debug/erpc
          archs=$(lipo -archs "$bin")
          [ "$archs" = x86_64 ] || { echo "built for '$archs', not x86_64"; exit 1; }
          # Run it where the image has Rosetta 2; it is not part of every
          # Apple Silicon image, so its absence is reported, not failed.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$bin" version --json
          else
            echo "no Rosetta 2 on this runner: built for x86_64, not run"
          fi

  # The templates are not members of the workspace: nothing above compiles
  # them. This renders one as `erpc worker init` does and runs its own
  # checks, so that its tests (what the bot will not buy, how it reads a
  # migration, how it plans a sell) cannot stop running unnoticed.
  template:
    name: pumpfun template (render, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
          components: clippy
      # The template needs Rust 1.98.1 (solana-stream-sdk 5.0.0 asks for
      # it): its steps run on that, and erpc itself, which renders it, on
      # the workspace's toolchain.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: clippy
      # The template's build output is kept beside the rendered directory,
      # not in it: a restored cache must not make that directory, which
      # `erpc worker init` refuses to write into when it exists. The
      # directory does not exist either when the cache is restored, so its
      # lock is not in the cache's own key: it is named here, and a change
      # to the template's dependencies starts afresh.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('crates/erpc-worker/templates/solana/pumpfun/Cargo.lock.tmpl', 'crates/erpc-worker/templates/solana/pumpfun/Cargo.toml.tmpl') }}
          workspaces: |
            .
            template-ci/pumpfun-ci -> ../pumpfun-target
      - name: render the template
        run: |
          mkdir -p template-ci
          cargo run --locked -- worker init --template pumpfun --name pumpfun-ci --into template-ci --no-git --yes
      - name: clippy and tests, as shipped (with the UDP source)
        working-directory: template-ci/pumpfun-ci
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
          CARGO_TARGET_DIR: ${{ github.workspace }}/template-ci/pumpfun-target
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: clippy and tests, without the UDP source
        working-directory: template-ci/pumpfun-ci
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
          CARGO_TARGET_DIR: ${{ github.workspace }}/template-ci/pumpfun-target
        run: |
          cargo clippy --all-targets --locked --no-default-features -- -D warnings
          cargo test --locked --no-default-features
      # The template's lock becomes the Cargo.lock of every app made from
      # it, and the cargo-deny and cargo-audit jobs below do not see it: the
      # template is no member of the workspace. Its exceptions, each with
      # its date and reason, are in
      # crates/erpc-worker/template-checks/solana/pumpfun/.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo-audit on the template's lock
        working-directory: template-ci/pumpfun-ci
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          mkdir -p .cargo
          cp "$GITHUB_WORKSPACE/crates/erpc-worker/template-checks/solana/pumpfun/audit.toml" .cargo/audit.toml
          cargo audit --deny warnings
      - name: cargo-deny on the template's lock
        working-directory: template-ci/pumpfun-ci
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: cargo deny --locked --config "$GITHUB_WORKSPACE/crates/erpc-worker/template-checks/solana/pumpfun/deny.toml" check

  # The same for the template `init` makes when nothing is picked: its lock
  # must build as written, and what it answers is pinned by its own tests.
  # It is rendered outside the checkout, where an operator's app is: inside
  # it, this repository's rustfmt.toml and clippy.toml would be applied to
  # the app, which has neither.
  template-hello:
    name: hello template (render, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: render the template
        run: |
          mkdir -p "$RUNNER_TEMP/template-ci"
          cargo run --locked -- worker init --name hello-ci --into "$RUNNER_TEMP/template-ci" --no-git --yes
          grep -q '^template = "solana/hello@1"$' "$RUNNER_TEMP/template-ci/hello-ci/erpc.toml"
      - name: fmt, clippy and tests
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cd "$RUNNER_TEMP/template-ci/hello-ci"
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: 1.98.0

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5

  secrets:
    name: gitleaks + public hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action requires a commercial license for organisations; run the
      # Apache-2.0 binary directly, pinned by version and sha256.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          rm -f gitleaks gitleaks.tar.gz
      - name: gitleaks (full history)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --exit-code 1 .'
      # The self-tests run every case twice, in the C locale and in a
      # dictionary-collation UTF-8 one, because that is where bash ranges
      # change meaning. They refuse to run if no such locale exists rather
      # than quietly checking half of what their name claims, so generate it.
      - name: ensure a dictionary-collation UTF-8 locale exists
        run: |
          set -euo pipefail
          sudo locale-gen en_US.UTF-8
          # Captured, not piped into `grep -q`: under `set -o pipefail` the
          # -q exit closes the pipe, the producer dies of SIGPIPE and the
          # pipeline reports failure. That is the pattern the self-test
          # harness had to stop using for exactly this reason.
          have=$(locale -a || true)
          printf '%s\n' "$have" | grep -qi '^en_US\.utf-\?8$' || {
            echo "locale-gen did not produce en_US.UTF-8; the suite needs a"
            echo "dictionary-collation locale to check what its name claims."
            exit 1
          }
      - name: gate self-tests
        run: |
          scripts/tests/check-oss-hygiene.test.sh
          scripts/tests/check-endpoints.test.sh
          scripts/tests/build-manifest.test.sh
          scripts/tests/release-wiring.test.sh
          scripts/tests/workflow-audit.test.sh
          scripts/tests/self-hosted-routing.test.sh
      - name: hygiene gate (all tracked files)
        run: scripts/check-oss-hygiene.sh
      - name: endpoint allowlist (all tracked files)
        run: scripts/check-endpoints.sh

  gates-bash32:
    name: gates under bash 3.2 (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: confirm the shell really is bash 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash --version | head -1 | grep -q 'version 3\.2\.' || {
            echo "macos-latest no longer ships bash 3.2; this job no longer tests what its name claims"
            exit 1
          }
      - name: gates and their self-tests under /bin/bash
        run: |
          /bin/bash scripts/check-oss-hygiene.sh
          /bin/bash scripts/check-endpoints.sh
          /bin/bash scripts/tests/check-oss-hygiene.test.sh
          /bin/bash scripts/tests/check-endpoints.test.sh
          /bin/bash scripts/tests/build-manifest.test.sh
          /bin/bash scripts/tests/release-wiring.test.sh
          /bin/bash scripts/tests/workflow-audit.test.sh
          /bin/bash scripts/tests/self-hosted-routing.test.sh

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Fail the job on findings; this also works without paid code scanning.
          advanced-security: false
          min-severity: medium
          persona: regular

  dist-plan:
    name: cargo-dist plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-dist@0.32.0
      - run: dist plan
      - run: dist generate --check
      - name: rebuild-compare runs where dist builds
        run: scripts/tests/rebuild-runners.test.sh
