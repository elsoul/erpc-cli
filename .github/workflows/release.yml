name: Release npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @elsoul/erpc-cli
    if: github.event.release.prerelease == false
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@11.19.1
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify release identity
        run: node scripts/verify-release.mjs "${{ github.event.release.tag_name }}"
      - run: corepack pnpm release:check
      - run: corepack pnpm pack:check
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
