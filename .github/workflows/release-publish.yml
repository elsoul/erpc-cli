#
# Custom publish workflow called by the cargo-dist generated release.yml
# (publish-jobs = ["./release-publish"]). It runs after dist built and
# attested the artifacts and BEFORE the GitHub Release is created (announce).
#
#   release-gate -> rebuild-compare -> sign (env `release`) -> publish-crates
#
# Secrets (GitHub environment `release`, values held by ELSOUL LABO B.V.):
#   MINISIGN_SECRET_KEY, MINISIGN_PASSWORD      minisign signing key
# crates.io uses Trusted Publishing (OIDC): no token.

name: release-publish

on:
  workflow_call:
    inputs:
      plan:
        description: dist plan JSON
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: tag == Cargo version, commit on main, CHANGELOG entry
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          version="${tag#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="erpc") | .version')
          [ "$version" = "$cargo_version" ] || { echo "tag $tag != Cargo version $cargo_version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release commit is not on main"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          rust-version: 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  rebuild-compare:
    name: rebuild and compare (${{ matrix.target }})
    needs: release-gate
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-dist@0.32.0,cargo-auditable,cargo-zigbuild
      - name: independent rebuild with fixed SOURCE_DATE_EPOCH
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          dist build --artifacts=local --target ${{ matrix.target }} --output-format=json > rebuild.json
          rebuilt=$(jq -r '.artifacts | to_entries[] | select(.value.kind=="executable-zip") | .value.path' rebuild.json | head -1)
          [ -n "$rebuilt" ] && [ -f "$rebuilt" ] || { echo "rebuild produced no archive"; exit 1; }
          orig="artifacts/$(basename "$rebuilt")"
          [ -f "$orig" ] || { echo "no published archive to compare against: $orig"; exit 1; }
          mkdir -p a b
          tar -C a -xf "$orig"; tar -C b -xf "$rebuilt"
          # `find` exits 0 when it matches nothing, so an empty result would
          # otherwise compare "" with "" and report a successful check.
          na=$(find a -type f -name erpc | wc -l | tr -d ' ')
          nb=$(find b -type f -name erpc | wc -l | tr -d ' ')
          [ "$na" = "1" ] && [ "$nb" = "1" ] || { echo "expected exactly one erpc binary per archive, found $na and $nb"; exit 1; }
          ha=$(find a -type f -name erpc -exec sha256sum {} \; | cut -d' ' -f1)
          hb=$(find b -type f -name erpc -exec sha256sum {} \; | cut -d' ' -f1)
          [ -n "$ha" ] && [ -n "$hb" ] || { echo "could not hash one of the binaries"; exit 1; }
          echo "original: $ha"; echo "rebuilt:  $hb"
          [ "$ha" = "$hb" ] || { echo "binary hash mismatch for ${{ matrix.target }}"; exit 1; }

  sign:
    name: manifest + sign (approval)
    needs: [release-gate, rebuild-compare]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - run: sudo apt-get update -q && sudo apt-get install -y -q minisign
      - name: build and sign release-manifest.json
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          COMMIT: ${{ needs.release-gate.outputs.commit }}
        run: |
          set -euo pipefail
          scripts/release/build-manifest.sh artifacts "$TAG" "$COMMIT" > artifacts/release-manifest.json
          scripts/release/sign-manifest.sh artifacts/release-manifest.json
      # The name MUST match the `pattern:` the generated release.yml's announce
      # job downloads with (`artifacts-*`), because that download is the only
      # thing that puts a file in front of `gh release create`. Named
      # `signed-manifest`, both files were uploaded, never downloaded, and so
      # never attached to the release -- while docs/verify-release.md tells the
      # operator to fetch and verify them. scripts/tests/release-wiring.test.sh
      # asserts the two sides still agree; nothing else would notice, because
      # this path does not run in CI.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-signed-manifest
          path: |
            artifacts/release-manifest.json
            artifacts/release-manifest.json.minisig
          if-no-files-found: error

  publish-crates:
    name: crates.io (trusted publishing)
    needs: [release-gate, sign]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
