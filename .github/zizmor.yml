#
# zizmor configuration. release.yml is generated by cargo-dist (`dist generate`)
# and must not be hand-edited; its findings are reviewed with each cargo-dist
# upgrade instead. All hand-written workflows are audited at full strength.

rules:
  template-injection:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      # The generated workflow calls release-publish.yml and installer-worker.yml.
      # Both are repository-owned workflows with protected release environments.
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      # cargo-dist needs `contents: write` at workflow level to create the GitHub Release.
      - release.yml
