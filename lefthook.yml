# Install with `lefthook install`. Requires gitleaks and cargo on PATH.

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --config .gitleaks.toml
    public-hosts:
      glob: "*"
      run: scripts/check-public-hosts.sh {staged_files}
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

pre-push:
  commands:
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    test:
      run: cargo test --workspace
