#
# Install with `lefthook install`. Requires gitleaks and cargo on PATH.
# Never bypass these with `git commit --no-verify`; if a rule is wrong, change
# the rule in the same commit. See docs/secret-exposure-response.md.

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --config .gitleaks.toml
    oss-hygiene:
      glob: "*"
      run: scripts/check-oss-hygiene.sh {staged_files}
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

pre-push:
  parallel: true
  commands:
    gitleaks-history:
      run: gitleaks git --redact --config .gitleaks.toml .
    oss-hygiene-all:
      run: scripts/check-oss-hygiene.sh
    hygiene-self-test:
      run: scripts/tests/check-oss-hygiene.test.sh
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    test:
      run: cargo test --workspace
